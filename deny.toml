# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
#
#   cargo deny check
#
# Dependencies must use licences compatible with distributing this project
# under AGPL-3.0-or-later. Only licences actually used are listed. Adding one
# needs a review: permissive licences (MIT-0, CC0-1.0…) are fine, MPL-2.0 is
# compatible through its "Secondary License" clause; GPL-2.0-only, SSPL,
# BUSL and "non-commercial" licences are not.

[graph]
all-features = false

[advisories]
# Known vulnerabilities and unmaintained crates (RustSec) fail the build.
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-or-later",
]

[[licenses.clarify]]
# This crate itself.
crate = "pulsars-api"
expression = "AGPL-3.0-or-later"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# OpenSSL is not used: TLS goes through rustls everywhere.
deny = [
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
