openapi: 3.1.0
info:
  title: Pulsars public API
  version: 1.0.0
  summary: Read-only access to published Pulsars content.
  description: |
    Read-only API over the published content of https://pulsars.science:
    courses, lessons, exercises, exams and free resources.

    Conventions (pagination, errors, languages, caching, rate limits) are
    described in `README.md` next to this file and apply to every endpoint.

    What is never returned, by design:
    - unpublished content (drafts, archived, awaiting review): it answers 404;
    - solutions and expected answers: exercise `solution_md`, QCM `correctes`,
      short-answer `acceptees`, exam `corrige_md` and the correction PDF.
      The game may reuse this content, so an exposed answer is a cheat;
    - personal data beyond the public profile (no e-mail, IP, school level,
      locale, social logins).

    All examples are real values from the Laravel seeders
    (`database/seeders/CoursMathsSeeder.php`, `data/cours/*.json`,
    `data/examens/*.php`, `ConcoursCentraleSeeder.php`, `RessourceSeeder.php`).
    Numeric ids are those of a fresh local seed and differ in production.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  contact:
    url: https://pulsars.science
servers:
  - url: https://api.pulsars.science
    description: Production
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
  - name: catalog
  - name: courses
  - name: exercises
  - name: exams
  - name: resources
  - name: account
  - name: game
    description: |
      Flash duels (`docs/game-protocol.md`). Matches themselves run over the
      WebSocket `GET /v1/game/ws` (protocol §3), which is not described
      here.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness and readiness probe
      description: |
        No authentication, no rate limit, `Cache-Control: no-store`.
        `200` when PostgreSQL answers (Redis down only degrades the service:
        content stays readable, the game does not). `503` when PostgreSQL is
        down. Errors carry only a short code, never a DSN or a message.
      responses:
        '200':
          description: Service operational or degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              examples:
                ok:
                  value:
                    status: ok
                    version: 1.0.0
                    checked_at: '2026-10-13T10:12:31Z'
                    checks:
                      - { name: postgres, ok: true, duration_ms: 0.8, error: null }
                      - { name: redis, ok: true, duration_ms: 0.2, error: null }
                degraded:
                  value:
                    status: degraded
                    version: 1.0.0
                    checked_at: '2026-10-13T10:12:31Z'
                    checks:
                      - { name: postgres, ok: true, duration_ms: 0.9, error: null }
                      - { name: redis, ok: false, duration_ms: 1000.0, error: timeout }
        '503':
          description: PostgreSQL unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example:
                status: down
                version: 1.0.0
                checked_at: '2026-10-13T10:12:31Z'
                checks:
                  - { name: postgres, ok: false, duration_ms: 1000.0, error: connection_refused }
                  - { name: redis, ok: true, duration_ms: 0.2, error: null }

  /v1/catalog:
    get:
      tags: [catalog]
      operationId: getCatalog
      summary: Subjects and topics of the published courses
      description: |
        **Transitional shape.** The target taxonomy is domain → subject →
        topic, but it does not exist in the code: a course has a single
        free-text `theme`. The API derives the tree from it:

        - `"Mathématiques – Analyse"` → subject `Mathématiques`, topic `Analyse`
          (split on the first `" – "`, an en dash surrounded by spaces);
        - `"Mathématiques"` (four hand-written courses) → subject
          `Mathématiques`, no topic: those courses are counted in the
          subject's `course_count` but in no topic.

        `taxonomy` is `"theme"` while this derivation is in use; it becomes
        `"domain-subject-topic"` once Laravel stores the real taxonomy, and
        `domains` is then added (additive change).

        Subject names are translated when `lang=en` (from Laravel's
        `lang/en.json`: Mathématiques → Mathematics). **Topic names are never
        translated**: no translation exists for them today.

        Sorted by subject name, then topic name. Not paginated (about 60 topics).
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The catalogue
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
              example:
                data:
                  taxonomy: theme
                  lang: fr
                  subjects:
                    - slug: chimie
                      name: Chimie
                      course_count: 17
                      topics:
                        - { slug: la-matiere, name: La matière, course_count: 4 }
                        - { slug: transformations, name: Transformations, course_count: 7 }
                    - slug: mathematiques
                      name: Mathématiques
                      course_count: 109
                      topics:
                        - { slug: algebre, name: Algèbre, course_count: 13 }
                        - { slug: analyse, name: Analyse, course_count: 31 }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/courses:
    get:
      tags: [courses]
      operationId: listCourses
      summary: Published courses
      description: |
        Only courses with `statut = publie` and a `published_at` in the past.
        Sorted by `title` (original French title), then `id`.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: subject
          in: query
          description: Subject slug from `/v1/catalog` (e.g. `mathematiques`).
          schema: { type: string, maxLength: 100, example: mathematiques }
        - name: topic
          in: query
          description: Topic slug from `/v1/catalog`. Requires `subject`.
          schema: { type: string, maxLength: 100, example: analyse }
        - name: difficulty
          in: query
          schema: { $ref: '#/components/schemas/Difficulty' }
        - name: level
          in: query
          description: |
            School level. **Derived from free tags**, not from a column: a
            course has the level if its tags contain one of the spellings
            Laravel uses (`collège`/`college`, `lycée`/`lycee`, `supérieur`).
            Courses without such a tag match no level.
          schema: { $ref: '#/components/schemas/Level' }
        - name: tag
          in: query
          description: Exact free tag (e.g. `calcul`).
          schema: { type: string, maxLength: 50 }
        - name: available_in
          in: query
          description: |
            Only courses that have a translation in this language. `fr`
            matches every course (French is the source language).
          schema: { $ref: '#/components/schemas/LangCode' }
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: A page of courses
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CourseSummary' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
              examples:
                page:
                  $ref: '#/components/examples/CoursesPage'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/courses/{slug}:
    get:
      tags: [courses]
      operationId: getCourse
      summary: A published course with its outline
      description: |
        The outline lists chapters, their lessons (title and slug, **without**
        content: fetch each lesson separately) and their exercises (title and
        type, without question: fetch each exercise separately).
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The course
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CourseDetail' }
              example:
                data:
                  id: 1
                  slug: les-bases-du-calcul
                  lang: fr
                  title: Les bases du calcul
                  description: Priorités opératoires, fractions, puissances et pourcentages. De quoi calculer juste, sans calculatrice. Aucun prérequis.
                  theme: Mathématiques
                  subject: { slug: mathematiques, name: Mathématiques }
                  topic: null
                  difficulty: debutant
                  levels: []
                  duration_minutes: 60
                  tags: [maths, calcul]
                  author: jikuji
                  chapter_count: 2
                  lesson_count: 4
                  exercise_count: 5
                  available_langs: [fr, en]
                  published_at: '2026-08-17T09:27:34Z'
                  updated_at: '2026-08-17T09:27:34Z'
                  web_url: https://pulsars.science/cours/les-bases-du-calcul
                  chapters:
                    - position: 1
                      title: L'ordre des opérations
                      lang: fr
                      lessons:
                        - { slug: priorites-operatoires, position: 1, title: Les priorités opératoires, lang: fr }
                        - { slug: les-fractions, position: 2, title: Les fractions, lang: fr }
                      exercises:
                        - { id: 1, position: 1, type: qcm, title: Appliquer les priorités, lang: fr }
                        - { id: 2, position: 2, type: reponse_courte, title: Simplifier une fraction, lang: fr }
                    - position: 2
                      title: Puissances et pourcentages
                      lang: fr
                      lessons:
                        - { slug: les-puissances, position: 1, title: Les puissances, lang: fr }
                        - { slug: les-pourcentages, position: 2, title: Les pourcentages, lang: fr }
                      exercises:
                        - { id: 3, position: 1, type: qcm, title: Vrai ou faux sur les puissances, lang: fr }
                        - { id: 4, position: 2, type: reponse_courte, title: Calculer un pourcentage, lang: fr }
                        - { id: 5, position: 3, type: reponse_libre, title: Le piège des pourcentages, lang: fr }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/courses/{slug}/lessons/{lesson}:
    get:
      tags: [courses]
      operationId: getLesson
      summary: One lesson of a published course
      description: |
        `lesson` is the lesson slug. Laravel only guarantees its uniqueness
        **within a chapter** (`unique(chapter_id, slug)`); no course currently
        has two lessons with the same slug. If that ever happens the API
        returns the one with the lowest (chapter position, lesson position).
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
        - name: lesson
          in: path
          required: true
          schema: { type: string, example: les-fractions }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The lesson
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Lesson' }
              examples:
                fr:
                  value:
                    data:
                      slug: priorites-operatoires
                      lang: fr
                      title: Les priorités opératoires
                      position: 1
                      content_md: "Combien vaut `2 + 3 x 4` ?\n\nCertains répondent 20, d'autres 14. Un seul des deux à raison — et ce n'est pas\nune question d'opinion : il existe une règle, et tout le monde l'applique, des\ncalculatrices aux ordinateurs.\n\n## La règle\n\nOn calcule dans cet ordre :\n\n1. Ce qui est entre **parenthèses**\n2. Les **puissances**\n3. Les **multiplications et divisions**\n4. Les **additions et soustractions**\n\n…"
                      chapter: { position: 1, title: L'ordre des opérations, lang: fr }
                      course: { slug: les-bases-du-calcul, title: Les bases du calcul, lang: fr }
                      previous: null
                      next: { slug: les-fractions, title: Les fractions }
                      updated_at: '2026-08-13T18:59:10Z'
                      web_url: https://pulsars.science/cours/les-bases-du-calcul/lecon/priorites-operatoires
                en:
                  value:
                    data:
                      slug: priorites-operatoires
                      lang: en
                      title: Operational priorities
                      position: 1
                      content_md: "What is `2 + 3 x 4` equal to?\n\nSome say 20, others 14. Only one of the two is correct — and it’s not\na matter of opinion: there is a rule, and everyone follows it, from\ncalculators to computers.\n\n## The rule\n\n…"
                      chapter: { position: 1, title: The order of operations, lang: en }
                      course: { slug: les-bases-du-calcul, title: The basics of the calculation, lang: en }
                      previous: null
                      next: { slug: les-fractions, title: Fractions }
                      updated_at: '2026-08-13T18:59:10Z'
                      web_url: https://pulsars.science/cours/les-bases-du-calcul/lecon/priorites-operatoires
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/exercises:
    get:
      tags: [exercises]
      operationId: listExercises
      summary: Exercises of published courses, without answers
      description: Sorted by `id`.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: course
          in: query
          description: Course slug.
          schema: { type: string, example: les-bases-du-calcul }
        - name: subject
          in: query
          schema: { type: string, example: mathematiques }
        - name: topic
          in: query
          description: Requires `subject`.
          schema: { type: string, example: analyse }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ExerciseType' }
        - name: difficulty
          in: query
          description: Difficulty of the parent course (exercises have none of their own).
          schema: { $ref: '#/components/schemas/Difficulty' }
      responses:
        '200':
          description: A page of exercises
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Exercise' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
              examples:
                page:
                  $ref: '#/components/examples/ExercisesPage'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/exercises/{id}:
    get:
      tags: [exercises]
      operationId: getExercise
      summary: One exercise, without its answer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1, example: 1 }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The exercise
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Exercise' }
              examples:
                qcm:
                  $ref: '#/components/examples/ExerciseQcmResponse'
                qcmMultiple:
                  value:
                    data:
                      id: 3
                      lang: fr
                      type: qcm
                      title: Vrai ou faux sur les puissances
                      question_md: Parmi ces égalités, lesquelles sont **vraies** ?
                      options:
                        - { id: a, text: 2^3 x 2^4 = 2^7 }
                        - { id: b, text: 2^3 x 2^4 = 2^12 }
                        - { id: c, text: (-3)^2 = 9 }
                        - { id: d, text: -3^2 = 9 }
                        - { id: e, text: 5^0 = 1 }
                      multiple: true
                      position: 1
                      chapter: { position: 2, title: Puissances et pourcentages, lang: fr }
                      course: { slug: les-bases-du-calcul, title: Les bases du calcul, lang: fr, difficulty: debutant }
                      web_url: https://pulsars.science/cours/les-bases-du-calcul/exercice/3
                shortAnswer:
                  value:
                    data:
                      id: 2
                      lang: fr
                      type: reponse_courte
                      title: Simplifier une fraction
                      question_md: "Simplifie la fraction `18/24` au maximum.\n\nÉcris ta réponse sous la forme `a/b`."
                      options: null
                      multiple: null
                      position: 2
                      chapter: { position: 1, title: L'ordre des opérations, lang: fr }
                      course: { slug: les-bases-du-calcul, title: Les bases du calcul, lang: fr, difficulty: debutant }
                      web_url: https://pulsars.science/cours/les-bases-du-calcul/exercice/2
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/exams:
    get:
      tags: [exams]
      operationId: listExams
      summary: Published exam papers
      description: |
        Only `statut = publie` with a past `published_at`. Exams in
        `attente_import` or `brouillon` (awaiting human review of the AI
        import) are never returned. Sorted by `published_at` descending, then
        `id` descending.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ExamType' }
        - name: subject
          in: query
          schema: { $ref: '#/components/schemas/ExamSubject' }
        - name: level
          in: query
          description: Free-text level as stored (`3e`, `Terminale`, `CPGE`), exact match.
          schema: { type: string, maxLength: 50, example: Terminale }
        - name: session
          in: query
          description: Exact match on the session label (`2026`, `Session 2026 — 16 juin 2026`).
          schema: { type: string, maxLength: 80 }
        - name: country
          in: query
          schema: { type: string, pattern: '^[A-Z]{2}$', example: FR }
        - name: competition
          in: query
          description: Competitive exam key, only for `type=concours`.
          schema: { type: string, example: centrale-supelec }
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: A page of exams
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExamSummary' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
              examples:
                page:
                  $ref: '#/components/examples/ExamsPage'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/exams/{slug}:
    get:
      tags: [exams]
      operationId: getExam
      summary: A published exam with its statements, without corrections
      description: |
        Parts carry their statement (`enonce_md`) only. The model answer
        (`corrige_md`) and the correction PDF are **never** returned, even
        though the website shows them: the game may reuse exam questions.
        Exam `title` and `description` are not translatable in Laravel; only
        parts are.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: baccalaureat-general-2026-mathematiques-specialite-jour-1 }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The exam
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ExamDetail' }
              example:
                data:
                  id: 2
                  slug: baccalaureat-general-2026-mathematiques-specialite-jour-1
                  lang: fr
                  title: Baccalauréat général 2026 — Mathématiques, spécialité (jour 1)
                  type: bac
                  competition: null
                  subject: mathematiques
                  country: FR
                  level: Terminale
                  tracks: []
                  session: Session 2026 — 16 juin 2026
                  duration_minutes: 240
                  total_points: 20
                  part_count: 4
                  pdf_url: https://pulsars.science/examens/baccalaureat-general-2026-mathematiques-specialite-jour-1/telecharger
                  official_url: null
                  source_url: null
                  published_at: '2026-08-13T09:32:04Z'
                  web_url: https://pulsars.science/examens/baccalaureat-general-2026-mathematiques-specialite-jour-1
                  description: "Sujet de spécialité mathématiques du baccalauréat général, session 2026, épreuve du 16 juin (sujet 26-MATJ1ME1). Quatre exercices : probabilités et inégalité de Bienaymé-Tchebychev, vrai/faux en géométrie dans l'espace et dénombrement, équation différentielle et suite pour un système de chauffage, étude d'une fonction avec logarithme."
                  parts:
                    - id: 46
                      position: 1
                      lang: fr
                      title: "Exercice 1 — Probabilités : traversée en navire"
                      points: 5
                      statement_md: "Un navire assure la liaison entre deux ports de la Méditerranée. Lors d'une traversée, une famille a la possibilité de réserver une cabine ainsi qu'un emplacement…"
                    - id: 47
                      position: 2
                      lang: fr
                      title: "Exercice 2 — Vrai/faux : géométrie dans l'espace et dénombrement"
                      points: 4
                      statement_md: "*Pour chacune des affirmations suivantes, indiquer si elle est vraie ou fausse. Justifier chaque réponse. Une réponse non justifiée ne rapporte aucun point.*…"
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/resources:
    get:
      tags: [resources]
      operationId: listResources
      summary: Published free resources
      description: Only `statut = publie`. Sorted by `created_at` descending, then `id` descending.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: category
          in: query
          description: Exact match on the **original** (French) category, e.g. `Mathématiques`.
          schema: { type: string, maxLength: 120 }
        - name: doc_lang
          in: query
          description: Language of the document itself (not of its description).
          schema: { type: string, maxLength: 8, example: en }
        - name: mode
          in: query
          schema: { $ref: '#/components/schemas/ResourceMode' }
        - name: license
          in: query
          schema: { type: string, example: cc0-1.0 }
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: A page of resources
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Resource' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
              examples:
                page:
                  $ref: '#/components/examples/ResourcesPage'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/resources/{slug}:
    get:
      tags: [resources]
      operationId: getResource
      summary: One published resource, with licence and attribution
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: misselbooks-abstract-algebra }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The resource
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Resource' }
              examples:
                hostedWithLicence:
                  $ref: '#/components/examples/ResourceAbstractAlgebraResponse'
                hostedWithoutLicence:
                  summary: A hosted article whose licence was never recorded
                  value:
                    data:
                      id: 1
                      slug: article-chimie-inorganique-ic901972h
                      lang: fr
                      title: 'Tripodal 4-Pyridyl-Derived Host Ligands and Their Metallo-Supramolecular Chemistry: Stella Octangula and Bowl-Shaped Assemblies'
                      description: Un article de recherche en chimie inorganique, à télécharger en PDF.
                      category: Chimie
                      doc_lang: en
                      mode: host
                      attribution: null
                      license: null
                      download_url: https://pulsars.science/ressources/article-chimie-inorganique-ic901972h/telecharger
                      source_url: null
                      size_bytes: 3451711
                      created_at: '2026-08-07T14:44:26Z'
                      updated_at: '2026-08-07T14:44:26Z'
                      web_url: https://pulsars.science/ressources/article-chimie-inorganique-ic901972h
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/me:
    get:
      tags: [account]
      operationId: getMe
      summary: Public profile of the token's user
      description: |
        Returns exactly what `https://pulsars.science/membres/{pseudo}` shows to
        anyone, minus school level and class (see `game-design.md` /
        decisions): pseudo, avatar, bio, roles, membership date, XP and level,
        plus the member's brains balance (`brains.md` §4; always shown to its
        owner, whatever `cerveaux_publics` says). Never e-mail, locale, social
        logins or moderation state.

        `Cache-Control: private, no-store`.
      security:
        - gameToken: []
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Me' }
              example:
                data:
                  id: '1'
                  pseudo: jikuji
                  avatar_url: null
                  bio: null
                  member_since: '2026-08-07T14:44:15Z'
                  roles:
                    - { slug: super-admin, name: Super admin, category: permission, color: '#d1544f' }
                  xp:
                    total: 0
                    level: 1
                    level_start: 0
                    next_level_at: 100
                  brains: 0
                  profile_url: https://pulsars.science/membres/jikuji
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The account in `sub` no longer exists (deleted after the token was issued).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/game/leaderboard:
    get:
      tags: [game]
      operationId: getGameLeaderboard
      summary: Best Glicko-2 ratings of a subject
      description: |
        Players with at least one ranked match (1 vs 1 between accounts) in
        `subject`, best rating first. Equal shown ratings share a rank.
        Pseudo and avatar come from `api_read.members`; deleted accounts are
        skipped. A rating whose deviation (RD) is above 110 is
        `provisional`.

        Public: any origin, no token. `Cache-Control: public, max-age=30`.
      parameters:
        - name: subject
          in: query
          schema: { $ref: '#/components/schemas/GameSubject' }
          description: Absent → `all`.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: The leaderboard
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=30' }
          content:
            application/json:
              schema:
                type: object
                required: [subject, data]
                properties:
                  subject: { $ref: '#/components/schemas/GameSubject' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GameLeader' }
              example:
                subject: maths
                data:
                  - { rank: 1, user_id: '2', pseudo: ada, avatar_url: null, rating: 1662,
                      provisional: true, games: 1, wins: 1, losses: 0, draws: 0 }
                  - { rank: 2, user_id: '1', pseudo: jikuji, avatar_url: null, rating: 1338,
                      provisional: true, games: 1, wins: 0, losses: 1, draws: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/game/me:
    get:
      tags: [game]
      operationId: getGameMe
      summary: The token's brains, ratings and last matches
      description: |
        The brains balance of the token's account (`brains.md` §4; 0 for an
        account without movements). Every rating of the token's account (one per subject key it played
        ranked, `all` included) with its rank in that subject's leaderboard,
        and its last 20 finished matches of any mode, newest first.
        `opponents` are the names of the other seats (players, guests and
        ghosts) as they were at match time.

        Only the game front end may call it from a browser (restricted CORS).
        `Cache-Control: no-store`.
      security:
        - gameToken: []
      responses:
        '200':
          description: Ratings and recent matches
          content:
            application/json:
              schema:
                type: object
                required: [brains, ratings, recent]
                properties:
                  brains:
                    type: integer
                    minimum: 0
                    description: Brains balance (`api_read.member_brains`), always shown to its owner.
                  ratings:
                    type: array
                    items: { $ref: '#/components/schemas/GameRating' }
                  recent:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/GameRecentMatch' }
              example:
                brains: 42
                ratings:
                  - { subject: maths, rating: 1338, provisional: true, games: 1, wins: 0,
                      losses: 1, draws: 0, rank: 2 }
                recent:
                  - match_id: 01a149ed-26f2-765b-911c-736104ab6a2a
                    mode: duel
                    ranked: true
                    subject: maths
                    rules: { duration: null, target: 10, penalty: false }
                    ended_at: '2026-10-17T12:54:18Z'
                    end_reason: completed
                    outcome: loss
                    score: 6
                    rating_before: 1500
                    rating_after: 1338
                    opponents: [ada]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The token's `sub` is not an account id.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/game/admin/stats:
    get:
      tags: [game]
      operationId: getGameAdminStats
      summary: Game statistics for the admin dashboard
      description: |
        What is live now (from the game server's memory) and the activity
        of the last `days` UTC days (from the `game` schema), for the
        Laravel admin dashboard, which calls it server to server and shows
        the result (`game-protocol.md` §9.1).

        The token's `roles` must contain `admin` or `super-admin`, else
        `403` with `reason: insufficient_scope`. Restricted CORS like
        `/v1/game/me`; a request without `Origin` is served as usual.
        `Cache-Control: no-store`.

        All times are UTC; days and hours without matches are zeros. A match
        counts on the day and hour of its `started_at`, from the moment it
        is created (running matches included). Today's `accounts` and
        `guests` include the seats of the matches running now.
      security:
        - gameToken: []
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
          description: Days in `daily`, ending today; also the period of `subjects`, `rules` and `quality`.
      responses:
        '200':
          description: The statistics
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameAdminStats' }
              example:
                generated_at: '2026-10-17T13:40:00Z'
                live:
                  sessions: 12
                  guests: 4
                  queued: 2
                  rooms_open: 1
                  matches: { duel: 3, room: 1, ghost: 2 }
                  players_in_matches: 9
                today:
                  matches_started: 41
                  by_hour: [0, 0, 0, 0, 0, 0, 0, 1, 2, 4, 6, 5, 7, 9, 7, 0, 0, 0, 0, 0, 0, 0, 0, 0]
                  accounts: 17
                  guests: 6
                daily:
                  - { date: '2026-10-16', duel: 30, room: 4, ghost: 6, ranked: 25, void: 2,
                      forfeit: 3, accounts: 21, guests: 9 }
                  - { date: '2026-10-17', duel: 31, room: 4, ghost: 6, ranked: 26, void: 1,
                      forfeit: 2, accounts: 17, guests: 6 }
                subjects:
                  - { subject: maths, matches: 120 }
                  - { subject: physics, matches: 31 }
                  - { subject: all, matches: 12 }
                  - { subject: chemistry, matches: 4 }
                  - { subject: computer-science, matches: 0 }
                rules:
                  - { rules: { duration: 60, target: null, penalty: false }, matches: 80 }
                  - { rules: { duration: null, target: 10, penalty: true }, matches: 41 }
                quality: { avg_match_seconds: 64.2, avg_answers_per_player: 23.1, accuracy: 0.71 }
                ratings:
                  players: 25
                  provisional: 18
                  by_subject:
                    - { subject: maths, players: 20 }
                    - { subject: physics, players: 7 }
                    - { subject: all, players: 3 }
                    - { subject: chemistry, players: 1 }
                    - { subject: computer-science, players: 0 }
                webhook: { pending: 0, dead: 0 }
                seasons:
                  - { month: '2026-09', subject: maths, ranked_players: 6, closed_at: '2026-10-01T00:00:12Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: The database or the game server does not answer.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    gameToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        EdDSA (Ed25519) JWT issued by `POST https://pulsars.science/jeu/jeton`.
        See `auth-jwt.md`.

  parameters:
    Lang:
      name: lang
      in: query
      description: |
        Language of the content. Absent → original language (`fr`). Falls back
        to French per object and per field when a translation is missing; each
        object says what it got in its own `lang` field.
      schema: { $ref: '#/components/schemas/LangCode' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque value from a previous `next_cursor`. Only valid with the same filters.
      schema: { type: string, maxLength: 512 }
    Search:
      name: q
      in: query
      description: |
        Case-insensitive substring search on title and description, in the
        original text and in the translation for `lang`. Minimum 2 characters.
      schema: { type: string, minLength: 2, maxLength: 100 }
    CourseSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, example: les-bases-du-calcul }

  headers:
    ETag:
      description: Strong validator, hash of the response body.
      schema: { type: string, example: '"5f2b9c1e"' }
    CacheControlPublic:
      schema: { type: string, example: 'public, max-age=300, stale-while-revalidate=60' }
    RateLimitLimit:
      schema: { type: integer, example: 60 }
    RateLimitRemaining:
      schema: { type: integer, example: 57 }
    RateLimitReset:
      description: Seconds until the window resets.
      schema: { type: integer, example: 41 }
    RetryAfter:
      schema: { type: integer, example: 12 }

  responses:
    NotModified:
      description: The `If-None-Match` value matches; no body.
    BadRequest:
      description: Invalid parameter or cursor
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.pulsars.science/problems/invalid-parameter
            title: Invalid parameter
            status: 400
            detail: One or more query parameters are invalid.
            instance: /v1/courses?limit=500
            errors:
              - { parameter: limit, detail: must be between 1 and 100 }
    NotFound:
      description: Unknown or unpublished resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.pulsars.science/problems/not-found
            title: Resource not found
            status: 404
            detail: No published course has the slug 'les-bases-du-calcul-2'.
            instance: /v1/courses/les-bases-du-calcul-2
    Unauthorized:
      description: Missing, invalid or expired token
      headers:
        WWW-Authenticate:
          schema: { type: string, example: 'Bearer error="invalid_token", error_description="token expired"' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.pulsars.science/problems/unauthorized
            title: Invalid token
            status: 401
            detail: The token has expired.
            instance: /v1/me
            reason: expired
    InsufficientScope:
      description: Valid token, but its `roles` do not allow this action
      headers:
        WWW-Authenticate:
          schema: { type: string, example: 'Bearer realm="api.pulsars.science", error="insufficient_scope"' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.pulsars.science/problems/insufficient-scope
            title: Insufficient scope
            status: 403
            detail: The game statistics need the admin or super-admin role.
            instance: /v1/game/admin/stats
            reason: insufficient_scope
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.pulsars.science/problems/rate-limited
            title: Too many requests
            status: 429
            detail: Limit of 60 requests per minute reached.

