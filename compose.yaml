# Local development services. Not for production.
#
#   docker compose up -d       start PostgreSQL and Redis
#   docker compose down -v     stop and delete the data (re-runs the init)
#
# PostgreSQL runs scripts/dev-db-init.sh on its first start: roles, schemas,
# the tables of migrations/ and the demo data of dev/db/30-demo-data.sql.

services:
  postgres:
    # Debian, not Alpine: scripts/dev-db-init.sh needs sha384sum.
    image: postgres:17
    environment:
      POSTGRES_DB: pulsars
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev/db/docker-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./scripts:/workspace/scripts:ro
      - ./dev:/workspace/dev:ro
      - ./deploy/sql:/workspace/deploy/sql:ro
      - ./migrations:/workspace/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulsars"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
