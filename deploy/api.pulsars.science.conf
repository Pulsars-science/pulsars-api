# nginx vhost for api.pulsars.science, in front of pulsars-api.
#
#   sudo cp api.pulsars.science.conf /etc/nginx/sites-available/pulsars-api
#   sudo ln -s /etc/nginx/sites-available/pulsars-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The certificate must exist first (`certbot certonly --nginx -d
# api.pulsars.science`, docs/deployment.md): this file already holds the 443
# block and the redirect from port 80, and certbot renews the certificate in
# place without touching it.
#
# It lives next to the pulsars.science vhost (pulsars-web): nginx picks the
# server by `server_name`.
#
# Everything defined outside the `server` blocks lands in the shared `http`
# context, shared with the other sites, so every name here starts with
# `pulsars_api`. In particular a site vhost often maps
# `$connection_upgrade`: nginx accepts a second `map` for it without a word,
# and one of the two would then silently apply to both sites.

upstream pulsars_api {
    server 127.0.0.1:8080;
    # Reused connections to the API: no TCP handshake per request.
    keepalive 16;
}

# WebSocket: `Connection: upgrade` when the client asks for it. Without an
# Upgrade header, an empty Connection keeps the upstream connection alive.
map $http_upgrade $pulsars_api_connection {
    default upgrade;
    ''      '';
}

# Flood guard only. The real limits (60/min per IP, 120/min per token) are
# counted by the API in Redis; they fail open while Redis is down, this does
# not. 10 requests a second with a burst of 40 is far above any honest client.
limit_req_zone $binary_remote_addr zone=pulsars_api:10m rate=10r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.pulsars.science;

    ssl_certificate /etc/letsencrypt/live/api.pulsars.science/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pulsars.science/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # The API refuses bodies above BODY_LIMIT_BYTES (64 KiB) with a JSON
    # problem. nginx stops what is far bigger before it reaches the API.
    # Uploads (avatars, PDFs) go through pulsars.science, never here
    # (docs/deployment.md).
    client_max_body_size 256k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    limit_req zone=pulsars_api burst=40 nodelay;
    limit_req_status 429;

    # The API already sets `X-Content-Type-Options: nosniff` and
    # `X-Robots-Tag: noindex, nofollow` on every response: not repeated here.
    # These are the ones it does not set. `always`: errors carry them too.
    # No `add_header` may appear inside a `location` below: one there would
    # silently drop all of these for that location.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # JSON only: a response must never be rendered as a page or framed.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;

    # Headers sent to the API, for every location.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The API takes the client IP from the LAST X-Forwarded-For entry
    # (src/middleware.rs, `client_ip`) and keys the anonymous rate limit on
    # it. Replacing the header with the address nginx sees, instead of
    # appending to what the client sent, leaves exactly one entry that the
    # client cannot choose. Change this only together with the code.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $pulsars_api_connection;

    proxy_connect_timeout 5s;
    # Above the API's own REQUEST_TIMEOUT_SECS (10), so that the API answers
    # with its JSON 503 timeout problem rather than nginx with a 504 page.
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    location / {
        proxy_pass http://pulsars_api;
    }

    # The match WebSocket. Idle timeouts are long: the game server
    # must ping more often than this, or nginx closes quiet matches.
    location = /v1/game/ws {
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_pass http://pulsars_api;
    }

    # Metrics are served on a separate loopback listener (127.0.0.1:9464)
    # that nginx never proxies to. The public listener has no /metrics
    # route either; this keeps it that way whatever the API does.
    location = /metrics {
        return 404;
    }

    error_log  /var/log/nginx/pulsars-api.error.log;
    access_log /var/log/nginx/pulsars-api.access.log;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.pulsars.science;

    # certbot's nginx plugin adds the ACME challenge location here, for the
    # duration of each renewal.
    location / {
        return 301 https://api.pulsars.science$request_uri;
    }
}
