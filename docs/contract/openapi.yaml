openapi: 3.1.0
info:
  title: Pulsars API
  version: 0.6.0
  summary: The back end of pulsars.science and its game server.
  description: |
    The API of https://pulsars.science. It owns the database and serves
    every feature: the published content (courses, lessons, exercises,
    exams, free resources, news, languages), the members' accounts and
    progress, the forum and its moderation, the social part, the
    administration and the game.

    Three kinds of callers:
    - `pulsars-web`, the site, server to server: the member's session in
      `Pulsars-Session` and the site's key in `Pulsars-Service-Key`;
    - the games (`pulsars.science/jeux`) and the languages section
      (`pulsars.science/langues`): a short game token from
      `POST /v1/auth/token`, signed by the API (`gameToken`);
    - anyone, for the public content.

    Conventions (pagination, errors, languages, caching, rate limits) are
    described in `README.md` next to this file and apply to every endpoint.

    What the public content routes never return, by design:
    - unpublished content (drafts, archived, awaiting review): it answers 404;
    - solutions and expected answers: exercise `solution_md`, QCM `correctes`,
      short-answer `acceptees`, exam `corrige_md` and the correction PDF.
      The game may reuse this content, so an exposed answer is a cheat.
      Only the member routes show them, under the old site's rules (a
      solution after an attempt, an exam's corrections on its page);
    - personal data beyond the public profile (no e-mail, IP, school level,
      locale, social logins).

    All examples are real values from the old site's seeders
    (`database/seeders/CoursMathsSeeder.php`, `data/cours/*.json`,
    `data/examens/*.php`, `ConcoursCentraleSeeder.php`, `RessourceSeeder.php`).
    Numeric ids are those of a fresh local seed and differ in production.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  contact:
    url: https://pulsars.science
servers:
  - url: https://api.pulsars.science
    description: Production
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
  - name: catalog
  - name: courses
  - name: exercises
  - name: exams
  - name: resources
  - name: news
    description: Announcements of the team, as on https://pulsars.science/actualite.
  - name: auth
    description: |
      Logging in, signing up, sessions and passwords, called by the site from
      its server (`auth-sessions.md`). A session is an opaque token given back
      in `Pulsars-Session`.
  - name: account
  - name: languages
    description: |
      The languages taught on `pulsars.science/langues` (`docs/languages.md`):
      their levels and the words of each level. Written by the API itself
      (schema `langues`).
  - name: forum
    description: |
      The questions and answers forum (Laravel's `/forum`). Read by
      everyone; written by verified members who are not muted. Bodies are
      Markdown with LaTeX (`body_md`), rendered by the site.
  - name: forum-moderation
    description: |
      Hiding, locking, pinning, deleting and restoring forum messages, and
      muting members. Moderators only (`site.roles.niveau` ≥ 1, verified).
  - name: admin
    description: |
      The administration of the site (Laravel's `admin/*`), for a session
      whose member is an admin (verified, welcome steps done, permission
      level 2 or more; `403` otherwise). Called by the site from its server:
      no CORS, every answer `Cache-Control: no-store`. Lists are numbered
      pages with `page`, `per_page`, `total` and per-status `counters`.
      News, courses and exams are addressed by slug, as Laravel did.
  - name: progress
    description: |
      A member's progress on the courses (Laravel's `Progression`). Routes
      of the site's members take `Pulsars-Session`; their answers are never
      cached.
  - name: practice
    description: Exercises as members do them, graded by the API (`CorrecteurExercice`).
  - name: dashboard
    description: The member's dashboard, brains (`brains.md`) and the XP leaderboards.
  - name: profile
    description: The member's settings, welcome steps, language and avatar.
  - name: feedback
    description: Reports (with their captcha), suggestions, proposed resources, the donations goal.
  - name: game
    description: |
      Flash duels (`docs/game-protocol.md`). Matches themselves run over the
      WebSocket `GET /v1/game/ws` (protocol §3), which is not described
      here.
  - name: members
    description: |
      Public profiles and the pseudo search (`ProfilPublicController`), and
      follows (`AbonnementController`). Called by the site from its server.
  - name: friends
    description: Friend requests and the friend QR code (`AmitieController`, `AmiQrController`).
  - name: rooms
    description: |
      Rooms, their threads and invitation links (`Salon*Controller`,
      `InvitationSalonController`). Threads are polled with `?after={id}`.
  - name: conversations
    description: |
      Private messages between friends (`DiscussionController`,
      `MessagePriveController`), sealed at rest with `MESSAGES_KEY`.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness and readiness probe
      description: |
        No authentication, no rate limit, `Cache-Control: no-store`.
        `200` when PostgreSQL answers (Redis down only degrades the service:
        content stays readable, the game does not). `503` when PostgreSQL is
        down. Errors carry only a short code, never a DSN or a message.
      responses:
        '200':
          description: Service operational or degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              examples:
                ok:
                  value:
                    status: ok
                    version: 1.0.0
                    checked_at: '2026-10-13T10:12:31Z'
                    checks:
                      - { name: postgres, ok: true, duration_ms: 0.8, error: null }
                      - { name: redis, ok: true, duration_ms: 0.2, error: null }
                degraded:
                  value:
                    status: degraded
                    version: 1.0.0
                    checked_at: '2026-10-13T10:12:31Z'
                    checks:
                      - { name: postgres, ok: true, duration_ms: 0.9, error: null }
                      - { name: redis, ok: false, duration_ms: 1000.0, error: timeout }
        '503':
          description: PostgreSQL unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example:
                status: down
                version: 1.0.0
                checked_at: '2026-10-13T10:12:31Z'
                checks:
                  - { name: postgres, ok: false, duration_ms: 1000.0, error: connection_refused }
                  - { name: redis, ok: true, duration_ms: 0.2, error: null }

  /v1/catalog:
    get:
      tags: [catalog]
      operationId: getCatalog
      summary: Subjects and topics of the published courses
      description: |
        **Transitional shape.** The target taxonomy is domain → subject →
        topic, but it does not exist in the code: a course has a single
        free-text `theme`. The API derives the tree from it:

        - `"Mathématiques – Analyse"` → subject `Mathématiques`, topic `Analyse`
          (split on the first `" – "`, an en dash surrounded by spaces);
        - `"Mathématiques"` (four hand-written courses) → subject
          `Mathématiques`, no topic: those courses are counted in the
          subject's `course_count` but in no topic.

        `taxonomy` is `"theme"` while this derivation is in use; it becomes
        `"domain-subject-topic"` once the schema stores the real taxonomy, and
        `domains` is then added (additive change).

        Subject names are translated when `lang=en` (`contenu.matieres`,
        taken from the old site's `lang/en.json`: Mathématiques →
        Mathematics). **Topic names are never
        translated**: no translation exists for them today.

        Sorted by subject name, then topic name. Not paginated (about 60 topics).
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The catalogue
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
              example:
                data:
                  taxonomy: theme
                  lang: fr
                  subjects:
                    - slug: chimie
                      name: Chimie
                      course_count: 17
                      topics:
                        - { slug: la-matiere, name: La matière, course_count: 4 }
                        - { slug: transformations, name: Transformations, course_count: 7 }
                    - slug: mathematiques
                      name: Mathématiques
                      course_count: 109
                      topics:
                        - { slug: algebre, name: Algèbre, course_count: 13 }
                        - { slug: analyse, name: Analyse, course_count: 31 }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/courses:
    get:
      tags: [courses]
      operationId: listCourses
      summary: Published courses
      description: |
        Only courses with `statut = publie` and a `published_at` in the past.
        Sorted by `title` (original French title), then `id`.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: subject
          in: query
          description: Subject slug from `/v1/catalog` (e.g. `mathematiques`).
          schema: { type: string, maxLength: 100, example: mathematiques }
        - name: topic
          in: query
          description: Topic slug from `/v1/catalog`. Requires `subject`.
          schema: { type: string, maxLength: 100, example: analyse }
        - name: difficulty
          in: query
          schema: { $ref: '#/components/schemas/Difficulty' }
        - name: level
          in: query
          description: |
            School level. **Derived from free tags**, not from a column: a
            course has the level if its tags contain one of the spellings
            the content uses (`collège`/`college`, `lycée`/`lycee`, `supérieur`).
            Courses without such a tag match no level.
          schema: { $ref: '#/components/schemas/Level' }
        - name: tag
          in: query
          description: Exact free tag (e.g. `calcul`).
          schema: { type: string, maxLength: 50 }
        - name: available_in
          in: query
          description: |
            Only courses that have a translation in this language. `fr`
            matches every course (French is the source language).
          schema: { $ref: '#/components/schemas/LangCode' }
        - name: theme
          in: query
          description: Exact `theme`, as the course gives it (`Chimie – La matière`).
          schema: { type: string, maxLength: 50 }
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          description: |
            `title` (default): original title, then `id`. `recent`: latest
            `published_at` first, then highest `id`. A cursor is only valid
            with the order it was issued for.
          schema: { type: string, enum: [title, recent], default: title }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of courses
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CourseSummary' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
                  total: { $ref: '#/components/schemas/Total' }
              examples:
                page:
                  $ref: '#/components/examples/CoursesPage'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/courses/{slug}:
    get:
      tags: [courses]
      operationId: getCourse
      summary: A published course with its outline
      description: |
        The outline lists chapters, their lessons (title and slug, **without**
        content: fetch each lesson separately) and their exercises (title and
        type, without question: fetch each exercise separately).
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The course
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CourseDetail' }
              example:
                data:
                  id: 1
                  slug: les-bases-du-calcul
                  lang: fr
                  title: Les bases du calcul
                  description: Priorités opératoires, fractions, puissances et pourcentages. De quoi calculer juste, sans calculatrice. Aucun prérequis.
                  theme: Mathématiques
                  subject: { slug: mathematiques, name: Mathématiques }
                  topic: null
                  difficulty: debutant
                  levels: []
                  duration_minutes: 60
                  tags: [maths, calcul]
                  author: jikuji
                  chapter_count: 2
                  lesson_count: 4
                  exercise_count: 5
                  available_langs: [fr, en, ru]
                  published_at: '2026-08-17T09:27:34Z'
                  updated_at: '2026-08-17T09:27:34Z'
                  web_url: https://pulsars.science/cours/les-bases-du-calcul
                  chapters:
                    - position: 1
                      title: L'ordre des opérations
                      lang: fr
                      lessons:
                        - { id: 1, slug: priorites-operatoires, position: 1, title: Les priorités opératoires, lang: fr }
                        - { id: 2, slug: les-fractions, position: 2, title: Les fractions, lang: fr }
                      exercises:
                        - { id: 1, position: 1, type: qcm, title: Appliquer les priorités, lang: fr }
                        - { id: 2, position: 2, type: reponse_courte, title: Simplifier une fraction, lang: fr }
                    - position: 2
                      title: Puissances et pourcentages
                      lang: fr
                      lessons:
                        - { id: 3, slug: les-puissances, position: 1, title: Les puissances, lang: fr }
                        - { id: 4, slug: les-pourcentages, position: 2, title: Les pourcentages, lang: fr }
                      exercises:
                        - { id: 3, position: 1, type: qcm, title: Vrai ou faux sur les puissances, lang: fr }
                        - { id: 4, position: 2, type: reponse_courte, title: Calculer un pourcentage, lang: fr }
                        - { id: 5, position: 3, type: reponse_libre, title: Le piège des pourcentages, lang: fr }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/courses/{slug}/lessons/{lesson}:
    get:
      tags: [courses]
      operationId: getLesson
      summary: One lesson of a published course
      description: |
        `lesson` is the lesson slug. The schema only guarantees its uniqueness
        **within a chapter** (`unique(chapter_id, slug)`); no course currently
        has two lessons with the same slug. If that ever happens the API
        returns the one with the lowest (chapter position, lesson position).
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
        - name: lesson
          in: path
          required: true
          schema: { type: string, example: les-fractions }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The lesson
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Lesson' }
              examples:
                fr:
                  value:
                    data:
                      id: 1
                      slug: priorites-operatoires
                      lang: fr
                      title: Les priorités opératoires
                      position: 1
                      content_md: "Combien vaut `2 + 3 x 4` ?\n\nCertains répondent 20, d'autres 14. Un seul des deux à raison — et ce n'est pas\nune question d'opinion : il existe une règle, et tout le monde l'applique, des\ncalculatrices aux ordinateurs.\n\n## La règle\n\nOn calcule dans cet ordre :\n\n1. Ce qui est entre **parenthèses**\n2. Les **puissances**\n3. Les **multiplications et divisions**\n4. Les **additions et soustractions**\n\n…"
                      chapter: { position: 1, title: L'ordre des opérations, lang: fr }
                      course: { slug: les-bases-du-calcul, title: Les bases du calcul, lang: fr }
                      previous: null
                      next: { slug: les-fractions, title: Les fractions }
                      updated_at: '2026-08-13T18:59:10Z'
                      web_url: https://pulsars.science/cours/les-bases-du-calcul/lecon/priorites-operatoires
                en:
                  value:
                    data:
                      id: 1
                      slug: priorites-operatoires
                      lang: en
                      title: Operational priorities
                      position: 1
                      content_md: "What is `2 + 3 x 4` equal to?\n\nSome say 20, others 14. Only one of the two is correct — and it’s not\na matter of opinion: there is a rule, and everyone follows it, from\ncalculators to computers.\n\n## The rule\n\n…"
                      chapter: { position: 1, title: The order of operations, lang: en }
                      course: { slug: les-bases-du-calcul, title: The basics of the calculation, lang: en }
                      previous: null
                      next: { slug: les-fractions, title: Fractions }
                      updated_at: '2026-08-13T18:59:10Z'
                      web_url: https://pulsars.science/cours/les-bases-du-calcul/lecon/priorites-operatoires
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/exercises:
    get:
      tags: [exercises]
      operationId: listExercises
      summary: Exercises of published courses, without answers
      description: Sorted by `id`.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: course
          in: query
          description: Course slug.
          schema: { type: string, example: les-bases-du-calcul }
        - name: subject
          in: query
          schema: { type: string, example: mathematiques }
        - name: topic
          in: query
          description: Requires `subject`.
          schema: { type: string, example: analyse }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ExerciseType' }
        - name: difficulty
          in: query
          description: Difficulty of the parent course (exercises have none of their own).
          schema: { $ref: '#/components/schemas/Difficulty' }
      responses:
        '200':
          description: A page of exercises
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Exercise' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
              examples:
                page:
                  $ref: '#/components/examples/ExercisesPage'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/exercises/{id}:
    get:
      tags: [exercises]
      operationId: getExercise
      summary: One exercise, without its answer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1, example: 1 }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The exercise
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Exercise' }
              examples:
                qcm:
                  $ref: '#/components/examples/ExerciseQcmResponse'
                qcmMultiple:
                  value:
                    data:
                      id: 3
                      lang: fr
                      type: qcm
                      title: Vrai ou faux sur les puissances
                      question_md: Parmi ces égalités, lesquelles sont **vraies** ?
                      options:
                        - { id: a, text: 2^3 x 2^4 = 2^7 }
                        - { id: b, text: 2^3 x 2^4 = 2^12 }
                        - { id: c, text: (-3)^2 = 9 }
                        - { id: d, text: -3^2 = 9 }
                        - { id: e, text: 5^0 = 1 }
                      multiple: true
                      position: 1
                      chapter: { position: 2, title: Puissances et pourcentages, lang: fr }
                      course: { slug: les-bases-du-calcul, title: Les bases du calcul, lang: fr, difficulty: debutant }
                      web_url: https://pulsars.science/cours/les-bases-du-calcul/exercice/3
                shortAnswer:
                  value:
                    data:
                      id: 2
                      lang: fr
                      type: reponse_courte
                      title: Simplifier une fraction
                      question_md: "Simplifie la fraction `18/24` au maximum.\n\nÉcris ta réponse sous la forme `a/b`."
                      options: null
                      multiple: null
                      position: 2
                      chapter: { position: 1, title: L'ordre des opérations, lang: fr }
                      course: { slug: les-bases-du-calcul, title: Les bases du calcul, lang: fr, difficulty: debutant }
                      web_url: https://pulsars.science/cours/les-bases-du-calcul/exercice/2
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/exams:
    get:
      tags: [exams]
      operationId: listExams
      summary: Published exam papers
      description: |
        Only `statut = publie` with a past `published_at`. Exams in
        `attente_import` or `brouillon` (awaiting human review of the AI
        import) are never returned. Sorted by `published_at` descending, then
        `id` descending.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ExamType' }
        - name: subject
          in: query
          schema: { $ref: '#/components/schemas/ExamSubject' }
        - name: level
          in: query
          description: Free-text level as stored (`3e`, `Terminale`, `CPGE`), exact match.
          schema: { type: string, maxLength: 50, example: Terminale }
        - name: session
          in: query
          description: Exact match on the session label (`2026`, `Session 2026 — 16 juin 2026`).
          schema: { type: string, maxLength: 80 }
        - name: country
          in: query
          schema: { type: string, pattern: '^[A-Z]{2}$', example: FR }
        - name: competition
          in: query
          description: Competitive exam key, only for `type=concours`.
          schema: { type: string, example: centrale-supelec }
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of exams
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExamSummary' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
                  total: { $ref: '#/components/schemas/Total' }
              examples:
                page:
                  $ref: '#/components/examples/ExamsPage'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/exams/facets:
    get:
      tags: [exams]
      operationId: getExamFacets
      summary: Levels and countries of published exams
      description: The values the `level` and `country` filters of `GET /v1/exams` can take, sorted.
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Filter values
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [levels, countries]
                    properties:
                      levels: { type: array, items: { type: string } }
                      countries: { type: array, items: { type: string, pattern: '^[A-Z]{2}$' } }
              example:
