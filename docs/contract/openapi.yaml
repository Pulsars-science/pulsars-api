        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/exams/{slug}/pdf:
    get:
      tags: [exams]
      operationId: getExamPdf
      summary: The statement PDF of a published exam
      description: |
        The file itself, read from the database (`contenu.fichiers`). Never the correction,
        never a draft's file (the correction is `…/correction-pdf`). With
        `disposition=attachment` it is a download: counted (the counters are
        in `GET /v1/exams/{slug}/corrections`; robots excepted, by
        `User-Agent`; a resumed range not again) and `Cache-Control:
        private, no-store`; `inline` is the preview. Supports `Range` (one range), `If-Range`,
        `If-None-Match` and `HEAD`; `Accept` is not checked.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: baccalaureat-general-2026-mathematiques-specialite-jour-1 }
        - $ref: '#/components/parameters/Disposition'
      responses:
        '200': { $ref: '#/components/responses/File' }
        '206': { $ref: '#/components/responses/FilePart' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416': { $ref: '#/components/responses/RangeNotSatisfiable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/resources/{slug}/file:
    get:
      tags: [resources]
      operationId: getResourceFile
      summary: The hosted file of a published resource
      description: |
        Only for `mode = host`. Same behaviour as `/v1/exams/{slug}/pdf`;
