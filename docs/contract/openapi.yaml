  schemas:
    LangCode:
      type: string
      enum: [fr, en]
    Difficulty:
      type: string
      enum: [debutant, intermediaire, avance]
      description: '`App\Enums\Difficulte`.'
    Level:
      type: string
      enum: [college, lycee, superieur]
      description: Normalised from the free tags `collège`/`college`, `lycée`/`lycee`, `supérieur`.
    ExerciseType:
      type: string
      enum: [qcm, reponse_courte, reponse_libre]
      description: |
        `App\Enums\TypeExercice`. `qcm` and `reponse_courte` are graded by the
        server; `reponse_libre` is never auto-graded (the learner compares
        with the solution).
    ExamType:
      type: string
      enum: [brevet, bac, blanc, concours]
    ExamSubject:
      type: string
      enum: [mathematiques, physique, chimie, informatique, sciences-industrielles, langues, redaction]
      description: '`App\Enums\MatiereExamen`. Independent from the course subjects.'
    ResourceMode:
      type: string
      enum: [host, link]
      description: |
        `host`: Pulsars serves the file (`download_url` is set; `source_url`,
        when set, credits where it came from). `link`: the resource lives on
        its author's site (`source_url` is the target, `download_url` is null).
    NextCursor:
      type: [string, 'null']
      description: Pass it as `cursor` to get the next page; null on the last page.

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [parameter, detail]
            properties:
              parameter: { type: string }
              detail: { type: string }
        reason:
          type: string
          description: For 401, why the token was refused; for 403, `insufficient_scope`. See `auth-jwt.md`.
          enum: [missing, malformed, expired, not_yet_valid, bad_signature, unknown_kid, bad_issuer, bad_audience, bad_algorithm, insufficient_scope]
        trace_id: { type: string }
      additionalProperties: false

    Health:
      type: object
      required: [status, version, checked_at, checks]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string }
        checked_at: { type: string, format: date-time }
        checks:
          type: array
          items:
            type: object
            required: [name, ok, duration_ms, error]
            properties:
              name: { type: string, enum: [postgres, redis] }
              ok: { type: boolean }
              duration_ms: { type: number }
              error:
                type: [string, 'null']
                description: Short code (`timeout`, `connection_refused`, `auth_failed`), never a raw message.

    SubjectRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, description: 'Slug of the subject name (`Mathématiques` → `mathematiques`).' }
        name: { type: string, description: Translated when `lang=en` and a translation exists. }
    TopicRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string, description: Never translated (no translation exists). }

    Catalog:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [taxonomy, lang, subjects]
          properties:
            taxonomy: { type: string, enum: [theme, domain-subject-topic] }
            lang: { $ref: '#/components/schemas/LangCode' }
            subjects:
              type: array
              items:
                type: object
                required: [slug, name, course_count, topics]
                properties:
                  slug: { type: string }
                  name: { type: string }
                  course_count: { type: integer, description: Includes courses without a topic. }
                  topics:
                    type: array
                    items:
                      type: object
                      required: [slug, name, course_count]
                      properties:
                        slug: { type: string }
                        name: { type: string }
                        course_count: { type: integer }

    CourseSummary:
      type: object
      required: [id, slug, lang, title, description, theme, subject, topic, difficulty, levels, duration_minutes, tags, author, chapter_count, lesson_count, exercise_count, available_langs, published_at, updated_at, web_url]
      properties:
        id: { type: integer }
        slug: { type: string }
        lang: { $ref: '#/components/schemas/LangCode' }
        title: { type: string, description: Translatable. }
        description: { type: string, description: Translatable. }
        theme:
          type: string
          description: Raw Laravel `theme`, kept so clients can display what the site displays.
        subject: { $ref: '#/components/schemas/SubjectRef' }
        topic:
          oneOf:
            - $ref: '#/components/schemas/TopicRef'
            - type: 'null'
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        levels:
          type: array
          items: { $ref: '#/components/schemas/Level' }
        duration_minutes: { type: [integer, 'null'] }
        tags:
          type: array
          items: { type: string }
          description: Free tags as stored, never translated.
        author:
          type: [string, 'null']
          description: Pseudo of the author account. Null if the account was deleted.
        chapter_count: { type: integer }
        lesson_count: { type: integer }
        exercise_count: { type: integer }
        available_langs:
          type: array
          items: { $ref: '#/components/schemas/LangCode' }
          description: '`fr` always; `en` when a course-level translation exists.'
        published_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        web_url: { type: string, format: uri }

    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/CourseSummary'
        - type: object
          required: [chapters]
          properties:
            chapters:
              type: array
              items:
                type: object
                required: [position, title, lang, lessons, exercises]
                properties:
                  position: { type: integer, description: 'Laravel `ordre`, starting at 1.' }
                  title: { type: string }
                  lang: { $ref: '#/components/schemas/LangCode' }
                  lessons:
                    type: array
                    items:
                      type: object
                      required: [slug, position, title, lang]
                      properties:
                        slug: { type: string }
                        position: { type: integer }
                        title: { type: string }
                        lang: { $ref: '#/components/schemas/LangCode' }
                  exercises:
                    type: array
                    items:
                      type: object
                      required: [id, position, type, title, lang]
                      properties:
                        id: { type: integer }
                        position: { type: integer }
                        type: { $ref: '#/components/schemas/ExerciseType' }
                        title: { type: string }
                        lang: { $ref: '#/components/schemas/LangCode' }

    LessonLink:
      type: object
      required: [slug, title]
      properties:
        slug: { type: string }
        title: { type: string }

    Lesson:
      type: object
      required: [slug, lang, title, position, content_md, chapter, course, previous, next, updated_at, web_url]
      properties:
        slug: { type: string }
        lang: { $ref: '#/components/schemas/LangCode' }
        title: { type: string }
        position: { type: integer }
        content_md: { type: string, description: Raw Markdown with LaTeX. Translatable. }
        chapter:
          type: object
          required: [position, title, lang]
          properties:
            position: { type: integer }
            title: { type: string }
            lang: { $ref: '#/components/schemas/LangCode' }
        course:
          type: object
          required: [slug, title, lang]
          properties:
            slug: { type: string }
            title: { type: string }
            lang: { $ref: '#/components/schemas/LangCode' }
        previous:
          description: Previous lesson in reading order across chapters.
          oneOf:
            - $ref: '#/components/schemas/LessonLink'
            - type: 'null'
        next:
          oneOf:
            - $ref: '#/components/schemas/LessonLink'
            - type: 'null'
        updated_at: { type: string, format: date-time }
        web_url: { type: string, format: uri }

    Exercise:
      type: object
      description: |
        Never contains the answer. Excluded on purpose: `solution_md`,
        `donnees.correctes` (QCM), `donnees.acceptees` (short answer), and the
        English translation of `solution_md`.
      required: [id, lang, type, title, question_md, options, multiple, position, chapter, course, web_url]
      properties:
        id: { type: integer }
        lang: { $ref: '#/components/schemas/LangCode' }
        type: { $ref: '#/components/schemas/ExerciseType' }
        title: { type: string }
        question_md: { type: string }
        options:
          description: |
            QCM choices, in stored order; null for other types. Option texts
            are **never translated** (they live in the `donnees` JSON, which
            Laravel does not translate).
          oneOf:
            - type: array
              items:
                type: object
                required: [id, text]
                properties:
                  id: { type: string }
                  text: { type: string }
            - type: 'null'
        multiple:
          type: [boolean, 'null']
          description: |
            QCM only: true when more than one option is correct (checkboxes
            rather than radio buttons). This is a deliberate, small hint that
            the website already gives. Null for other types.
        position: { type: integer }
        chapter:
          type: object
          required: [position, title, lang]
          properties:
            position: { type: integer }
            title: { type: string }
            lang: { $ref: '#/components/schemas/LangCode' }
        course:
          type: object
          required: [slug, title, lang, difficulty]
          properties:
            slug: { type: string }
            title: { type: string }
            lang: { $ref: '#/components/schemas/LangCode' }
            difficulty: { $ref: '#/components/schemas/Difficulty' }
        web_url: { type: string, format: uri }

    ExamSummary:
      type: object
      required: [id, slug, lang, title, type, competition, subject, country, level, tracks, session, duration_minutes, total_points, part_count, pdf_url, official_url, source_url, published_at, web_url]
      properties:
        id: { type: integer }
        slug: { type: string }
        lang:
          type: string
          const: fr
          description: Exam titles are not translatable in Laravel; always `fr`.
        title: { type: string }
        type: { $ref: '#/components/schemas/ExamType' }
        competition:
          type: [string, 'null']
          description: Competitive exam key (`centrale-supelec`), null for national exams.
        subject: { $ref: '#/components/schemas/ExamSubject' }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        level: { type: string }
        tracks:
          type: array
          items: { type: string }
          description: CPGE tracks (`MP`, `MPI`…); empty for national exams.
        session: { type: [string, 'null'] }
        duration_minutes: { type: [integer, 'null'] }
        total_points: { type: [integer, 'null'] }
        part_count: { type: integer }
        pdf_url:
          type: [string, 'null']
          format: uri
          description: The statement PDF served by Laravel, when Pulsars hosts it.
        official_url:
          type: [string, 'null']
          format: uri
          description: |
            The statement on the organiser's site, for exams Pulsars does not
            host. Laravel only shows URLs that pass `App\Support\SujetOfficiel`
            (domain and path allow-list); the API must apply the same filter
            and return null otherwise.
        source_url:
          type: [string, 'null']
          format: uri
          description: The organiser's page listing papers, cited as the source.
        published_at: { type: string, format: date-time }
        web_url: { type: string, format: uri }

    ExamDetail:
      allOf:
        - $ref: '#/components/schemas/ExamSummary'
        - type: object
          required: [description, parts]
          properties:
            description: { type: [string, 'null'] }
            parts:
              type: array
              items:
                type: object
                description: '`corrige_md` is excluded on purpose.'
                required: [id, position, lang, title, points, statement_md]
                properties:
                  id: { type: integer }
                  position: { type: integer }
                  lang: { $ref: '#/components/schemas/LangCode' }
                  title: { type: string }
                  points: { type: [number, 'null'] }
                  statement_md: { type: string }

    License:
      type: object
      required: [key, name, url]
      properties:
        key: { type: string, description: 'Key of `config/licences.php` (e.g. `cc-by-4.0`), or `autre`.' }
        name:
          type: string
          description: Display name; for `autre`, the free text entered by the uploader.
        url: { type: [string, 'null'], format: uri }

    Resource:
      type: object
      required: [id, slug, lang, title, description, category, doc_lang, mode, attribution, license, download_url, source_url, size_bytes, created_at, updated_at, web_url]
      properties:
        id: { type: integer }
        slug: { type: string }
        lang: { $ref: '#/components/schemas/LangCode' }
        title: { type: string }
        description: { type: [string, 'null'] }
        category:
          type: [string, 'null']
          description: Translatable.
        doc_lang:
          type: [string, 'null']
          description: Language of the document itself.
        mode: { $ref: '#/components/schemas/ResourceMode' }
        attribution:
          type: [string, 'null']
          description: Name credited as author of the document (`auteur_nom`), not a Pulsars account.
        license:
          description: Null when no licence was recorded (older resources).
          oneOf:
            - $ref: '#/components/schemas/License'
            - type: 'null'
        download_url: { type: [string, 'null'], format: uri }
        source_url: { type: [string, 'null'], format: uri }
        size_bytes:
          type: [integer, 'null']
          description: Only for `host`.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        web_url: { type: string, format: uri }

    Role:
      type: object
      required: [slug, name, category, color]
      properties:
        slug: { type: string }
        name: { type: string }
        category: { type: string, enum: [permission, matiere, distinction] }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }

    Me:
      type: object
      required: [id, pseudo, avatar_url, bio, member_since, roles, xp, brains, profile_url]
      properties:
        id: { type: string, description: Same value as the JWT `sub`. }
        pseudo: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
        bio: { type: [string, 'null'], maxLength: 280 }
        member_since: { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
          description: Sorted by permission level descending, then display order.
        xp:
          type: object
          description: |
            Computed exactly like `App\Services\Experience::pour()`. See
            `webhooks.md` for the scale.
          required: [total, level, level_start, next_level_at]
          properties:
            total: { type: integer }
            level: { type: integer, minimum: 1 }
            level_start: { type: integer, description: XP at which the current level starts. }
            next_level_at: { type: integer }
        brains:
          type: integer
          minimum: 0
          description: |
            Brains balance, the sum of the member's ledger (`brains.md` §4,
            `api_read.member_brains`). Shown to its owner even when
            `cerveaux_publics` is false.
        profile_url: { type: string, format: uri }

    GameSubject:
      type: string
      enum: [maths, physics, chemistry, computer-science, all]

    GameRules:
      type: object
      description: Exactly one of `duration` and `target` is set.
      required: [duration, target, penalty]
      properties:
        duration: { type: [integer, 'null'], enum: [60, 300, null] }
        target: { type: [integer, 'null'], enum: [10, null] }
        penalty: { type: boolean, description: A wrong answer costs a point. }

    GameLeader:
      type: object
      required: [rank, user_id, pseudo, avatar_url, rating, provisional, games, wins, losses, draws]
      properties:
        rank: { type: integer, minimum: 1 }
        user_id: { type: string }
        pseudo: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
        rating: { type: integer, description: Glicko-2 rating, rounded. }
        provisional: { type: boolean, description: RD above 110. }
        games: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }

    GameRating:
      type: object
      required: [subject, rating, provisional, games, wins, losses, draws, rank]
      properties:
        subject: { $ref: '#/components/schemas/GameSubject' }
        rating: { type: integer }
        provisional: { type: boolean }
        games: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
        rank: { type: integer, minimum: 1 }

    GameRecentMatch:
      type: object
      required: [match_id, mode, ranked, subject, rules, ended_at, end_reason, outcome, score,
                 rating_before, rating_after, opponents]
      properties:
        match_id: { type: string, format: uuid }
        mode: { type: string, enum: [duel, room, ghost] }
        ranked: { type: boolean }
        subject: { $ref: '#/components/schemas/GameSubject' }
        rules: { $ref: '#/components/schemas/GameRules' }
        ended_at: { type: string, format: date-time }
        end_reason: { type: string, enum: [completed, timeout, forfeit, void] }
        outcome: { type: string, enum: [win, loss, draw, forfeit] }
        score: { type: integer }
        rating_before: { type: [integer, 'null'] }
        rating_after: { type: [integer, 'null'] }
        opponents:
          type: array
          items: { type: string }

    GameAdminStats:
      type: object
      description: See `game-protocol.md` §9.1. All times UTC.
      required: [generated_at, live, today, daily, subjects, rules, quality, ratings, webhook, seasons]
      properties:
        generated_at: { type: string, format: date-time }
        live:
          type: object
          description: The game server's memory, now.
          required: [sessions, guests, queued, rooms_open, matches, players_in_matches]
          properties:
            sessions: { type: integer, minimum: 0, description: Open authenticated WebSocket sessions. }
            guests: { type: integer, minimum: 0, description: Of the sessions, guests. }
            queued: { type: integer, minimum: 0, description: Players waiting in matchmaking, every queue key. }
            rooms_open: { type: integer, minimum: 0, description: Private rooms not started or between matches. }
            matches:
              type: object
              description: Matches running now, by mode.
              required: [duel, room, ghost]
              properties:
                duel: { type: integer, minimum: 0 }
                room: { type: integer, minimum: 0 }
                ghost: { type: integer, minimum: 0 }
            players_in_matches: { type: integer, minimum: 0, description: Live players still seated in a running match. }
        today:
          type: object
          required: [matches_started, by_hour, accounts, guests]
          properties:
            matches_started: { type: integer, minimum: 0 }
            by_hour:
              type: array
              description: Matches started per UTC hour, 0 to 23.
              minItems: 24
              maxItems: 24
              items: { type: integer, minimum: 0 }
            accounts: { type: integer, minimum: 0, description: Distinct accounts with a seat in a match started today, running ones included. }
            guests: { type: integer, minimum: 0, description: Guest seats in matches started today, running ones included. }
        daily:
          type: array
          description: '`days` entries, oldest first, the last one today.'
          items: { $ref: '#/components/schemas/GameAdminDay' }
        subjects:
          type: array
          description: Matches of the period per subject key; all five, most played first.
          items:
            type: object
            required: [subject, matches]
            properties:
              subject: { $ref: '#/components/schemas/GameSubject' }
              matches: { type: integer, minimum: 0 }
        rules:
          type: array
          description: Matches of the period per rules, most played first.
          items:
            type: object
            required: [rules, matches]
            properties:
              rules: { $ref: '#/components/schemas/GameRules' }
              matches: { type: integer, minimum: 1 }
        quality:
          type: object
          description: Finished, non-void matches of the period; `null` without data.
          required: [avg_match_seconds, avg_answers_per_player, accuracy]
          properties:
            avg_match_seconds: { type: [number, 'null'], description: 'Mean `ended_at − started_at`, one decimal.' }
            avg_answers_per_player: { type: [number, 'null'], description: Mean answers per live seat (ghosts excluded), one decimal. }
            accuracy: { type: [number, 'null'], minimum: 0, maximum: 1, description: Correct / answered over those seats, three decimals. }
        ratings:
          type: object
          description: All time.
          required: [players, provisional, by_subject]
          properties:
            players: { type: integer, minimum: 0, description: Accounts with a ranked match in some subject. }
            provisional: { type: integer, minimum: 0, description: Of them, those whose every rating has RD above 110. }
            by_subject:
              type: array
              description: Rated players per subject key; all five, most first.
              items:
                type: object
                required: [subject, players]
                properties:
                  subject: { $ref: '#/components/schemas/GameSubject' }
                  players: { type: integer, minimum: 0 }
        webhook:
          type: object
          description: Results webhook outbox, now.
          required: [pending, dead]
          properties:
            pending: { type: integer, minimum: 0 }
            dead: { type: integer, minimum: 0 }
        seasons:
          type: array
          description: The last 12 closed season rows, newest month first.
          maxItems: 12
          items:
            type: object
            required: [month, subject, ranked_players, closed_at]
            properties:
              month: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
              subject: { $ref: '#/components/schemas/GameSubject' }
              ranked_players: { type: integer, minimum: 0, description: Size of the standings. }
              closed_at: { type: string, format: date-time }

    GameAdminDay:
      type: object
      description: Matches started on a UTC day.
      required: [date, duel, room, ghost, ranked, void, forfeit, accounts, guests]
      properties:
        date: { type: string, format: date }
        duel: { type: integer, minimum: 0 }
        room: { type: integer, minimum: 0 }
        ghost: { type: integer, minimum: 0 }
        ranked: { type: integer, minimum: 0, description: Still ranked at the end (or running ranked). }
        void: { type: integer, minimum: 0 }
        forfeit: { type: integer, minimum: 0 }
        accounts: { type: integer, minimum: 0, description: Distinct accounts with a seat. }
        guests: { type: integer, minimum: 0, description: Guest seats. }
