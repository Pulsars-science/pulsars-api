name: Release

# A tag `vX.Y.Z` on main builds the Linux binary and publishes the archive
# that deploy/deploy-api installs (docs/deployment.md). The tag must match
# the version in Cargo.toml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  release:
    # Pinned rather than ubuntu-latest: the binary needs the glibc it was
    # built against (2.39) or newer. The VPS runs Ubuntu 26.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - name: The tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo build --release --locked --target "$TARGET"
      - run: deploy/package-release "$TARGET" dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Install with deploy-api (docs/deployment.md)."
