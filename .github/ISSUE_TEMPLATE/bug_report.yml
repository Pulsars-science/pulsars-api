name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not use this form: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The request you sent and the response you got (status, body). Remove any token.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Ideally with a reference to docs/contract/.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        curl -i "https://api.pulsars.science/v1/..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The `version` field of /healthz, or a commit hash.
