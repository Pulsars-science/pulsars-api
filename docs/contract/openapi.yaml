  schemas:
    LangCode:
      type: string
      enum: [fr, en, ru]
    Difficulty:
      type: string
      enum: [debutant, intermediaire, avance]
      description: '`App\Enums\Difficulte`.'
    Level:
      type: string
      enum: [college, lycee, superieur]
      description: Normalised from the free tags `collège`/`college`, `lycée`/`lycee`, `supérieur`.
    ExerciseType:
      type: string
      enum: [qcm, reponse_courte, reponse_libre]
      description: |
        `App\Enums\TypeExercice`. `qcm` and `reponse_courte` are graded by the
        server; `reponse_libre` is never auto-graded (the learner compares
        with the solution).
    ExamType:
      type: string
      enum: [brevet, bac, blanc, concours]
    ExamSubject:
      type: string
      enum: [mathematiques, physique, chimie, informatique, sciences-industrielles, langues, redaction]
      description: '`App\Enums\MatiereExamen`. Independent from the course subjects.'
    ResourceMode:
      type: string
      enum: [host, link]
      description: |
        `host`: Pulsars serves the file (`download_url` is set; `source_url`,
        when set, credits where it came from). `link`: the resource lives on
        its author's site (`source_url` is the target, `download_url` is null).
    Total:
      type: integer
      minimum: 0
      description: Items matching the filters, on lists asked with `page` only.
    NextCursor:
      type: [string, 'null']
      description: Pass it as `cursor` to get the next page; null on the last page.

    AccountUser:
      type: object
      required: [id, pseudo, email, email_verified, onboarded, locale]
      properties:
        id: { type: string, example: '42' }
        pseudo: { type: string }
        email: { type: string }
        email_verified: { type: boolean }
        onboarded: { type: boolean }
        locale: { type: [string, 'null'], enum: [fr, en, ru, null] }
    Session:
      type: object
      required: [token, expires_at, remember]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          description: Opaque; shown only here. Give it back in `Pulsars-Session`.
        expires_at: { type: string, format: date-time }
        remember: { type: boolean }
    SessionInfo:
      type: object
      required: [expires_at, remember]
      properties:
        expires_at: { type: string, format: date-time }
        remember: { type: boolean }
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [parameter, detail]
            properties:
              parameter: { type: string }
              detail: { type: string }
              code:
                type: string
                description: |
                  Stable code of a field error (`/v1/auth/*`), for clients that
                  translate the message.
                enum: [required, too_short, too_long, invalid_format, invalid_email, taken, mismatch, incorrect, invalid, email_missing, too_small, too_large, not_pdf, invalid_json, no_lessons, no_parts, own_super_admin]
        reason:
          type: string
          description: |
            For 401, why the token was refused; for 403, `insufficient_scope`
            (`auth-jwt.md`); for 409 `conflict`, what conflicts
            (`auth-sessions.md`).
          enum: [missing, malformed, expired, not_yet_valid, bad_signature, unknown_kid, bad_issuer, bad_audience, bad_algorithm, insufficient_scope, taken, email_unverified, last_login_method, has_enrollments, already_handled, already_accepted]
        trace_id: { type: string }
      additionalProperties: false

    Health:
      type: object
      required: [status, version, checked_at, checks]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string }
        checked_at: { type: string, format: date-time }
        checks:
          type: array
          items:
            type: object
            required: [name, ok, duration_ms, error]
            properties:
              name: { type: string, enum: [postgres, redis] }
              ok: { type: boolean }
              duration_ms: { type: number }
              error:
                type: [string, 'null']
                description: Short code (`timeout`, `connection_refused`, `auth_failed`), never a raw message.

    SubjectRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, description: 'Slug of the subject name (`Mathématiques` → `mathematiques`).' }
        name: { type: string, description: Translated when `lang=en` and a translation exists. }
    TopicRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string, description: Never translated (no translation exists). }

    Catalog:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [taxonomy, lang, subjects]
          properties:
            taxonomy: { type: string, enum: [theme, domain-subject-topic] }
            lang: { $ref: '#/components/schemas/LangCode' }
            subjects:
              type: array
              items:
                type: object
                required: [slug, name, course_count, topics]
                properties:
                  slug: { type: string }
                  name: { type: string }
                  course_count: { type: integer, description: Includes courses without a topic. }
                  topics:
                    type: array
                    items:
                      type: object
                      required: [slug, name, course_count]
                      properties:
                        slug: { type: string }
                        name: { type: string }
                        course_count: { type: integer }

    CourseSummary:
      type: object
      required: [id, slug, lang, title, description, theme, subject, topic, difficulty, levels, duration_minutes, tags, author, chapter_count, lesson_count, exercise_count, available_langs, published_at, updated_at, web_url]
      properties:
        id: { type: integer }
        slug: { type: string }
        lang: { $ref: '#/components/schemas/LangCode' }
        title: { type: string, description: Translatable. }
        description: { type: string, description: Translatable. }
        theme:
          type: string
          description: Raw `theme` of the course, kept so clients can display what the site displays.
        subject: { $ref: '#/components/schemas/SubjectRef' }
        topic:
          oneOf:
            - $ref: '#/components/schemas/TopicRef'
            - type: 'null'
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        levels:
          type: array
          items: { $ref: '#/components/schemas/Level' }
        duration_minutes: { type: [integer, 'null'] }
        tags:
          type: array
          items: { type: string }
          description: Free tags as stored, never translated.
        author:
          type: [string, 'null']
          description: Pseudo of the author account. Null if the account was deleted.
        chapter_count: { type: integer }
        lesson_count: { type: integer }
        exercise_count: { type: integer }
        available_langs:
          type: array
          items: { $ref: '#/components/schemas/LangCode' }
          description: '`fr` always; `en` when a course-level translation exists.'
        published_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        web_url: { type: string, format: uri }

    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/CourseSummary'
        - type: object
          required: [chapters]
          properties:
            chapters:
              type: array
              items:
                type: object
                required: [position, title, lang, lessons, exercises]
                properties:
                  position: { type: integer, description: 'The stored `ordre`, starting at 1.' }
                  title: { type: string }
                  lang: { $ref: '#/components/schemas/LangCode' }
                  lessons:
                    type: array
                    items:
                      type: object
                      required: [id, slug, position, title, lang]
                      properties:
                        id: { type: integer, description: 'Stable id, as in the site''s progress.' }
                        slug: { type: string }
                        position: { type: integer }
                        title: { type: string }
                        lang: { $ref: '#/components/schemas/LangCode' }
                  exercises:
                    type: array
                    items:
                      type: object
                      required: [id, position, type, title, lang]
                      properties:
                        id: { type: integer }
                        position: { type: integer }
                        type: { $ref: '#/components/schemas/ExerciseType' }
                        title: { type: string }
                        lang: { $ref: '#/components/schemas/LangCode' }

    LessonLink:
      type: object
      required: [slug, title]
      properties:
        slug: { type: string }
        title: { type: string }

    Lesson:
      type: object
      required: [id, slug, lang, title, position, content_md, chapter, course, previous, next, updated_at, web_url]
      properties:
        id: { type: integer }
        slug: { type: string }
        lang: { $ref: '#/components/schemas/LangCode' }
        title: { type: string }
        position: { type: integer }
        content_md: { type: string, description: Raw Markdown with LaTeX. Translatable. }
        chapter:
          type: object
          required: [position, title, lang]
          properties:
            position: { type: integer }
            title: { type: string }
            lang: { $ref: '#/components/schemas/LangCode' }
        course:
          type: object
          required: [slug, title, lang]
          properties:
            slug: { type: string }
            title: { type: string }
            lang: { $ref: '#/components/schemas/LangCode' }
        previous:
          description: Previous lesson in reading order across chapters.
          oneOf:
            - $ref: '#/components/schemas/LessonLink'
            - type: 'null'
        next:
          oneOf:
            - $ref: '#/components/schemas/LessonLink'
            - type: 'null'
        updated_at: { type: string, format: date-time }
        web_url: { type: string, format: uri }

    Exercise:
      type: object
      description: |
        Never contains the answer. Excluded on purpose: `solution_md`,
        `donnees.correctes` (QCM), `donnees.acceptees` (short answer), and the
        English translation of `solution_md`.
      required: [id, lang, type, title, question_md, options, multiple, position, chapter, course, web_url]
      properties:
        id: { type: integer }
        lang: { $ref: '#/components/schemas/LangCode' }
        type: { $ref: '#/components/schemas/ExerciseType' }
        title: { type: string }
        question_md: { type: string }
        options:
          description: |
            QCM choices, in stored order; null for other types. Option texts
            are **never translated** (they live in the `donnees` JSON, which
            translations do not cover).
          oneOf:
            - type: array
              items:
                type: object
                required: [id, text]
                properties:
                  id: { type: string }
                  text: { type: string }
            - type: 'null'
        multiple:
          type: [boolean, 'null']
          description: |
            QCM only: true when more than one option is correct (checkboxes
            rather than radio buttons). This is a deliberate, small hint that
            the website already gives. Null for other types.
        position: { type: integer }
        chapter:
          type: object
          required: [position, title, lang]
          properties:
            position: { type: integer }
            title: { type: string }
            lang: { $ref: '#/components/schemas/LangCode' }
        course:
          type: object
          required: [slug, title, lang, difficulty]
          properties:
            slug: { type: string }
            title: { type: string }
            lang: { $ref: '#/components/schemas/LangCode' }
            difficulty: { $ref: '#/components/schemas/Difficulty' }
        web_url: { type: string, format: uri }

    ExamSummary:
      type: object
      required: [id, slug, lang, title, type, competition, subject, country, level, tracks, session, duration_minutes, total_points, part_count, pdf_url, official_url, source_url, published_at, description, web_url]
      properties:
        id: { type: integer }
        slug: { type: string }
        lang:
          type: string
          const: fr
          description: Exam titles are not translatable; always `fr`.
        title: { type: string }
        type: { $ref: '#/components/schemas/ExamType' }
        competition:
          type: [string, 'null']
          description: Competitive exam key (`centrale-supelec`), null for national exams.
        subject: { $ref: '#/components/schemas/ExamSubject' }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        level: { type: string }
        tracks:
          type: array
          items: { type: string }
          description: CPGE tracks (`MP`, `MPI`…); empty for national exams.
        session: { type: [string, 'null'] }
        duration_minutes: { type: [integer, 'null'] }
        total_points: { type: [integer, 'null'] }
        part_count: { type: integer }
        pdf_url:
          type: [string, 'null']
          format: uri
          description: The site's download of the statement PDF, when Pulsars hosts it.
        official_url:
          type: [string, 'null']
          format: uri
          description: |
            The statement on the organiser's site, for exams Pulsars does not
            host. Only URLs that pass the old site's `SujetOfficiel`
            allow-list (domain and path) are returned; null otherwise.
        source_url:
          type: [string, 'null']
          format: uri
          description: The organiser's page listing papers, cited as the source.
        published_at: { type: string, format: date-time }
        description: { type: [string, 'null'] }
        web_url: { type: string, format: uri }

    ExamDetail:
      allOf:
        - $ref: '#/components/schemas/ExamSummary'
        - type: object
          required: [parts]
          properties:
            parts:
              type: array
              items:
                type: object
                description: '`corrige_md` is excluded on purpose.'
                required: [id, position, lang, title, points, statement_md]
                properties:
                  id: { type: integer }
                  position: { type: integer }
                  lang: { $ref: '#/components/schemas/LangCode' }
                  title: { type: string }
                  points: { type: [number, 'null'] }
                  statement_md: { type: string }

    License:
      type: object
      required: [key, name, url]
      properties:
        key: { type: string, description: 'Key of `config/licences.php` (e.g. `cc-by-4.0`), or `autre`.' }
        name:
          type: string
          description: Display name; for `autre`, the free text entered by the uploader.
        url: { type: [string, 'null'], format: uri }

    Resource:
      type: object
      required: [id, slug, lang, title, description, category, doc_lang, mode, attribution, license, download_url, source_url, size_bytes, created_at, updated_at, web_url]
      properties:
        id: { type: integer }
        slug: { type: string }
        lang: { $ref: '#/components/schemas/LangCode' }
        title: { type: string }
        description: { type: [string, 'null'] }
        category:
          type: [string, 'null']
          description: Translatable.
        doc_lang:
          type: [string, 'null']
          description: Language of the document itself.
        mode: { $ref: '#/components/schemas/ResourceMode' }
        attribution:
          type: [string, 'null']
          description: Name credited as author of the document (`auteur_nom`), not a Pulsars account.
        license:
          description: Null when no licence was recorded (older resources).
          oneOf:
            - $ref: '#/components/schemas/License'
            - type: 'null'
        download_url: { type: [string, 'null'], format: uri }
        source_url: { type: [string, 'null'], format: uri }
        size_bytes:
          type: [integer, 'null']
          description: Only for `host`.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        web_url: { type: string, format: uri }

    News:
      type: object
      required: [id, slug, lang, title, summary, author, published_at, updated_at, web_url]
      properties:
        id: { type: integer }
        slug: { type: string }
        lang: { $ref: '#/components/schemas/LangCode' }
        title: { type: string }
        summary:
          type: [string, 'null']
          description: The lead paragraph (`chapeau`). Translatable.
        author:
          type: [string, 'null']
          description: Pseudo of the team member who wrote it.
        published_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        web_url: { type: string, format: uri }

    NewsDetail:
      allOf:
        - $ref: '#/components/schemas/News'
        - type: object
          required: [content_md]
          properties:
            content_md:
              type: string
              description: Markdown, translated when a translation has it, else French.

    Role:
      type: object
      required: [slug, name, category, color]
      properties:
        slug: { type: string }
        name: { type: string }
        category: { type: string, enum: [permission, matiere, distinction] }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }

    Me:
      type: object
      required: [id, pseudo, avatar_url, bio, member_since, roles, xp, brains, profile_url]
      properties:
        id: { type: string, description: Same value as the JWT `sub`. }
        email: { type: string, description: With a session only. }
        email_verified: { type: boolean, description: With a session only. }
        onboarded: { type: boolean, description: With a session only. }
        locale: { type: [string, 'null'], description: With a session only. }
        forum_muted_until: { type: [string, 'null'], format: date-time, description: With a session only. }
        pseudo: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
        bio: { type: [string, 'null'], maxLength: 280 }
        member_since: { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
          description: Sorted by permission level descending, then display order.
        xp:
          type: object
          description: |
            Computed exactly like `App\Services\Experience::pour()` (the view
            `site.member_xp`): level `n` starts at `50 × (n − 1) × n` XP.
          required: [total, level, level_start, next_level_at]
          properties:
            total: { type: integer }
            level: { type: integer, minimum: 1 }
            level_start: { type: integer, description: XP at which the current level starts. }
            next_level_at: { type: integer }
        brains:
          type: integer
          minimum: 0
          description: |
            Brains balance, the sum of the member's ledger (`brains.md` §4,
            `site.member_brains`). Shown to its owner even when
            `cerveaux_publics` is false.
        profile_url: { type: string, format: uri }

    GameSubject:
      type: string
      enum: [maths, physics, chemistry, computer-science, all]

    GameRules:
      type: object
      description: Exactly one of `duration` and `target` is set.
      required: [duration, target, penalty]
      properties:
        duration: { type: [integer, 'null'], enum: [60, 300, null] }
        target: { type: [integer, 'null'], enum: [10, null] }
        penalty: { type: boolean, description: A wrong answer costs a point. }

    GameLeader:
      type: object
      required: [rank, user_id, pseudo, avatar_url, rating, provisional, games, wins, losses, draws]
      properties:
        rank: { type: integer, minimum: 1 }
        user_id: { type: string }
        pseudo: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
        rating: { type: integer, description: Glicko-2 rating, rounded. }
        provisional: { type: boolean, description: RD above 110. }
        games: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }

    GameRating:
      type: object
      required: [subject, rating, provisional, games, wins, losses, draws, rank]
      properties:
        subject: { $ref: '#/components/schemas/GameSubject' }
        rating: { type: integer }
        provisional: { type: boolean }
        games: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
        rank: { type: integer, minimum: 1 }

    GameRecentMatch:
      type: object
      required: [match_id, mode, ranked, subject, rules, ended_at, end_reason, outcome, score,
                 rating_before, rating_after, opponents]
      properties:
        match_id: { type: string, format: uuid }
        mode: { type: string, enum: [duel, room, ghost] }
        ranked: { type: boolean }
        subject: { $ref: '#/components/schemas/GameSubject' }
        rules: { $ref: '#/components/schemas/GameRules' }
        ended_at: { type: string, format: date-time }
        end_reason: { type: string, enum: [completed, timeout, forfeit, void] }
        outcome: { type: string, enum: [win, loss, draw, forfeit] }
        score: { type: integer }
        rating_before: { type: [integer, 'null'] }
        rating_after: { type: [integer, 'null'] }
        opponents:
          type: array
          items: { type: string }

    GameAdminStats:
      type: object
      description: See `game-protocol.md` §9.1. All times UTC.
      required: [generated_at, live, today, daily, subjects, rules, quality, ratings, seasons]
      properties:
        generated_at: { type: string, format: date-time }
        live:
          type: object
          description: The game server's memory, now.
          required: [sessions, guests, queued, rooms_open, matches, players_in_matches]
          properties:
            sessions: { type: integer, minimum: 0, description: Open authenticated WebSocket sessions. }
            guests: { type: integer, minimum: 0, description: Of the sessions, guests. }
            queued: { type: integer, minimum: 0, description: Players waiting in matchmaking, every queue key. }
            rooms_open: { type: integer, minimum: 0, description: Private rooms not started or between matches. }
            matches:
              type: object
              description: Matches running now, by mode.
              required: [duel, room, ghost]
              properties:
                duel: { type: integer, minimum: 0 }
                room: { type: integer, minimum: 0 }
                ghost: { type: integer, minimum: 0 }
            players_in_matches: { type: integer, minimum: 0, description: Live players still seated in a running match. }
        today:
          type: object
          required: [matches_started, by_hour, accounts, guests]
          properties:
            matches_started: { type: integer, minimum: 0 }
            by_hour:
              type: array
              description: Matches started per UTC hour, 0 to 23.
              minItems: 24
              maxItems: 24
              items: { type: integer, minimum: 0 }
            accounts: { type: integer, minimum: 0, description: Distinct accounts with a seat in a match started today, running ones included. }
            guests: { type: integer, minimum: 0, description: Guest seats in matches started today, running ones included. }
        daily:
          type: array
          description: '`days` entries, oldest first, the last one today.'
          items: { $ref: '#/components/schemas/GameAdminDay' }
        subjects:
          type: array
          description: Matches of the period per subject key; all five, most played first.
          items:
            type: object
            required: [subject, matches]
            properties:
              subject: { $ref: '#/components/schemas/GameSubject' }
              matches: { type: integer, minimum: 0 }
        rules:
          type: array
          description: Matches of the period per rules, most played first.
          items:
            type: object
            required: [rules, matches]
            properties:
              rules: { $ref: '#/components/schemas/GameRules' }
              matches: { type: integer, minimum: 1 }
        quality:
          type: object
          description: Finished, non-void matches of the period; `null` without data.
          required: [avg_match_seconds, avg_answers_per_player, accuracy]
          properties:
            avg_match_seconds: { type: [number, 'null'], description: 'Mean `ended_at − started_at`, one decimal.' }
            avg_answers_per_player: { type: [number, 'null'], description: Mean answers per live seat (ghosts excluded), one decimal. }
            accuracy: { type: [number, 'null'], minimum: 0, maximum: 1, description: Correct / answered over those seats, three decimals. }
        ratings:
          type: object
          description: All time.
          required: [players, provisional, by_subject]
          properties:
            players: { type: integer, minimum: 0, description: Accounts with a ranked match in some subject. }
            provisional: { type: integer, minimum: 0, description: Of them, those whose every rating has RD above 110. }
            by_subject:
              type: array
              description: Rated players per subject key; all five, most first.
              items:
                type: object
                required: [subject, players]
                properties:
                  subject: { $ref: '#/components/schemas/GameSubject' }
                  players: { type: integer, minimum: 0 }
        seasons:
          type: array
          description: The last 12 closed season rows, newest month first.
          maxItems: 12
          items:
            type: object
            required: [month, subject, ranked_players, closed_at]
            properties:
              month: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
              subject: { $ref: '#/components/schemas/GameSubject' }
              ranked_players: { type: integer, minimum: 0, description: Size of the standings. }
              closed_at: { type: string, format: date-time }

    GameAdminDay:
      type: object
      description: Matches started on a UTC day.
      required: [date, duel, room, ghost, ranked, void, forfeit, accounts, guests]
      properties:
        date: { type: string, format: date }
        duel: { type: integer, minimum: 0 }
        room: { type: integer, minimum: 0 }
        ghost: { type: integer, minimum: 0 }
        ranked: { type: integer, minimum: 0, description: Still ranked at the end (or running ranked). }
        void: { type: integer, minimum: 0 }
        forfeit: { type: integer, minimum: 0 }
        accounts: { type: integer, minimum: 0, description: Distinct accounts with a seat. }
        guests: { type: integer, minimum: 0, description: Guest seats. }
    Language:
      type: object
      required: [code, name, lang, native_name, script, reading_system, countries, level_count, word_count]
      properties:
        code: { type: string, description: 'BCP 47 tag of the language taught.', example: zh }
        name: { type: string, description: In the requested interface language. }
        lang: { $ref: '#/components/schemas/LangCode' }
        native_name: { type: string, example: 中文 }
        script: { type: string, description: ISO 15924 script of the written forms., example: Hans }
        reading_system: { type: [string, 'null'], description: How `Word.reading` is written., example: pinyin }
        countries:
          type: array
          description: ISO 3166-1 alpha-2 codes of the countries where the language is spoken, in display order.
          items: { type: string, pattern: '^[A-Z]{2}$' }
          example: [CN, TW, SG]
        level_count: { type: integer, minimum: 0 }
        word_count: { type: integer, minimum: 0 }
    LanguageLevel:
      type: object
      required: [slug, framework, position, title, description, lang, word_count]
      properties:
        slug: { type: string, example: hsk-1 }
        framework: { type: string, description: The scale of the level., example: HSK }
        position: { type: integer, minimum: 1 }
        title: { type: string }
        description: { type: string }
        lang:
          allOf: [{ $ref: '#/components/schemas/LangCode' }]
          description: '`en` only when both the title and the description are translated.'
        word_count: { type: integer, minimum: 0 }
    LanguageLevelRef:
      type: [object, 'null']
      required: [slug, title]
      properties:
        slug: { type: string }
        title: { type: string }
    Word:
      type: object
      required: [id, text, reading, meaning, lang]
      properties:
        id: { type: integer }
        text: { type: string, description: The written form., example: 你 }
        reading: { type: [string, 'null'], description: In the language's reading system., example: nǐ }
        meaning: { type: string, description: In the requested interface language. }
        lang: { $ref: '#/components/schemas/LangCode' }
    ForumTheme:
      type: object
      required: [slug, name, description, color, question_count]
      properties:
        slug: { type: string, example: mathematiques }
        name: { type: string, example: Mathematiques }
        description: { type: [string, 'null'] }
        color: { type: string, example: '#4f7df0' }
        question_count: { type: integer, minimum: 0 }
    ForumThemeRef:
      type: object
      required: [slug, name, color]
      properties:
        slug: { type: string }
        name: { type: string }
        color: { type: string }
    ForumQuestionSummary:
      type: object
      required: [id, slug, title, excerpt, theme, author, author_id, votes, answer_count, views, solved, has_voted, is_hidden, is_locked, is_pinned, created_at, updated_at]
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        excerpt:
          type: [string, 'null']
          description: The body without HTML tags, cut at 160 characters with `...`; null when hidden, except for moderators.
        theme: { $ref: '#/components/schemas/ForumThemeRef' }
        author: { type: [string, 'null'], description: The author's pseudo; null once the account is deleted. }
        author_id: { type: [string, 'null'], example: '42' }
        votes: { type: integer, minimum: 0 }
        answer_count: { type: integer, minimum: 0 }
        views: { type: integer, minimum: 0 }
        solved: { type: boolean, description: An answer is accepted. }
        has_voted: { type: boolean, description: The reader voted for it. }
        is_hidden: { type: boolean }
        is_locked: { type: boolean }
        is_pinned: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
    ForumQuestion:
      type: object
      required: [id, slug, title, body_md, theme, author, author_id, votes, views, has_voted, accepted_answer_id, is_hidden, hidden_reason, is_locked, is_pinned, created_at, updated_at, answer_count, answers, viewer]
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        body_md: { type: [string, 'null'], description: Null when hidden, except for moderators. }
        theme: { $ref: '#/components/schemas/ForumThemeRef' }
        author: { type: [string, 'null'] }
        author_id: { type: [string, 'null'] }
        votes: { type: integer, minimum: 0 }
        views: { type: integer, minimum: 0 }
        has_voted: { type: boolean }
        accepted_answer_id: { type: [integer, 'null'] }
        is_hidden: { type: boolean }
        hidden_reason: { type: [string, 'null'], description: The moderator's reason, shown to everyone. }
        is_locked: { type: boolean }
        is_pinned: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        answer_count: { type: integer, minimum: 0, description: Every answer, replies included. }
        answers:
          type: array
          description: Answers to the question, oldest first, each with its replies.
          items: { $ref: '#/components/schemas/ForumAnswer' }
        viewer:
          type: object
          required: [is_author, can_participate, is_moderator]
          properties:
            is_author: { type: boolean }
            can_participate: { type: boolean, description: A member who is not muted, on a thread that is not locked. }
            is_moderator: { type: boolean }
    ForumAnswer:
      type: object
      required: [id, body_md, author, author_id, votes, has_voted, is_hidden, hidden_reason, created_at, children]
      properties:
        id: { type: integer }
        body_md: { type: [string, 'null'], description: Null when hidden, except for moderators. }
        author: { type: [string, 'null'] }
        author_id: { type: [string, 'null'] }
        votes: { type: integer, minimum: 0 }
        has_voted: { type: boolean }
        is_hidden: { type: boolean }
        hidden_reason: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        children:
          type: array
          description: Replies, oldest first.
          items: { $ref: '#/components/schemas/ForumAnswer' }
    ForumTranslation:
      type: object
      required: [title, body_md, source_lang, target_lang, cached]
      properties:
        title: { type: [string, 'null'], description: Null for an answer. }
        body_md: { type: string }
        source_lang: { type: [string, 'null'], description: What DeepL detected, lower case., example: en }
        target_lang: { type: string, enum: [en, fr, ru] }
        cached: { type: boolean, description: Served from the stored translation of the same text. }
    MemberRole:
      allOf:
        - $ref: '#/components/schemas/Role'
        - type: object
          required: [level]
          properties:
            level: { type: integer, description: 'Permission level (`niveau`); 0 for a subject or a distinction.' }
    MemberSummary:
      type: object
      required: [id, pseudo, avatar_url, bio, roles]
      properties:
        id: { type: string, example: '42' }
        pseudo: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
        bio: { type: [string, 'null'], maxLength: 280 }
        roles:
          type: array
          description: Highest permission first.
          items: { $ref: '#/components/schemas/MemberRole' }
    MemberRef:
      type: object
      required: [id, pseudo, avatar_url]
      properties:
        id: { type: string }
        pseudo: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
    XpDetail:
      type: object
      description: '`Experience::pour`. Level n starts at 50 × (n − 1) × n XP.'
      required: [total, level, level_start, next_level_at, in_level, for_level, breakdown]
      properties:
        total: { type: integer }
        level: { type: integer, minimum: 1 }
        level_start: { type: integer }
        next_level_at: { type: integer }
        in_level: { type: integer, description: XP inside the current level. }
        for_level: { type: integer, description: XP the current level spans. }
        breakdown:
          type: array
          items:
            type: object
            required: [key, count, unit_points, xp]
            properties:
              key: { type: string, enum: [lesson, exercise, course, question, answer, accepted_answer, games] }
              count: { type: integer }
              unit_points: { type: integer }
              xp: { type: integer, description: 'For `games`, capped at 30 a day (UTC), wins counting 5 more.' }
    FriendshipState:
      type: object
      required: [state, id]
      properties:
        state: { type: string, enum: [visitor, self, none, friends, sent, received] }
        id: { type: [integer, 'null'], description: The friendship, to accept or remove it. }
    MemberProfile:
      allOf:
        - $ref: '#/components/schemas/MemberSummary'
        - type: object
          required: [school_level, class, member_since, question_count, answer_count, profile_url, xp, brains, friendship, following]
          properties:
            school_level: { type: [string, 'null'] }
            class: { type: [string, 'null'] }
            member_since: { type: [string, 'null'], format: date-time }
            question_count: { type: integer, description: Forum questions, deleted ones aside. }
            answer_count: { type: integer }
            profile_url: { type: string, format: uri }
            xp: { $ref: '#/components/schemas/XpDetail' }
            brains:
              type: [object, 'null']
              required: [balance, private]
              properties:
                balance: { type: integer }
                private: { type: boolean, description: Hidden from others; only its owner gets it. }
            friendship: { $ref: '#/components/schemas/FriendshipState' }
            following:
              type: [object, 'null']
              description: '`null` for a visitor or on one''s own profile.'
              required: [following]
              properties:
                following: { type: boolean }
    FriendLine:
      type: object
      required: [friendship_id, member, since]
      properties:
        friendship_id: { type: integer }
        member:
          type: object
          required: [id, pseudo, avatar_url, bio]
          properties:
            id: { type: string }
            pseudo: { type: string }
            avatar_url: { type: [string, 'null'], format: uri }
            bio: { type: [string, 'null'] }
        since: { type: [string, 'null'], format: date-time }
    RoomType:
      type: string
      enum: [public, prive]
      description: As Laravel stores it. `prive` rooms are entered by invitation only.
    RoomInfo:
      type: object
      required: [name, slug, description, type, is_private, member_count]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        type: { $ref: '#/components/schemas/RoomType' }
        is_private: { type: boolean }
        member_count: { type: integer }
    RoomListed:
      allOf:
        - $ref: '#/components/schemas/RoomInfo'
        - type: object
          required: [message_count, joined]
          properties:
            message_count: { type: integer }
            joined: { type: boolean }
    RoomDetail:
      allOf:
        - $ref: '#/components/schemas/RoomInfo'
        - type: object
          required: [viewer, messages, has_older]
          properties:
            viewer:
              type: object
              required: [joined, can_write, can_manage]
              properties:
                joined: { type: boolean }
                can_write: { type: boolean, description: 'A member, or anyone in a public room (writing joins it).' }
                can_manage: { type: boolean, description: The owner or a site moderator. }
            messages:
              type: array
              description: The 100 latest, oldest first.
              items: { $ref: '#/components/schemas/RoomMessage' }
            has_older: { type: boolean }
    RoomMessage:
      type: object
      required: [id, body, author, author_id, sent_at]
      properties:
        id: { type: integer }
        body: { type: string, description: Plain text. }
        author: { type: [string, 'null'], description: 'Pseudo; `null` once the account is deleted.' }
        author_id: { type: [string, 'null'] }
        sent_at: { type: [string, 'null'], format: date-time }
    InvalidReason:
      type: [string, 'null']
      enum: [revoked, expired, exhausted, null]
    RoomInvitation:
      type: object
      required: [token, url, creator, uses, max_uses, expires_at, valid, invalid_reason]
      properties:
        token: { type: string }
        url: { type: string, format: uri, description: 'https://pulsars.science/salons/invite/{token}' }
        creator: { type: [string, 'null'] }
        uses: { type: integer }
        max_uses: { type: [integer, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }
        valid: { type: boolean }
        invalid_reason: { $ref: '#/components/schemas/InvalidReason' }
    Correspondent:
      type: object
      required: [pseudo, avatar_url]
      properties:
        pseudo: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
    ConversationLine:
      type: object
      required: [id, with, last_message, last_message_from_me, last_message_at, unread_count]
      properties:
        id: { type: integer }
        with: { $ref: '#/components/schemas/Correspondent' }
        last_message: { type: [string, 'null'], description: In clear. }
        last_message_from_me: { type: boolean }
        last_message_at: { type: [string, 'null'], format: date-time }
        unread_count: { type: integer }
    DirectMessage:
      allOf:
        - $ref: '#/components/schemas/RoomMessage'
        - type: object
          required: [read]
          properties:
            read: { type: boolean, description: The recipient opened it. }

    Series:
      type: object
      required: [values, total, previous]
      properties:
        values: { type: array, items: { type: integer }, description: One per day of the period, oldest first. }
        total: { type: integer }
        previous: { type: integer, description: The total of the N days before. }
    Windows:
      type: object
      properties:
        24h: { type: integer }
        7d: { type: integer }
        28d: { type: integer }
        total: { type: integer }
    AdminPending:
      type: object
      required: [resource_requests, reports, suggestions, total]
      properties:
        resource_requests: { type: integer }
        reports: { type: integer }
        suggestions: { type: integer }
        total: { type: integer }
    DonationGoal:
      type: object
      required: [goal, raised]
      properties:
        goal: { type: number, minimum: 0, maximum: 1000000, description: 0 takes the goal off the site. }
        raised: { type: number, minimum: 0, maximum: 1000000 }
    AdminStats:
      type: object
      properties:
        period:
          type: object
          properties:
            days: { type: integer, enum: [7, 30, 90] }
            choices: { type: array, items: { type: integer } }
            dates: { type: array, items: { type: string, format: date } }
        audience:
          type: object
          properties:
            available: { type: boolean }
            configured: { type: boolean }
            visitors: { oneOf: [{ $ref: '#/components/schemas/Windows' }, { type: 'null' }] }
            page_views: { oneOf: [{ $ref: '#/components/schemas/Windows' }, { type: 'null' }] }
            measured_since: { type: [string, 'null'], format: date-time }
            connected_24h: { type: integer }
        accounts:
          type: object
          properties:
            signups: { $ref: '#/components/schemas/Windows' }
            verified: { type: integer }
            onboarded: { type: integer }
            with_role: { type: integer }
            active_7d: { type: integer }
        content:
          type: object
          properties:
            courses:
              type: object
              properties: { total: { type: integer }, published: { type: integer }, drafts: { type: integer }, archived: { type: integer } }
            lessons: { type: integer }
            exercises: { type: integer }
            exams:
              type: object
              properties: { total: { type: integer }, published: { type: integer }, drafts: { type: integer }, pending_import: { type: integer } }
            exercise_attempts: { type: integer }
        community:
          type: object
          properties:
            questions: { type: integer }
            answers: { type: integer }
            unanswered_questions: { type: integer }
            rooms: { type: integer }
            room_messages: { type: integer }
            questions_7d: { type: integer }
        series:
          type: object
          description: |
            `signups, visitors (null without Umami), lessons, attempts,
            attempts_solved, attempts_graded, course_enrollments,
            courses_completed, questions, answers, room_messages, brains,
            games, duels, pdf_downloads`. `duels`: duels played to the end
            (not void), guests' included, by the day they started;
            `pdf_downloads`: first downloads of an exam PDF by a visitor
            (`contenu.telechargements`).
          additionalProperties:
            oneOf: [{ $ref: '#/components/schemas/Series' }, { type: 'null' }]
        active_members:
          allOf:
            - $ref: '#/components/schemas/Series'
            - type: object
              properties:
                dau: { type: integer }
                wau: { type: integer }
                mau: { type: integer }
                stickiness: { type: [number, 'null'] }
        funnel:
          type: array
          items:
            type: object
            properties:
              step: { type: string, enum: [signed_up, verified, onboarded, first_lesson, first_exercise] }
              n: { type: integer }
        top_courses:
          type: array
          items:
            type: object
            properties: { title: { type: string }, slug: { type: string }, completed: { type: integer }, enrolled: { type: integer } }
        brains:
          type: object
          properties:
            by_reason:
              type: object
              description: By reason, the most rewarding first.
              additionalProperties: { $ref: '#/components/schemas/Series' }
            in_circulation: { type: integer }
            holders: { type: integer }
        top_brains:
          type: array
          items: { type: object, properties: { pseudo: { type: string }, balance: { type: integer } } }
        games:
          type: object
          properties:
            by_mode:
              type: object
              description: '`duel`, `room`, `ghost`, and `autre` only when there were others.'
              additionalProperties: { $ref: '#/components/schemas/Series' }
            ranked: { type: integer }
            outcomes:
              type: object
              properties: { win: { type: integer }, loss: { type: integer }, draw: { type: integer }, forfeit: { type: integer } }
            players: { type: integer }
        popular_pages:
          type: array
          items: { type: object, properties: { path: { type: string }, views: { type: integer } } }
        latest_signups:
          type: array
          items:
            type: object
            properties: { pseudo: { type: string }, verified: { type: boolean }, date: { type: [string, 'null'], format: date-time } }
        to_process:
          type: object
          properties:
            reports: { type: integer }
            suggestions: { type: integer }
            resource_requests: { type: integer }
            draft_courses: { type: integer }
            pending_exams: { type: integer }
            draft_exams: { type: integer }
            unanswered_questions: { type: integer }
            unverified_accounts: { type: integer }
        pending: { $ref: '#/components/schemas/AdminPending' }
        donation_goal: { $ref: '#/components/schemas/DonationGoal' }
        http:
          type: object
          required: [available, since, requests, errors_5xx, p95_ms]
          properties:
            available: { type: boolean, description: False when nothing was recorded over the period nor the one before. }
            since: { type: [string, 'null'], format: date, description: The first day recorded. }
            requests: { $ref: '#/components/schemas/Series' }
            errors_5xx: { $ref: '#/components/schemas/Series' }
            p95_ms:
              type: object
              required: [values, total, previous]
              properties:
                values: { type: array, items: { type: [integer, 'null'] }, description: One per day of the period, oldest first. }
                total: { type: [integer, 'null'], description: Over the whole period. }
                previous: { type: [integer, 'null'], description: Over the N days before. }
        catalog:
          type: array
          description: By downloads (most first), then name; subjects with nothing are left out.
          items:
            type: object
            required: [subject_slug, subject_name, courses, exercises, pdfs, downloads]
            properties:
              subject_slug: { type: string }
              subject_name: { type: string, description: The courses' name of the subject, else the exams'. }
              courses: { type: integer }
              exercises: { type: integer, description: Of those courses. }
              pdfs: { type: integer, description: Published exams with a statement PDF. }
              downloads: { type: integer, description: Downloads of those exams over the period. }
        top_content:
          type: array
          maxItems: 10
          items:
            type: object
            required: [kind, slug, title, subject_name, views, previous]
            properties:
              kind: { type: string, enum: [course, exam] }
              slug: { type: string }
              title: { type: string }
              subject_name: { type: [string, 'null'] }
              views: { type: integer }
              previous: { type: integer, description: Views over the N days before. }
    AdminContainers:
      type: object
      required: [available, reason, taken_at, stale, containers]
      properties:
        available: { type: boolean }
        reason: { type: [string, 'null'], enum: [not_configured, missing, unreadable, null] }
        taken_at: { type: [string, 'null'], format: date-time }
        stale: { type: boolean, description: The snapshot is more than 3 minutes old. }
        containers:
          type: array
          items:
            type: object
            required: [name, image, state, health, started_at, restarts, cpu_percent, memory_bytes, memory_limit_bytes]
            properties:
              name: { type: string }
              image: { type: string }
              state: { type: string, description: 'Podman''s state, lowercased: running, exited, created, paused, restarting…' }
              health: { type: [string, 'null'], enum: [healthy, unhealthy, starting, null], description: Null without a health check. }
              started_at: { type: [string, 'null'], format: date-time }
              restarts: { type: integer }
              cpu_percent: { type: [number, 'null'] }
              memory_bytes: { type: [integer, 'null'] }
              memory_limit_bytes: { type: [integer, 'null'], description: Null without a limit. }
    JournalConsent:
      type: object
      required: [measure, at]
      properties:
        measure: { type: boolean }
        at: { type: string, format: date-time }
    JournalVisitor:
      type: object
      properties:
        visitor_id: { type: string, format: uuid }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        page_views: { type: integer }
        member_id: { type: [integer, 'null'] }
    JournalItem:
      type: object
      required: [id, at, kind, data, link]
      description: |
        `data` by `kind`:
        `page_view` {path, referrer} (link: the path);
        `security` {event, ip, user_agent, detail}, `event` one of `signup`,
        `login`, `login_failed`, `logout`, `password_changed`,
        `password_reset_requested`, `password_reset`, `email_verified`,
        `oauth_login`, `oauth_linked`, `oauth_unlinked`;
        `consent` {measure, version};
        `signup` {};
        `lesson_completed` {course_title, lesson_title} (link
        `/cours/{course}/lecon/{lesson}`);
        `exercise_attempt` {course_title, exercise_title, correct} (link
        `/cours/{course}/exercice/{id}`);
        `course_enrolled` {course_title} (link `/cours/{course}`);
        `game` {mode, subject, outcome, ranked};
        `forum_question` {title}, `forum_answer` {question_title} (link
        `/forum/q/{slug}`);
        `room_message` {room_name} (link `/salons/{slug}`; never the
        message);
        `brains` {amount, reason};
        `download` {exam_title} (link `/examens/{slug}`).
      properties:
        id: { type: string, example: 'page_view:1234', description: '`<kind>:<row id>`.' }
        at: { type: string, format: date-time }
        kind:
          type: string
          enum: [page_view, security, consent, signup, lesson_completed, exercise_attempt,
                 course_enrolled, game, forum_question, forum_answer, room_message, brains, download]
        who:
          description: |
            On `/v1/admin/activity` only: `{member_id, pseudo}`, `{visitor_id}`,
            or null (a failed login on an unknown account).
          oneOf:
            - type: object
              properties: { member_id: { type: integer }, pseudo: { type: [string, 'null'] } }
            - type: object
              properties: { visitor_id: { type: string, format: uuid } }
            - type: 'null'
        data: { type: object }
        link: { type: [string, 'null'], description: A path of the site. }
    JournalPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/JournalItem' } }
        next_cursor: { type: [string, 'null'] }
    AdminListing:
      type: object
      required: [data, page, per_page, total, counters]
      properties:
        data: { type: array, items: {} }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, description: Rows matching the filters, over every page. }
        counters: { type: object, description: 'Rows per status, whatever the filters.' }
    AdminNews:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        lead: { type: [string, 'null'] }
        content_md: { type: string }
        published: { type: boolean, description: Published and its date reached. }
        published_at: { type: [string, 'null'], format: date-time }
        author: { type: [string, 'null'] }
        updated_at: { type: [string, 'null'], format: date-time }
        web_url: { type: string }
    AdminNewsBody:
      type: object
      properties:
        title: { type: string, minLength: 5, maxLength: 150 }
        lead: { type: [string, 'null'], maxLength: 500 }
        content_md: { type: string, minLength: 20, maxLength: 20000 }
    AdminCourse:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        theme: { type: string }
        status: { type: string, enum: [brouillon, publie, archive] }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        author: { type: [string, 'null'] }
        chapter_count: { type: integer }
        lesson_count: { type: integer }
        exercise_count: { type: integer }
        enrollment_count: { type: integer }
        publishable: { type: boolean, description: It has lessons. }
        published_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        web_url: { type: string }
    AdminExam:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        subject: { $ref: '#/components/schemas/ExamSubject' }
        subject_label: { type: string, example: Mathématiques }
        country: { type: string, example: FR }
        status: { type: string, enum: [attente_import, brouillon, publie] }
        part_count: { type: integer }
        original_filename: { type: [string, 'null'] }
        ai_prompt: { type: [string, 'null'] }
        import_prompt: { type: string, description: The whole prompt to send to an AI with the PDF. }
        ai_error: { type: [string, 'null'] }
        analyzed_at: { type: [string, 'null'], format: date-time }
        published_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        web_url: { type: string }
        pdf_url: { type: [string, 'null'], example: /v1/admin/exams/bac-2025/pdf }
    ResourceRequest:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        author_name: { type: string }
        license: { oneOf: [{ $ref: '#/components/schemas/License' }, { type: 'null' }] }
        description: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        lang: { type: [string, 'null'] }
        size_bytes: { type: integer }
        original_filename: { type: string }
        file_url: { type: string, example: /v1/admin/resource-requests/3/file }
        status: { type: string, enum: [en_attente, acceptee, refusee] }
        reason: { type: [string, 'null'] }
        requested_by: { type: [string, 'null'] }
        handled_by: { type: [string, 'null'] }
        handled_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        resource_slug: { type: [string, 'null'] }
    AdminMember:
      type: object
      properties:
        id: { type: string }
        pseudo: { type: string }
        email: { type: string }
        roles: { type: array, items: { type: string } }
        goals: { type: array, items: { type: string } }
        school_level: { type: [string, 'null'] }
        class: { type: [string, 'null'] }
    Report:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [faute, amelioration, spam, abus, hors_sujet] }
        status: { type: string, enum: [nouveau, retenu, corrige, refuse] }
        message: { type: string }
        location: { type: [string, 'null'] }
        reply: { type: [string, 'null'] }
        author: { type: [string, 'null'] }
        target:
          type: object
          description: |
            What the report is about. `exists` is false once deleted (`label`
            and `web_url` null). The slugs and ids that build its page are
            given for its type only.
          properties:
            type: { type: string, enum: [course, lesson, exercise, exam, question, answer] }
            id: { type: integer }
            exists: { type: boolean }
            label: { type: [string, 'null'], description: 'Its title; for an answer, its author''s pseudo.' }
            web_url: { type: [string, 'null'] }
            course_slug: { type: string }
            lesson_slug: { type: string }
            exercise_id: { type: integer }
            exam_slug: { type: string }
            question_slug: { type: string }
            answer_id: { type: integer }
        handled_by: { type: [string, 'null'] }
        handled_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
    Suggestion:
      type: object
      properties:
        id: { type: integer }
        title: { type: [string, 'null'] }
        message: { type: string }
        image_url: { type: [string, 'null'], description: On the public storage (`PUBLIC_STORAGE_URL`). }
        status: { type: string, enum: [nouvelle, retenue, realisee, ecartee] }
        reply: { type: [string, 'null'] }
        author: { type: [string, 'null'] }
        handled_by: { type: [string, 'null'] }
        handled_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
