  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Check a login and a password, open a session
      description: |
        `login` is an e-mail or a pseudo, ignoring case. 5 attempts per minute
        per login and address, even with the service key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              additionalProperties: false
              properties:
                login: { type: string }
                password: { type: string }
                remember: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/Opened' }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '415': { $ref: '#/components/responses/Problem' }
        '422':
          description: Unknown login, wrong password, or an account without a password.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.pulsars.science/problems/invalid-credentials
                title: Invalid credentials
                status: 422
                detail: These credentials do not match any account.
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account and open a session
      description: |
        The rules of Laravel's `CreateNewUser` (`auth-sessions.md` §4). Every
        field error at once, each with a `code`. 10 sign-ups per hour per
        address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pseudo: { type: string, minLength: 3, maxLength: 30 }
                email: { type: string, maxLength: 255 }
                password: { type: string, minLength: 8, maxLength: 255 }
                password_confirmation: { type: string }
                locale: { type: [string, 'null'], enum: [fr, en, ru, null] }
      responses:
        '201': { $ref: '#/components/responses/Opened' }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '422': { $ref: '#/components/responses/InvalidFields' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: The account of a session, which is extended
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: A live session
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [user, session]
                    properties:
                      user: { $ref: '#/components/schemas/AccountUser' }
                      session: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/SessionInvalid' }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke a session
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '204':
          description: Revoked, or already invalid.

  /v1/auth/sessions:
    post:
      tags: [auth]
      operationId: openSession
      summary: Open a session for an account the site authenticated (service key)
      description: After Google, a reset link, or for the seeder's administrator.
      parameters:
        - $ref: '#/components/parameters/ServiceKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              additionalProperties: false
              properties:
                user_id: { type: string, example: '42' }
                remember: { type: boolean, default: false }
      responses:
        '201': { $ref: '#/components/responses/Opened' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/auth/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: Change the password of the session's account
      description: |
        `current_password` is required only when the account has a password.
        Every other session of the account is revoked.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                current_password: { type: [string, 'null'] }
                password: { type: string, minLength: 8, maxLength: 255 }
                password_confirmation: { type: string }
      responses:
        '204':
          description: Changed.
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a password after a reset link the site checked (service key)
      description: Every session of the account is revoked.
      parameters:
        - $ref: '#/components/parameters/ServiceKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              additionalProperties: false
              properties:
                user_id: { type: string }
                password: { type: string, minLength: 8, maxLength: 255 }
                password_confirmation: { type: string }
      responses:
        '204':
          description: Changed.
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/auth/email/verification:
    post:
      tags: [auth]
      operationId: sendVerification
      summary: Mail the address verification link again (24 h)
      description: Nothing is sent when the address is already verified. 6 per minute per account.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                lang: { type: [string, 'null'], enum: [fr, en, ru, null], description: The mail's language when the account has none. }
      responses:
        '204':
          description: Sent, or nothing to send.
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Verify an address with the token of its link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [user]
                    properties:
                      user: { $ref: '#/components/schemas/AccountUser' }
        '422': { $ref: '#/components/responses/InvalidToken' }

  /v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Mail a password reset link (60 min) if an account has the address
      description: |
        Always 204: the answer never tells whether the account exists. At
        most one mail a minute per account; 5 requests a minute per address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string }
                lang: { type: [string, 'null'], enum: [fr, en, ru, null] }
      responses:
        '204':
          description: Done (sent or not).
        '422': { $ref: '#/components/responses/InvalidFields' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/password/reset-with-token:
    post:
      tags: [auth]
      operationId: resetPasswordWithToken
      summary: Set a password with the token of a reset link
      description: Every session of the account is revoked. The address is not marked verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              additionalProperties: false
              properties:
                email: { type: string }
                token: { type: string }
                password: { type: string, minLength: 8, maxLength: 255 }
                password_confirmation: { type: string }
      responses:
        '204':
          description: Changed.
        '422':
          description: Invalid password (`invalid-body`) or link (`invalid-token`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/auth/oauth/resolve:
    post:
      tags: [auth]
      operationId: resolveOauth
      summary: Find, link or create the account of a Google identity (service key)
      description: The rules of the site's `ConnexionSociale::resoudre` (`auth-sessions.md` §4c).
      parameters:
        - $ref: '#/components/parameters/ServiceKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, subject]
              additionalProperties: false
              properties:
                provider: { type: string, enum: [google, discord] }
                subject: { type: string, minLength: 1, maxLength: 255 }
                email: { type: [string, 'null'] }
                email_verified: { type: boolean, default: false }
                name: { type: [string, 'null'] }
                nickname: { type: [string, 'null'] }
                remember: { type: boolean, default: false }
                current_user_id: { type: [string, 'null'], description: The member logged in on the site; links instead of logging in. }
      responses:
        '200': { $ref: '#/components/responses/Resolved' }
        '201': { $ref: '#/components/responses/Resolved' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/auth/oauth/{provider}:
    delete:
      tags: [auth]
      operationId: unlinkOauth
      summary: Unlink a provider from the session's account
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - name: provider
          in: path
          required: true
          schema: { type: string, example: google }
      responses:
        '204':
          description: Unlinked, or nothing was linked.
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/auth/token:
    post:
      tags: [auth]
      operationId: issueGameToken
      summary: A game token for the member of the session
      description: |
        The game token of the games and the languages section
        (`auth-jwt.md`). The session
        comes from the `pulsars_auth` cookie (browsers, `credentials:
        "include"`) or `Pulsars-Session` (servers). Browsers must send an
        `Origin` listed in `CORS_ALLOWED_ORIGINS`, `Content-Type:
        application/json`, and a same-site `Sec-Fetch-Site`; answers to a
        listed origin carry credentialed CORS headers. The token is signed
        by the API (`iss` `https://api.pulsars.science`, `aud`
        `api.pulsars.science`) with the key published at
        `/.well-known/jwks.json`. `503` when no signing key is configured
        (development only).
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: A token, valid 5 minutes.
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [token, token_type, expires_in, expires_at]
                properties:
                  token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer, example: 300 }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    options:
      tags: [auth]
      operationId: issueGameTokenPreflight
      summary: CORS preflight, for listed origins only
      responses:
        '204':
          description: 'Allowed (`Access-Control-Allow-Methods: POST`).'
        '403': { $ref: '#/components/responses/Problem' }

  /.well-known/jwks.json:
    get:
      tags: [auth]
      operationId: getApiJwks
      summary: The API's public signing key
      description: |
        The key of the game tokens the API signs, for anyone who wants to
        verify them. The API itself verifies with its key directly. `keys`
        is empty when no key is configured (development only).
      responses:
        '200':
          description: A JWK set (`application/jwk-set+json`, cached 5 minutes, any origin).
          content:
            application/jwk-set+json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, crv, x, kid, use, alg]
                      properties:
                        kty: { type: string, enum: [OKP] }
                        crv: { type: string, enum: [Ed25519] }
                        x: { type: string }
                        kid: { type: string, example: 2026-10-ed25519-1 }
                        use: { type: string, enum: [sig] }
                        alg: { type: string, enum: [EdDSA] }

  /v1/me:
    get:
      tags: [account]
      operationId: getMe
      summary: Public profile of the token's user
      description: |
        Returns exactly what `https://pulsars.science/membres/{pseudo}` shows to
        anyone, minus school level and class (see `game-design.md` /
        decisions): pseudo, avatar, bio, roles, membership date, XP and level,
        plus the member's brains balance (`brains.md` §4; always shown to its
        owner, whatever `cerveaux_publics` says). With a game token, never
        e-mail, locale, social logins or moderation state.

        With the site's session (`Pulsars-Session`, tried first) the owner's
        account state is added, for the site's header: `email`,
        `email_verified`, `onboarded`, `locale`, `forum_muted_until` (the
        mute of `PUT /v1/moderation/members/{id}/mute`, while it holds).

        `Cache-Control: private, no-store`.
      security:
        - gameToken: []
        - {}
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Me' }
              example:
                data:
                  id: '1'
                  pseudo: jikuji
                  avatar_url: null
                  bio: null
                  member_since: '2026-08-07T14:44:15Z'
                  roles:
                    - { slug: super-admin, name: Super admin, category: permission, color: '#d1544f' }
                  xp:
                    total: 0
                    level: 1
                    level_start: 0
                    next_level_at: 100
                  brains: 0
                  profile_url: https://pulsars.science/membres/jikuji
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The account in `sub` no longer exists (deleted after the token was issued).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/game/leaderboard:
    get:
      tags: [game]
      operationId: getGameLeaderboard
      summary: Best Glicko-2 ratings of a subject
      description: |
        Players with at least one ranked match (1 vs 1 between accounts) in
        `subject`, best rating first. Equal shown ratings share a rank.
        Pseudo and avatar come from `site.members`; deleted accounts are
        skipped. A rating whose deviation (RD) is above 110 is
        `provisional`.

        Public: any origin, no token. `Cache-Control: public, max-age=30`.
      parameters:
        - name: subject
          in: query
          schema: { $ref: '#/components/schemas/GameSubject' }
          description: Absent → `all`.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: The leaderboard
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=30' }
          content:
            application/json:
              schema:
                type: object
                required: [subject, data]
                properties:
                  subject: { $ref: '#/components/schemas/GameSubject' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GameLeader' }
              example:
                subject: maths
                data:
                  - { rank: 1, user_id: '2', pseudo: ada, avatar_url: null, rating: 1662,
                      provisional: true, games: 1, wins: 1, losses: 0, draws: 0 }
                  - { rank: 2, user_id: '1', pseudo: jikuji, avatar_url: null, rating: 1338,
                      provisional: true, games: 1, wins: 0, losses: 1, draws: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/game/me:
    get:
      tags: [game]
      operationId: getGameMe
      summary: The token's brains, ratings and last matches
      description: |
        The brains balance of the token's account (`brains.md` §4; 0 for an
        account without movements). Every rating of the token's account (one per subject key it played
        ranked, `all` included) with its rank in that subject's leaderboard,
        and its last 20 finished matches of any mode, newest first.
        `opponents` are the names of the other seats (players, guests and
        ghosts) as they were at match time.

        Only the game front end may call it from a browser (restricted CORS).
        `Cache-Control: no-store`.
      security:
        - gameToken: []
      responses:
        '200':
          description: Ratings and recent matches
          content:
            application/json:
              schema:
                type: object
                required: [brains, ratings, recent]
                properties:
                  brains:
                    type: integer
                    minimum: 0
                    description: Brains balance (`site.member_brains`), always shown to its owner.
                  ratings:
                    type: array
                    items: { $ref: '#/components/schemas/GameRating' }
                  recent:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/GameRecentMatch' }
              example:
                brains: 42
                ratings:
                  - { subject: maths, rating: 1338, provisional: true, games: 1, wins: 0,
                      losses: 1, draws: 0, rank: 2 }
                recent:
                  - match_id: 01a149ed-26f2-765b-911c-736104ab6a2a
                    mode: duel
                    ranked: true
                    subject: maths
                    rules: { duration: null, target: 10, penalty: false }
                    ended_at: '2026-10-17T12:54:18Z'
                    end_reason: completed
                    outcome: loss
                    score: 6
                    rating_before: 1500
                    rating_after: 1338
                    opponents: [ada]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The token's `sub` is not an account id.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/game/admin/stats:
    get:
      tags: [game]
      operationId: getGameAdminStats
      summary: Game statistics for the admin dashboard
      description: |
        What is live now (from the game server's memory) and the activity
        of the last `days` UTC days (from the `game` schema), for an admin
        client with a game token, server to server (`game-protocol.md`
        §9.1). The site's dashboard uses `GET /v1/admin/game/stats` with a
        session.

        The token's `roles` must contain `admin` or `super-admin`, else
        `403` with `reason: insufficient_scope`. Restricted CORS like
        `/v1/game/me`; a request without `Origin` is served as usual.
        `Cache-Control: no-store`.

        All times are UTC; days and hours without matches are zeros. A match
        counts on the day and hour of its `started_at`, from the moment it
        is created (running matches included). Today's `accounts` and
        `guests` include the seats of the matches running now.
      security:
        - gameToken: []
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
          description: Days in `daily`, ending today; also the period of `subjects`, `rules` and `quality`.
      responses:
        '200':
          description: The statistics
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameAdminStats' }
              example:
                generated_at: '2026-10-17T13:40:00Z'
                live:
                  sessions: 12
                  guests: 4
                  queued: 2
                  rooms_open: 1
                  matches: { duel: 3, room: 1, ghost: 2 }
                  players_in_matches: 9
                today:
                  matches_started: 41
                  by_hour: [0, 0, 0, 0, 0, 0, 0, 1, 2, 4, 6, 5, 7, 9, 7, 0, 0, 0, 0, 0, 0, 0, 0, 0]
                  accounts: 17
                  guests: 6
                daily:
                  - { date: '2026-10-16', duel: 30, room: 4, ghost: 6, ranked: 25, void: 2,
                      forfeit: 3, accounts: 21, guests: 9 }
                  - { date: '2026-10-17', duel: 31, room: 4, ghost: 6, ranked: 26, void: 1,
                      forfeit: 2, accounts: 17, guests: 6 }
                subjects:
                  - { subject: maths, matches: 120 }
                  - { subject: physics, matches: 31 }
                  - { subject: all, matches: 12 }
                  - { subject: chemistry, matches: 4 }
                  - { subject: computer-science, matches: 0 }
                rules:
                  - { rules: { duration: 60, target: null, penalty: false }, matches: 80 }
                  - { rules: { duration: null, target: 10, penalty: true }, matches: 41 }
                quality: { avg_match_seconds: 64.2, avg_answers_per_player: 23.1, accuracy: 0.71 }
                ratings:
                  players: 25
                  provisional: 18
                  by_subject:
                    - { subject: maths, players: 20 }
                    - { subject: physics, players: 7 }
                    - { subject: all, players: 3 }
                    - { subject: chemistry, players: 1 }
                    - { subject: computer-science, players: 0 }
                seasons:
                  - { month: '2026-09', subject: maths, ranked_players: 6, closed_at: '2026-10-01T00:00:12Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: The database or the game server does not answer.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/languages:
    get:
      tags: [languages]
      operationId: listLanguages
      summary: Published languages, in order
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The languages
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Language' }
              example:
                data:
                  - code: zh
                    name: Mandarin
                    lang: fr
                    native_name: 中文
                    script: Hans
                    reading_system: pinyin
                    countries: [CN, TW, SG]
                    level_count: 2
                    word_count: 38
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/languages/{code}:
    get:
      tags: [languages]
      operationId: getLanguage
      summary: One published language, with its levels in order
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, example: zh }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The language
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Language'
                      - type: object
                        required: [levels]
                        properties:
                          levels:
                            type: array
                            items: { $ref: '#/components/schemas/LanguageLevel' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/languages/{code}/levels/{level}:
    get:
      tags: [languages]
      operationId: getLanguageLevel
      summary: One level of a language, with all its words
      description: |
        Every word of the level, in teaching order, without pagination (a
        level holds a few hundred words at most). `previous` and `next` name
        the neighbouring levels.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, example: zh }
        - name: level
          in: path
          required: true
          schema: { type: string, example: hsk-1 }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The level
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/LanguageLevel'
                      - type: object
                        required: [language, previous, next, words]
                        properties:
                          language:
                            type: object
                            required: [code, name, native_name, script, reading_system]
                            properties:
                              code: { type: string }
                              name: { type: string }
                              native_name: { type: string }
                              script: { type: string }
                              reading_system: { type: [string, 'null'] }
                          previous: { $ref: '#/components/schemas/LanguageLevelRef' }
                          next: { $ref: '#/components/schemas/LanguageLevelRef' }
                          words:
                            type: array
                            items: { $ref: '#/components/schemas/Word' }
              example:
                data:
                  language: { code: zh, name: Mandarin, native_name: 中文, script: Hans, reading_system: pinyin }
                  slug: hsk-1
                  framework: HSK
                  position: 1
                  title: HSK 1
                  description: 'Les premiers mots : se présenter, saluer, compter, la famille et les repas.'
                  lang: fr
                  word_count: 38
                  previous: null
                  next: { slug: hsk-2, title: HSK 2 }
                  words:
                    - { id: 1, text: 我, reading: wǒ, meaning: 'je, moi', lang: fr }
                    - { id: 2, text: 你, reading: nǐ, meaning: 'tu, toi', lang: fr }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/languages/events:
    post:
      tags: [languages]
      operationId: recordLanguageEvent
      summary: Record what a learner did (anonymous)
      description: |
        Sent by the front end of `pulsars.science/langues` when a lesson ends
        or a character is written (`docs/languages.md` §Statistics). No
        account: `learner` is a random UUID the browser keeps. Restricted
        CORS (the front end's origin only); rate limited like any request.
        Missed word ids that are not in the level are dropped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [kind, learner, language, level, score, correct, questions, duration_ms, missed_words]
                  properties:
                    kind: { const: lesson.completed }
                    learner: { type: string, format: uuid }
                    language: { type: string, example: zh }
                    level: { type: string, example: hsk-1 }
                    score: { type: integer, minimum: 0, maximum: 10000 }
                    correct: { type: integer, minimum: 0, description: At most `questions`. }
                    questions: { type: integer, minimum: 1, maximum: 100 }
                    duration_ms: { type: integer, minimum: 0, maximum: 86400000 }
                    missed_words: { type: array, maxItems: 100, items: { type: integer } }
                - type: object
                  required: [kind, learner, language, level, character, mode, mistakes]
                  properties:
                    kind: { const: writing.completed }
                    learner: { type: string, format: uuid }
                    language: { type: string, example: zh }
                    level: { type: string, example: hsk-1 }
                    character: { type: string, minLength: 1, maxLength: 1, example: 我 }
                    mode: { enum: [trace, memory] }
                    mistakes: { type: integer, minimum: 0, maximum: 1000 }
      responses:
        '202': { description: Recorded. No body. }
        '400':
          description: '`invalid-body` problem, with one entry per field at fault in `errors`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/languages/admin/stats:
    get:
      tags: [languages]
      operationId: getLanguageAdminStats
      summary: Statistics of the languages section, for the admin dashboard
      description: |
        Over the last `days` UTC days (1–90, default 30): distinct learners,
        lessons, questions and right answers, time in lessons, characters
        written (and from memory without a mistake); the same per day
        (zero-filled) and per level; the 10 most missed words and the 10
        characters written with the most mistakes (at least 3 writings).
        All-time totals too. Needs a game token whose `roles` contain `admin`
        or `super-admin`. `Cache-Control: no-store`.
      security: [{ gameToken: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          description: The statistics
          content:
            application/json:
              example:
                generated_at: '2026-10-20T15:30:00Z'
                days: 30
                totals: { learners: 12, lessons: 40, questions: 400, correct: 331, accuracy: 0.828, lesson_minutes: 61.5, writings: 95, from_memory: 30 }
                all_time: { learners: 12, lessons: 40, writings: 95 }
                daily: [{ date: '2026-10-20', learners: 3, lessons: 5, writings: 12 }]
                levels: [{ language: zh, level: hsk-1, title: HSK 1, learners: 12, lessons: 40, accuracy: 0.828, average_score: 141.5, best_score: 260, writings: 95 }]
                missed_words: [{ id: 8, text: 的, reading: de, meaning: particule du complément du nom, language: zh, level: hsk-1, misses: 9 }]
                hardest_characters: [{ character: 飞, writings: 4, average_mistakes: 3.25, from_memory: 0 }]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Missing or invalid token. }
        '403': { description: '`insufficient-scope`: not an admin.' }

  /v1/forum/themes:
    get:
      tags: [forum]
      operationId: listForumThemes
      summary: The forum's themes, in order, with their question counts
      description: |
        Also the choices of the « ask a question » form (Laravel's
        `/forum/poser`). Deleted questions are not counted, hidden ones are.
        `Cache-Control: no-store`.
      responses:
        '200':
          description: Every theme
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ForumTheme' }

  /v1/forum/themes/{slug}:
    get:
      tags: [forum]
      operationId: getForumTheme
      summary: One theme (the header of `/forum/theme/{slug}`)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The theme
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ForumTheme' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/forum/questions:
    get:
      tags: [forum]
      operationId: listForumQuestions
      summary: Questions, pinned first, by page
      description: |
        Laravel's `/forum` and `/forum/theme/{theme}`. Pinned questions come
        first whatever `sort`. Numbered pages only: `total` is always there,
        `next_cursor` always null. With a session, `voted` says whether the
        member voted; a hidden question has a null `excerpt` except for
        moderators. `Cache-Control: no-store`.
      parameters:
        - $ref: '#/components/parameters/OptionalSessionToken'
        - name: theme
          in: query
          description: The slug of a theme; an unknown slug answers 404.
          schema: { type: string, maxLength: 255 }
        - name: sort
          in: query
          description: |
            `recent` (newest first), `popular` (most votes, then newest) or
            `unanswered` (only questions without an answer, newest first).
          schema: { type: string, enum: [recent, popular, unanswered], default: recent }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ForumQuestionSummary' }
                  next_cursor: { type: 'null' }
                  total: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [forum]
      operationId: askForumQuestion
      summary: Ask a question
      description: |
        A verified member who finished the welcome steps; 403 while muted
        (checked first). Fields are trimmed, then: `theme` the slug of a
        theme (`required`, `invalid`), `title` 8 to 150 characters and
        `body` 15 to 10 000 (`required`, `too_short`, `too_long`). The slug
        is the title's first 60 characters in ASCII, plus `-` and 6 random
        characters.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                theme: { type: string, example: mathematiques }
                title: { type: string, minLength: 8, maxLength: 150 }
                body: { type: string, minLength: 15, maxLength: 10000, description: Markdown with LaTeX. }
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, slug]
                    properties:
                      id: { type: integer }
                      slug: { type: string, example: comment-factoriser-un-trinome-x7k2qa }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/forum/questions/{slug}:
    get:
      tags: [forum]
      operationId: getForumQuestion
      summary: A question and its answers, as a tree
      description: |
        Counts a view once per reader (the member, or else the address)
        every two hours, as Laravel did once per session. A hidden message
        keeps its title and `hidden_reason` but its `body_md` is null,
        except for moderators. Replies to a deleted answer are left out with
        it. `Cache-Control: no-store`.
      parameters:
        - $ref: '#/components/parameters/OptionalSessionToken'
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The thread
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ForumQuestion' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/forum/questions/{question}/answers:
    post:
      tags: [forum]
      operationId: answerForumQuestion
      summary: Answer a question, or reply to one of its answers
      description: |
        A verified member. 404 for an unknown question, then 403 while muted,
        then 409 `locked` on a locked thread. `body` is 2 to 10 000
        characters; `parent_id` must be an answer of the same question
        (`invalid` otherwise).
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/ForumQuestionKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                body: { type: string, minLength: 2, maxLength: 10000 }
                parent_id: { type: [integer, 'null'] }
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id: { type: integer }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`locked`: the thread takes no more answers.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/forum/questions/{question}/answers/{id}/accept:
    post:
      tags: [forum]
      operationId: acceptForumAnswer
      summary: Mark an answer as accepted, or take the mark back
      description: |
        Only the question's author (403). An answer of another question
        answers 404. No body. A toggle, as in Laravel: accepting the
        accepted answer again takes the mark back.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/ForumQuestionKey'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The accepted answer afterwards
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [accepted_answer_id]
                    properties:
                      accepted_answer_id: { type: [integer, 'null'] }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/forum/questions/{question}/vote:
    post:
      tags: [forum]
      operationId: toggleForumQuestionVote
      summary: Vote for a question, or take the vote back
      description: A verified member, muted or not. No body.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/ForumQuestionKey'
      responses:
        '200':
          description: The vote afterwards
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [voted, votes]
                    properties:
                      voted: { type: boolean }
                      votes: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/forum/answers/{id}/vote:
    post:
      tags: [forum]
      operationId: toggleForumAnswerVote
      summary: Vote for an answer, or take the vote back
      description: A verified member, muted or not. No body.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The vote afterwards
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [voted, votes]
                    properties:
                      voted: { type: boolean }
                      votes: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/forum/reports:
    post:
      tags: [forum]
      operationId: reportForumMessage
      summary: Report a question or an answer to the moderators
      description: |
        A verified member; 20 a minute, counted before the body is read. The
        report joins the moderators' queue (`site.signalements`, `statut`
        `nouveau`). `type` keeps Laravel's values.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                target_type: { type: string, enum: [question, answer] }
                target_id: { type: integer }
                type: { type: string, enum: [spam, abus, hors_sujet] }
                message: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '201':
          description: Reported
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id: { type: integer }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/forum/questions/{question}/translations:
    post:
      tags: [forum]
      operationId: translateForumQuestion
      summary: The title and body of a question, translated by DeepL
      description: |
        Open to everyone; 10 a minute per reader (the member, or else the
        address), counted first. The translation is stored and served again
        while the question's text is unchanged (`cached`). A hidden question
        is only translated for moderators (403). Without `DEEPL_API_KEY`:
        503 `not_configured`; when DeepL fails: 503 `upstream_failed`.
      parameters:
        - $ref: '#/components/parameters/OptionalSessionToken'
        - $ref: '#/components/parameters/ForumQuestionKey'
      requestBody: { $ref: '#/components/requestBodies/ForumTranslate' }
      responses:
        '200': { $ref: '#/components/responses/ForumTranslation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/TranslationUnavailable' }

  /v1/forum/answers/{id}/translations:
    post:
      tags: [forum]
      operationId: translateForumAnswer
      summary: The body of an answer, translated by DeepL
      description: As for a question; `title` is null.
      parameters:
        - $ref: '#/components/parameters/OptionalSessionToken'
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody: { $ref: '#/components/requestBodies/ForumTranslate' }
      responses:
        '200': { $ref: '#/components/responses/ForumTranslation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/TranslationUnavailable' }

  /v1/moderation/forum/questions/{id}:
    delete:
      tags: [forum-moderation]
      operationId: deleteForumQuestion
      summary: Soft delete a question
      description: Its page answers 404 until it is restored. 404 when already deleted.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/ForumMessageId'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/moderation/forum/questions/{id}/hide:
    post:
      tags: [forum-moderation]
      operationId: toggleForumQuestionHidden
      summary: Hide a question behind a notice, or show it again
      description: |
        Hiding records the moderator and an optional `reason` (at most 300
        characters, shown to readers); showing again clears them, and the
        body is then ignored. Send `{}` without a reason.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/ForumMessageId'
      requestBody: { $ref: '#/components/requestBodies/ForumHide' }
      responses:
        '200': { $ref: '#/components/responses/ForumHidden' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/moderation/forum/questions/{id}/lock:
    post:
      tags: [forum-moderation]
      operationId: toggleForumQuestionLocked
      summary: Lock a thread (no more answers), or unlock it
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/ForumMessageId'
      responses:
        '200':
          description: The state afterwards
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [locked]
                    properties:
                      locked: { type: boolean }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/moderation/forum/questions/{id}/pin:
    post:
      tags: [forum-moderation]
      operationId: toggleForumQuestionPinned
      summary: Pin a question first in every list, or unpin it
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/ForumMessageId'
      responses:
        '200':
          description: The state afterwards
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [pinned]
                    properties:
                      pinned: { type: boolean }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/moderation/forum/questions/{id}/restore:
    post:
      tags: [forum-moderation]
      operationId: restoreForumQuestion
      summary: Bring a deleted question back
      description: 404 only when no question has this id, deleted or not.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/ForumMessageId'
      responses:
        '204': { description: Restored }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/moderation/forum/answers/{id}:
    delete:
      tags: [forum-moderation]
      operationId: deleteForumAnswer
      summary: Soft delete an answer (and hide its replies with it)
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/ForumMessageId'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/moderation/forum/answers/{id}/hide:
    post:
      tags: [forum-moderation]
      operationId: toggleForumAnswerHidden
      summary: Hide an answer behind a notice, or show it again
      description: As for a question.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/ForumMessageId'
      requestBody: { $ref: '#/components/requestBodies/ForumHide' }
      responses:
        '200': { $ref: '#/components/responses/ForumHidden' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/moderation/forum/answers/{id}/restore:
    post:
      tags: [forum-moderation]
      operationId: restoreForumAnswer
      summary: Bring a deleted answer back
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/ForumMessageId'
      responses:
        '204': { description: Restored }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/moderation/members/{id}/mute:
    put:
      tags: [forum-moderation]
      operationId: muteMember
      summary: Keep a member from posting for some days
      description: |
        The member still reads, but may not ask, answer, nor post messages
        while `muted_until` is ahead. Nobody mutes themselves or a member of
        an equal or higher permission level (403): a moderator mutes
        members, an admin also moderators, a super admin also admins.
        `days` 1 to 365 (`required`, `out_of_range`), `reason` at most 300
        characters (`required`, `too_long`). Muting again replaces the mute.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: id, in: path, required: true, schema: { type: string, example: '42' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                days: { type: integer, minimum: 1, maximum: 365 }
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Muted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [user_id, muted_until, reason]
                    properties:
                      user_id: { type: string, example: '42' }
                      muted_until: { type: string, format: date-time }
                      reason: { type: string }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }
    delete:
      tags: [forum-moderation]
      operationId: unmuteMember
      summary: Lift a member's mute
      description: The same permission rule as muting.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: id, in: path, required: true, schema: { type: string, example: '42' } }
      responses:
        '204': { description: Lifted, or there was none }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/members:
    get:
      tags: [members]
      operationId: searchMembers
      summary: Search members by pseudo
      description: |
        Members whose pseudo contains `search` (alias `q`), ignoring case, by
        pseudo, 24 per page (`ProfilPublicController::index`). Without a term
        (after trimming), the list is empty: the site publishes no directory
        of its members. Public. `Cache-Control: no-store`.
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: q, in: query, description: Alias of `search`., schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: One page of members
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MemberSummary' } }
                  next_cursor: { type: 'null' }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/members/{pseudo}:
    get:
      tags: [members]
      operationId: getMemberProfile
      summary: A public profile
      description: |
        `ProfilPublicController::show`. Public; with `Pulsars-Session`, the
        answer adds where the reader stands (`friendship`, `following`).
        Never an e-mail, a locale, social logins or a moderation state.
        `brains` is `null` when the member hides it, except for themselves.
      parameters:
        - $ref: '#/components/parameters/Pseudo'
        - $ref: '#/components/parameters/OptionalSession'
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MemberProfile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/members/{pseudo}/follow:
    parameters:
      - $ref: '#/components/parameters/Pseudo'
      - $ref: '#/components/parameters/SessionToken'
    post:
      tags: [members]
      operationId: followMember
      summary: Follow a member (PUT does the same)
      description: |
        `Abonnements::suivre`: one way, without approval. When the other
        member follows back, they become friends (`origine = abonnement`),
        and a pending request between them is accepted. Following oneself
        does nothing.
      responses:
        '200': { $ref: '#/components/responses/FollowResult' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [members]
      operationId: putFollowMember
      summary: Follow a member
      responses:
        '200': { $ref: '#/components/responses/FollowResult' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [members]
      operationId: unfollowMember
      summary: Stop following a member
      description: A friendship born of the mutual follow goes too; one born of a request stays.
      responses:
        '200': { $ref: '#/components/responses/FollowResult' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/members/{pseudo}/friend-requests:
    post:
      tags: [friends]
      operationId: requestFriendship
      summary: Ask a member to be friends
      description: |
        `AmitieController::store`. 20 per minute per member. `201` when
        sent; `200` when already friends (a success in Laravel); `409`
        `request_pending` when a request of either side waits.
      parameters:
        - $ref: '#/components/parameters/Pseudo'
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200': { $ref: '#/components/responses/FriendshipStateResponse' }
        '201': { $ref: '#/components/responses/FriendshipStateResponse' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidFields' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/friends:
    get:
      tags: [friends]
      operationId: listFriends
      summary: Friends, requests received and requests sent
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: The three lists, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [friends, received, sent]
                    properties:
                      friends: { type: array, items: { $ref: '#/components/schemas/FriendLine' } }
                      received: { type: array, items: { $ref: '#/components/schemas/FriendLine' } }
                      sent: { type: array, items: { $ref: '#/components/schemas/FriendLine' } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/friends/{id}/accept:
    post:
      tags: [friends]
      operationId: acceptFriendship
      summary: Accept a request received
      description: '`404` unless the member is in it; `403` for the member who asked. Idempotent.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200': { $ref: '#/components/responses/FriendshipStateResponse' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/friends/{id}:
    delete:
      tags: [friends]
      operationId: removeFriendship
      summary: Remove a friend, or withdraw or refuse a request
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/friend-qr:
    get:
      tags: [friends]
      operationId: getFriendQr
      summary: The member's friend QR code
      description: |
        Laravel drew the QR code as an SVG on the server
        (`AmiQrController::svg`). The API gives the token and the link the
        code encodes, `https://pulsars.science/ami/{token}`: the site draws
        it. The token is made the first time.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200': { $ref: '#/components/responses/FriendQr' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/me/friend-qr/regenerate:
    post:
      tags: [friends]
      operationId: regenerateFriendQr
      summary: A new friend QR code; the previous one stops working
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200': { $ref: '#/components/responses/FriendQr' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/friends/scan:
    post:
      tags: [friends]
      operationId: scanFriendQr
      summary: Befriend the owner of a scanned QR code
      description: |
        `AmiQrController::scan`, posted by the site's `/ami/{token}` page.
        Friends at once, without a request; a pending request of either side
        is accepted. 30 per minute per member. `404` for a token no longer
        valid, `422` (`token`, `self`) for one's own code.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string }
      responses:
        '200':
          description: Friends
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [state, friendship_id, member]
                    properties:
                      state: { type: string, enum: [friends, already_friends] }
                      friendship_id: { type: integer }
                      member: { $ref: '#/components/schemas/MemberRef' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/rooms:
    get:
      tags: [rooms]
      operationId: listRooms
      summary: The public rooms and the member's private ones
      description: Busiest first (`Room::visiblesPar`). Not paginated, as in Laravel.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: The rooms
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RoomListed' } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a room; its creator owns it
      description: |
        The slug is `contenu.slugify(name)` (`salon` when nothing is left),
        with `-xxxx` appended when taken. Strings are trimmed, blank ones
        are null, as Laravel's middlewares did.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 50 }
                description: { type: [string, 'null'], maxLength: 280 }
                type: { type: string, enum: [public, prive] }
      responses:
        '201': { $ref: '#/components/responses/RoomOpened' }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/rooms/{slug}:
    parameters:
      - $ref: '#/components/parameters/RoomSlug'
      - $ref: '#/components/parameters/SessionToken'
    get:
      tags: [rooms]
      operationId: getRoom
      summary: A room, its latest messages and the reader's rights
      description: |
        `404` for a private room the reader is not in (moderators excepted).
        Opening it marks it read for a member, as Laravel did.
      responses:
        '200': { $ref: '#/components/responses/RoomOpened' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [rooms]
      operationId: deleteRoom
      summary: Delete a room, with its messages and links (owner or moderator)
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/rooms/{slug}/members:
    post:
      tags: [rooms]
      operationId: joinRoom
      summary: Join a public room
      description: Idempotent. `403` for a private room, entered by an invitation link only.
      parameters:
        - $ref: '#/components/parameters/RoomSlug'
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '204': { description: A member. }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/rooms/{slug}/members/me:
    delete:
      tags: [rooms]
      operationId: leaveRoom
      summary: Leave a room
      description: Its owner cannot (`422`, `room`, `owner`); they delete it instead.
      parameters:
        - $ref: '#/components/parameters/RoomSlug'
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '204': { description: Left, or was not in it. }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/rooms/{slug}/read:
    post:
      tags: [rooms]
      operationId: markRoomRead
      summary: Clear the member's unread count of a room
      parameters:
        - $ref: '#/components/parameters/RoomSlug'
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '204': { description: Marked. }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/rooms/{slug}/messages:
    parameters:
      - $ref: '#/components/parameters/RoomSlug'
      - $ref: '#/components/parameters/SessionToken'
    get:
      tags: [rooms]
      operationId: listRoomMessages
      summary: The thread of a room, oldest first; poll it with `after`
      description: |
        Laravel's pages reloaded the thread every five seconds; there is no
        WebSocket. `after` gives what came after the last message shown;
        `before` pages back. Marks the room read for a member.
      parameters:
        - $ref: '#/components/parameters/ThreadAfter'
        - $ref: '#/components/parameters/ThreadBefore'
        - $ref: '#/components/parameters/ThreadLimit'
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RoomMessage' } }
                  has_more: { type: boolean, description: 'More messages lie beyond these, in the direction asked.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [rooms]
      operationId: postRoomMessage
      summary: Write in a room
      description: |
        Writing in a public room joins it; in a private one, only its
        members write (`403`). Muted members cannot write (`403`). The body
        is trimmed, 1 to 2000 characters, plain text.
      requestBody: { $ref: '#/components/requestBodies/MessageBody' }
      responses:
        '201':
          description: Posted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RoomMessage' }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/rooms/{slug}/invitations:
    parameters:
      - $ref: '#/components/parameters/RoomSlug'
      - $ref: '#/components/parameters/SessionToken'
    get:
      tags: [rooms]
      operationId: listRoomInvitations
      summary: The invitation links of a room (owner or moderator)
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [room, invitations]
                    properties:
                      room: { $ref: '#/components/schemas/RoomInfo' }
                      invitations: { type: array, items: { $ref: '#/components/schemas/RoomInvitation' } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [rooms]
      operationId: createRoomInvitation
      summary: A new invitation link (owner or moderator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                duration_days: { type: [integer, 'null'], minimum: 1, maximum: 365, description: '`null`: never expires.' }
                max_uses: { type: [integer, 'null'], minimum: 1, maximum: 10000, description: '`null`: no limit.' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RoomInvitation' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/rooms/{slug}/invitations/{token}:
    delete:
      tags: [rooms]
      operationId: revokeRoomInvitation
      summary: Revoke a link of this room (owner or moderator)
      parameters:
        - $ref: '#/components/parameters/RoomSlug'
        - $ref: '#/components/parameters/InviteToken'
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/invitations/{token}:
    get:
      tags: [rooms]
      operationId: getRoomInvitation
      summary: The landing page of an invitation link
      description: Shows the room without joining it; no use is counted.
      parameters:
        - $ref: '#/components/parameters/InviteToken'
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: The link and its room
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [valid, invalid_reason, invited_by, room, already_member]
                    properties:
                      valid: { type: boolean }
                      invalid_reason: { $ref: '#/components/schemas/InvalidReason' }
                      invited_by: { type: [string, 'null'] }
                      room: { $ref: '#/components/schemas/RoomInfo' }
                      already_member: { type: boolean }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/invitations/{token}/accept:
    post:
      tags: [rooms]
      operationId: acceptRoomInvitation
      summary: Join the room of a valid link
      description: |
        A use is counted only for a member not in the room yet. `422`
        (`invitation`: `revoked`, `expired` or `exhausted`) for a link that
        no longer works.
      parameters:
        - $ref: '#/components/parameters/InviteToken'
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: A member of the room
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [room_slug]
                    properties:
                      room_slug: { type: string }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/conversations:
    parameters:
      - $ref: '#/components/parameters/SessionToken'
    get:
      tags: [conversations]
      operationId: listConversations
      summary: The member's private conversations, and the friends to write to
      description: |
        Latest first. Every `/v1/conversations` route answers `503`
        `messages-unavailable` on a server without `MESSAGES_KEY`
        (development only).
      responses:
        '200':
          description: Conversations and friends
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [conversations, friends]
                    properties:
                      conversations: { type: array, items: { $ref: '#/components/schemas/ConversationLine' } }
                      friends:
                        type: array
                        description: In natural order of pseudo, ignoring case.
                        items: { $ref: '#/components/schemas/Correspondent' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      tags: [conversations]
      operationId: openConversation
      summary: The conversation with a friend, started if needed
      description: '`201` when started, `200` when found. `403` unless friends; `422` (`pseudo`, `self`) with oneself.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pseudo]
              additionalProperties: false
              properties:
                pseudo: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ConversationId' }
        '201': { $ref: '#/components/responses/ConversationId' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/conversations/{id}:
    get:
      tags: [conversations]
      operationId: getConversation
      summary: A conversation and its latest messages
      description: '`404` unless the member is in it. Marks read what the other member sent, as Laravel did.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, with, is_friend, messages, has_older]
                    properties:
                      id: { type: integer }
                      with: { $ref: '#/components/schemas/Correspondent' }
                      is_friend: { type: boolean, description: '`false`: readable, closed to new messages.' }
                      messages: { type: array, items: { $ref: '#/components/schemas/DirectMessage' } }
                      has_older: { type: boolean }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/conversations/{id}/read:
    post:
      tags: [conversations]
      operationId: markConversationRead
      summary: Mark read what the other member sent
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '204': { description: Marked. }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/conversations/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - $ref: '#/components/parameters/SessionToken'
    get:
      tags: [conversations]
      operationId: listDirectMessages
      summary: The thread, oldest first; poll it with `after`
      description: Marks read as opening does.
      parameters:
        - $ref: '#/components/parameters/ThreadAfter'
        - $ref: '#/components/parameters/ThreadBefore'
        - $ref: '#/components/parameters/ThreadLimit'
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DirectMessage' } }
                  has_more: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      tags: [conversations]
      operationId: postDirectMessage
      summary: Write to a friend
      description: |
        60 per minute per member. `404` unless in the conversation, `403`
        when no longer friends or muted. Sealed at rest with AES-256-GCM.
      requestBody: { $ref: '#/components/requestBodies/MessageBody' }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DirectMessage' }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Problem' }


  /v1/admin/stats:
    get:
      tags: [admin]
      operationId: getAdminStats
      summary: The admin dashboard
      description: |
        Laravel's `StatistiquesAdmin::tout()`. `days` is 7, 30 or 90; any
        other value is 30 (no error, as Laravel). A period ends today
        (UTC, included) and starts at midnight N-1 days ago; each series
        also has `previous`, the total of the N days before.

        `audience`, `series.visitors` and `popular_pages` come from Umami
        (`UMAMI_*`), cached five minutes; without it `audience.available`
        is false and `series.visitors` null. The old site's `visits` log
        is not kept: `active_members` counts members with a dated activity
        (lesson completed, exercise attempt, match, forum question or
        answer), `accounts.active_7d` is its `wau` and
        `audience.connected_24h` its `dau`.

        `http` is the API's own traffic, kept by UTC day in
        `site.http_daily` by every instance (flushed every minute and at
        shutdown; WebSocket upgrades, `/healthz` and `/metrics` excluded):
        `p95_ms` is read from summed latency buckets (5, 10, 25, 50, 75,
        100, 150, 200, 300, 500, 750, 1000, 2000, 5000, 10000 ms and over),
        interpolated inside the bucket that crosses 95 %, null without a
        request. `catalog` is the published content by subject (a course's
        theme subject, an exam's `matiere`, slugified so they meet), with
        the period's PDF downloads. `top_content` is the ten courses and
        exams most viewed over the period (`site.content_views`: exam views
        from `GET /v1/exams/{slug}/corrections`, course views from
        `POST /v1/courses/{slug}/view`), still published.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
      responses:
        '200':
          description: The dashboard
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminStats' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /v1/admin/pending:
    get:
      tags: [admin]
      operationId: getAdminPending
      summary: The pending badge of the admin header
      description: |
        Laravel's `enAttente()`: the three queues where someone waits for an
        answer (resource requests `en_attente`, reports `nouveau` or
        `retenu`, suggestions `nouvelle` or `retenue`). Cheap: three counts.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: The counts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminPending' }
              example:
                data: { resource_requests: 1, reports: 2, suggestions: 0, total: 3 }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /v1/admin/containers:
    get:
      tags: [admin]
      operationId: getAdminContainers
      summary: The health of the server's containers
      description: |
        Read from the snapshot that `pulsars-podman-releve` writes every
        minute (`deploy/podman/README.md`), at `PODMAN_SNAPSHOT_PATH`: the
        API never talks to Podman. Always 200: `available` is false with
        `reason` `not_configured` (no path), `missing` (no file) or
        `unreadable` (not JSON, over 2 MB, no `taken_at`, or `podman ps`
        failed). `stale` when the snapshot is more than 3 minutes old.
        Containers not running or unhealthy come first, then by name;
        `cpu_percent` and the memory are null for a container that is not
        running. Podman 4 and 5 outputs are both read.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: The containers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminContainers' }
              example:
                data:
                  available: true
                  reason: null
                  taken_at: '2026-10-29T12:00:00Z'
                  stale: false
                  containers:
                    - { name: pulsars-web, image: 'ghcr.io/pulsars-science/pulsars-web:0.1.0', state: running, health: unhealthy, started_at: '2026-10-29T09:15:50Z', restarts: 1, cpu_percent: 12.5, memory_bytes: 157286400, memory_limit_bytes: 536870912 }
                    - { name: pulsars-db, image: 'docker.io/library/postgres:17-alpine', state: running, health: healthy, started_at: '2026-10-29T09:15:00Z', restarts: 0, cpu_percent: 2.1, memory_bytes: 61200000, memory_limit_bytes: 2100000000 }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /v1/admin/people:
    get:
      tags: [admin]
      operationId: searchAdminPeople
      summary: Find a member or a visitor
      description: |
        `q` (2 to 100 characters) is matched case-insensitively in the
        e-mail and the pseudo (those that start with it first), 20 members
        at most; an exact visitor id (UUID) finds that visitor. A member's
        `last_seen_at` is the latest of their page views and of their
        sessions' use. See `docs/privacy.md`.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        '200':
          description: The people found
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [members, visitors]
                    properties:
                      members:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            pseudo: { type: string }
                            email: { type: string }
                            created_at: { type: [string, 'null'], format: date-time }
                            last_seen_at: { type: [string, 'null'], format: date-time }
                            verified: { type: boolean }
                            roles: { type: array, items: { type: string } }
                      visitors:
                        type: array
                        items: { $ref: '#/components/schemas/JournalVisitor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /v1/admin/people/members/{id}:
    get:
      tags: [admin]
      operationId: getAdminPersonMember
      summary: A member's summary
      description: |
        The account, its XP and brains, the visitor ids linked to it (the
        latest first, 20 at most), counts of what it did ever (`logins`
        counts `login` and `oauth_login` events), and its latest consent
        answer (null without one). 404 for an unknown member.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The summary
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      member:
                        type: object
                        properties:
                          id: { type: integer }
                          pseudo: { type: string }
                          email: { type: string }
                          created_at: { type: [string, 'null'], format: date-time }
                          verified: { type: boolean }
                          onboarded: { type: boolean }
                          roles: { type: array, items: { type: string } }
                          xp: { type: integer }
                          brains: { type: integer }
                          last_seen_at: { type: [string, 'null'], format: date-time }
                          visitor_ids: { type: array, items: { type: string, format: uuid } }
                      counts:
                        type: object
                        properties:
                          page_views: { type: integer }
                          lessons_completed: { type: integer }
                          exercise_attempts: { type: integer }
                          games: { type: integer }
                          forum_posts: { type: integer }
                          room_messages: { type: integer }
                          downloads: { type: integer }
                          logins: { type: integer }
                      consent: { oneOf: [{ $ref: '#/components/schemas/JournalConsent' }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/people/members/{id}/events:
    get:
      tags: [admin]
      operationId: getAdminPersonMemberEvents
      summary: A member's timeline
      description: |
        Everything the member did, newest first, from every kind of
        `JournalItem` (their visitor's page views once linked included).
        404 for an unknown member.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - name: kinds
          in: query
          description: Comma-separated kinds to keep; an unknown one is a 400 on `kinds`.
          schema: { type: string, example: 'page_view,security' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: A page of the timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/people/visitors/{id}:
    get:
      tags: [admin]
      operationId: getAdminPersonVisitor
      summary: A visitor's summary
      description: |
        A visitor id seen in page views or consents: when, how many page
        views, the member it was linked to (null while anonymous), its
        latest consent answer. 404 when never seen.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The summary
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      visitor:
                        type: object
                        properties:
                          visitor_id: { type: string, format: uuid }
                          first_seen_at: { type: string, format: date-time }
                          last_seen_at: { type: string, format: date-time }
                          member_id: { type: [integer, 'null'] }
                      counts: { type: object, properties: { page_views: { type: integer } } }
                      consent: { oneOf: [{ $ref: '#/components/schemas/JournalConsent' }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/people/visitors/{id}/events:
    get:
      tags: [admin]
      operationId: getAdminPersonVisitorEvents
      summary: A visitor's timeline
      description: Its page views and consent answers, newest first.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - name: kinds
          in: query
          description: Comma-separated kinds to keep; an unknown one is a 400 on `kinds`.
          schema: { type: string, example: 'page_view,security' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: A page of the timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /v1/admin/activity:
    get:
      tags: [admin]
      operationId: getAdminActivity
      summary: Everybody's timeline
      description: |
        Every `JournalItem` of every member and visitor, newest first, each
        with `who`.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - name: kinds
          in: query
          description: Comma-separated kinds to keep; an unknown one is a 400 on `kinds`.
          schema: { type: string, example: 'page_view,security' }
      responses:
        '200':
          description: A page of the timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /v1/admin/settings/donation-goal:
    get:
      tags: [admin]
      operationId: getAdminDonationGoal
      summary: This month's donation goal, raw amounts
      description: Setting `objectif_dons` of `site.reglages`; 0 and 0 until set.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: The amounts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DonationGoal' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
    put:
      tags: [admin]
      operationId: putAdminDonationGoal
      summary: Sets the donation goal
      description: |
        Both amounts typed in by hand (no payment goes through the site),
        each a number from 0 to 1 000 000 (`too_small`, `too_large`,
        `required`). A goal of 0 takes it off the site.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DonationGoal' }
      responses:
        '200':
          description: The amounts stored
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DonationGoal' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '422': { $ref: '#/components/responses/InvalidFields' }
  /v1/admin/game/leaderboard:
    get:
      tags: [admin]
      operationId: getAdminGameLeaderboard
      summary: The game leaderboard, for an admin's session
      description: |
        The same parameters and body as `GET /v1/game/leaderboard`, for an
        admin's session through the site's relay (which refuses every
        `/v1/game*` path). `Cache-Control: no-store`, not the public cache.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - name: subject
          in: query
          schema: { $ref: '#/components/schemas/GameSubject' }
          description: Absent → `all`.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: The leaderboard
          content:
            application/json:
              schema:
                type: object
                required: [subject, data]
                properties:
                  subject: { $ref: '#/components/schemas/GameSubject' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GameLeader' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /v1/admin/game/stats:
    get:
      tags: [admin]
      operationId: getAdminGameStats
      summary: Game statistics, for a session
      description: |
        `GET /v1/game/admin/stats` for an admin's session (Laravel's
        `admin/jeu/statistiques`). Always 200: when the game hub does not
        answer, `available` is false, `reason` is `unavailable` and `stats`
        null. `days` is 7, 30 or 90, else 30.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
      responses:
        '200':
          description: The statistics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [days, available, reason, stats]
                    properties:
                      days: { type: integer }
                      available: { type: boolean }
                      reason: { type: [string, 'null'], enum: [unavailable, null] }
                      stats:
                        oneOf:
                          - { $ref: '#/components/schemas/GameAdminStats' }
                          - { type: 'null' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /v1/admin/languages/stats:
    get:
      tags: [admin]
      operationId: getAdminLanguageStats
      summary: Languages statistics, for a session
      description: |
        The body of `GET /v1/languages/admin/stats`, under `data`, for an
        admin's session. `days` is 7, 30 or 90, else 30.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
      responses:
        '200':
          description: The statistics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /v1/admin/news:
    get:
      tags: [admin]
      operationId: listAdminNews
      summary: Every announcement, drafts included
      description: Last changed first, 25 a page. `q` searches the title.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/AdminPage'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminListing'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AdminNews' } }
                      counters:
                        type: object
                        properties: { all: { type: integer }, published: { type: integer } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
    post:
      tags: [admin]
      operationId: createAdminNews
      summary: Writes an announcement, as a draft
      description: |
        `title` 5 to 150 characters, `lead` at most 500, `content_md` 20 to
        20 000; values are trimmed and an empty one is absent. The slug is
        made from the first 60 characters of the title, `-2`, `-3`… when
        taken. Publishing is a separate step.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminNewsBody' }
      responses:
        '201':
          description: The draft
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AdminNews' } } }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '422': { $ref: '#/components/responses/InvalidFields' }
  /v1/admin/news/{slug}:
    put:
      tags: [admin]
      operationId: updateAdminNews
      summary: Rewrites an announcement
      description: Same fields and rules as the creation. The slug never changes.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminNewsBody' }
      responses:
        '200':
          description: The announcement
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AdminNews' } } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }
    delete:
      tags: [admin]
      operationId: deleteAdminNews
      summary: Deletes an announcement
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminSlug'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/news/{slug}/publish:
    post:
      tags: [admin]
      operationId: publishAdminNews
      summary: Publishes an announcement
      description: '`published_at` becomes now, unless already set (a scheduled one stays scheduled).'
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminSlug'
      responses:
        '200':
          description: The announcement
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AdminNews' } } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/news/{slug}/unpublish:
    post:
      tags: [admin]
      operationId: unpublishAdminNews
      summary: Back to draft
      description: '`published_at` becomes null; the text is kept.'
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminSlug'
      responses:
        '200':
          description: The announcement
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AdminNews' } } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/courses:
    get:
      tags: [admin]
      operationId: listAdminCourses
      summary: Every course, drafts and archives included
      description: Last changed first, 25 a page, with the themes in use and the difficulties for the form.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: status, in: query, schema: { type: string, enum: [brouillon, publie, archive] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/AdminPage'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminListing'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AdminCourse' } }
                      counters:
                        type: object
                        properties:
                          all: { type: integer }
                          brouillon: { type: integer }
                          publie: { type: integer }
                          archive: { type: integer }
                      difficulties: { type: array, items: { $ref: '#/components/schemas/Difficulty' } }
                      themes: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
    post:
      tags: [admin]
      operationId: createAdminCourse
      summary: Creates a course, as a draft
      description: |
        `title` 5 to 150 characters, `description` 20 to 500, `theme` at
        most 100, `difficulty` one of `debutant`, `intermediaire`, `avance`,
        `duration_minutes` 5 to 600 or absent. Its chapters and lessons are
        not written here (`import-content`, `content fix`).
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                theme: { type: string, example: Mathématiques – Analyse }
                difficulty: { $ref: '#/components/schemas/Difficulty' }
                duration_minutes: { type: [integer, 'null'] }
      responses:
        '201':
          description: The draft
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AdminCourse' } } }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '422': { $ref: '#/components/responses/InvalidFields' }
  /v1/admin/courses/{slug}:
    delete:
      tags: [admin]
      operationId: deleteAdminCourse
      summary: Deletes a course nobody follows
      description: '`409` with `reason: has_enrollments` when members follow it: archive it instead.'
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminSlug'
      responses:
        '204': { description: Deleted, with its chapters, lessons and exercises }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/courses/{slug}/publish:
    post:
      tags: [admin]
      operationId: publishAdminCourse
      summary: Publishes a course
      description: |
        `422` with code `no_lessons` (on the body, `parameter: ""`) for a
        course without lessons. The first publication date is kept.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminSlug'
      responses:
        '200':
          description: The course
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AdminCourse' } } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }
  /v1/admin/courses/{slug}/unpublish:
    post:
      tags: [admin]
      operationId: unpublishAdminCourse
      summary: Back to draft (the publication date is kept)
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminSlug'
      responses:
        '200':
          description: The course
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AdminCourse' } } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/courses/{slug}/archive:
    post:
      tags: [admin]
      operationId: archiveAdminCourse
      summary: Archives a course (out of the library, progress kept)
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminSlug'
      responses:
        '200':
          description: The course
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AdminCourse' } } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/exams:
    get:
      tags: [admin]
      operationId: listAdminExams
      summary: Every exam, newest first, not paginated
      description: With the subjects and countries of the upload form.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: The exams
          content:
            application/json:
              schema:
                type: object
                required: [data, subjects, countries]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminExam' } }
                  subjects:
                    type: array
                    items:
                      type: object
                      properties: { value: { $ref: '#/components/schemas/ExamSubject' }, label: { type: string } }
                  countries: { type: array, items: { type: string, example: FR } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
    post:
      tags: [admin]
      operationId: uploadAdminExam
      summary: Uploads an exam paper (PDF)
      description: |
        `multipart/form-data`: `pdf` (required, a PDF by its content, at
        most 20 MiB: `not_pdf`, `too_large`), `subject`, `country` and an
        optional `ai_prompt` (at most 5000 characters). The body may be 21
        MiB (`413` beyond); another `Content-Type` is a `415`.

        The PDF is stored in `contenu.fichiers` (disk `local`, path
        `examens/<40 letters and digits>.pdf`). The exam waits
        (`attente_import`), titled after the file name, with the
        `import_prompt` to send to an AI with the PDF.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pdf, subject, country]
              properties:
                pdf: { type: string, format: binary }
                subject: { $ref: '#/components/schemas/ExamSubject' }
                country: { type: string, example: FR }
                ai_prompt: { type: string, maxLength: 5000 }
      responses:
        '201':
          description: The exam, waiting for the AI's answer
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AdminExam' } } }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/InvalidFields' }
  /v1/admin/exams/{slug}:
    delete:
      tags: [admin]
      operationId: deleteAdminExam
      summary: Deletes an exam, its parts and its statement PDF
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminSlug'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/exams/{slug}/pdf:
    get:
      tags: [admin]
      operationId: getAdminExamPdf
      summary: The statement PDF of any exam, drafts included
      description: 'Shown inline under its original name; `Cache-Control: private, no-store`.'
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminSlug'
      responses:
        '200':
          description: The PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/exams/{slug}/import:
    post:
      tags: [admin]
      operationId: importAdminExam
      summary: Imports the AI's answer
      description: |
        `ai_response`: the JSON the prompt asks for (French keys), at most
        2 000 000 characters, maybe in a ```` ```json ```` fence:

        ```json
        {"titre": "≤180", "type": "brevet|bac|blanc", "niveau": "≤50",
         "session": "≤80|null", "duree_minutes": "1..1440|null",
         "points_total": "1..1000|null", "description": "≤1000|null",
         "parties": [{"titre": "≤180", "points": "0..1000|null",
                      "enonce_md": "…", "corrige_md": "…"}]}
        ```

        Not JSON: `422` code `invalid_json` on `ai_response`; a field at
        fault is named `ai_response.parties.0.titre`. On success the parts
        are replaced (in order), the slug is made again from the title, and
        the exam is a draft (`brouillon`) to proofread. The body may be 16
        MiB.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ai_response]
              properties:
                ai_response: { type: string }
      responses:
        '200':
          description: The draft
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AdminExam' } } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }
  /v1/admin/exams/{slug}/publish:
    post:
      tags: [admin]
      operationId: publishAdminExam
      summary: Publishes an exam
      description: '`422` code `no_parts` without parts. Dated now; the AI error is cleared.'
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminSlug'
      responses:
        '200':
          description: The exam
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AdminExam' } } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }
  /v1/admin/exams/{slug}/unpublish:
    post:
      tags: [admin]
      operationId: unpublishAdminExam
      summary: Back to draft, `published_at` null
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminSlug'
      responses:
        '200':
          description: The exam
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AdminExam' } } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/resource-requests:
    get:
      tags: [admin]
      operationId: listAdminResourceRequests
      summary: The resources members propose
      description: Newest first, 20 a page.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: status, in: query, schema: { type: string, enum: [en_attente, acceptee, refusee] } }
        - $ref: '#/components/parameters/AdminPage'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminListing'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ResourceRequest' } }
                      counters:
                        type: object
                        properties:
                          all: { type: integer }
                          en_attente: { type: integer }
                          acceptee: { type: integer }
                          refusee: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /v1/admin/resource-requests/{id}/file:
    get:
      tags: [admin]
      operationId: getAdminResourceRequestFile
      summary: The proposed PDF, to read before deciding
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminId'
      responses:
        '200':
          description: The PDF, inline
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/resource-requests/{id}/accept:
    post:
      tags: [admin]
      operationId: acceptAdminResourceRequest
      summary: Accepts a request and publishes the resource
      description: |
        Optional `title` (≤200), `category` (≤120) and `reason` (≤1000).
        The resource is published from a copy of the file
        (`ressources/<uuid>.pdf`), with the request's credit, licence and
        language, credited internally to the member. `409`
        `already_handled` unless the request is pending; `404` when its
        file is not stored.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                category: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: The request, with `resource_slug`
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ResourceRequest' } } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidFields' }
  /v1/admin/resource-requests/{id}/reject:
    post:
      tags: [admin]
      operationId: rejectAdminResourceRequest
      summary: Refuses a request, with a reason
      description: '`reason` required (≤1000). `409` `already_accepted` for an accepted request.'
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: The request
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ResourceRequest' } } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidFields' }
  /v1/admin/members:
    get:
      tags: [admin]
      operationId: listAdminMembers
      summary: Accounts and their roles
      description: |
        By pseudo, 25 a page; `q` searches the pseudo and the address. With
        the role catalogue by category and whether the reader may give
        permission roles (a super admin).
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: q, in: query, schema: { type: string, maxLength: 60 } }
        - $ref: '#/components/parameters/AdminPage'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminListing'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AdminMember' } }
                      catalog:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            type: object
                            properties:
                              slug: { type: string }
                              name: { type: string }
                              color: { type: string }
                              description: { type: [string, 'null'] }
                      can_manage_permissions: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /v1/admin/members/{id}/roles/{role}:
    parameters:
      - $ref: '#/components/parameters/SessionToken'
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: role, in: path, required: true, schema: { type: string, example: physique } }
    put:
      tags: [admin]
      operationId: grantAdminRole
      summary: Gives a role (nothing changes if it is there)
      description: '`403` for a permission role unless the reader is a super admin; `404` for an unknown role or account.'
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AdminMember' } } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      operationId: revokeAdminRole
      summary: Takes a role away
      description: |
        Same rules as giving it; `422` code `own_super_admin` for one's own
        `super-admin` role.
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AdminMember' } } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }
  /v1/admin/reports:
    get:
      tags: [admin]
      operationId: listAdminReports
      summary: What readers reported
      description: Newest first, 25 a page.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: status, in: query, schema: { type: string, enum: [nouveau, retenu, corrige, refuse] } }
        - { name: type, in: query, schema: { type: string, enum: [faute, amelioration, spam, abus, hors_sujet] } }
        - $ref: '#/components/parameters/AdminPage'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminListing'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Report' } }
                      counters:
                        type: object
                        properties:
                          all: { type: integer }
                          nouveau: { type: integer }
                          retenu: { type: integer }
                          corrige: { type: integer }
                          refuse: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /v1/admin/reports/{id}:
    patch:
      tags: [admin]
      operationId: fileAdminReport
      summary: Files a report
      description: |
        `status` required; `reply` (≤1000) kept as it was when absent. Back
        to `nouveau`, who handled it and when are cleared; otherwise they
        become the reader and now.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [nouveau, retenu, corrige, refuse] }
                reply: { type: string }
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Report' } } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }
  /v1/admin/suggestions:
    get:
      tags: [admin]
      operationId: listAdminSuggestions
      summary: What members suggested
      description: Newest first, 20 a page.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: status, in: query, schema: { type: string, enum: [nouvelle, retenue, realisee, ecartee] } }
        - $ref: '#/components/parameters/AdminPage'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminListing'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Suggestion' } }
                      counters:
                        type: object
                        properties:
                          all: { type: integer }
                          nouvelle: { type: integer }
                          retenue: { type: integer }
                          realisee: { type: integer }
                          ecartee: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /v1/admin/suggestions/{id}:
    patch:
      tags: [admin]
      operationId: fileAdminSuggestion
      summary: Files a suggestion
      description: As a report; back to `nouvelle` clears who handled it.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [nouvelle, retenue, realisee, ecartee] }
                reply: { type: string }
      responses:
        '200':
          description: The suggestion
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Suggestion' } } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  # --- Members (step B): called by pulsars-web, from its server or its relay.

  /v1/me/progress:
    get:
      tags: [progress]
      operationId: getMyProgress
      summary: The gauge of every course the member started
      description: |
        `{slug: {done, total, percent}}` for each published course with at
        least one lesson completed (Laravel's `progressionsPour`): the
        library cards and the sidebar. Any session. `no-store`.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: The gauges
          content:
            application/json:
              example:
                data: { les-bases-du-calcul: { done: 3, total: 4, percent: 75 } }
        '401': { $ref: '#/components/responses/SessionInvalid' }

  /v1/me/courses/{slug}/progress:
    get:
      tags: [progress]
      operationId: getMyCourseProgress
      summary: The member's progress on a course
      description: |
        What the course and lesson pages show for the member
        (`Progression::resume`, `lessonDeReprise`): completed lessons (ids of
        `/v1/courses/{slug}`), percentage (`round`), and the lesson to resume
        at, the first one not completed, else the first. Any session;
        published courses only. `no-store`.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: slug, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The progress
          content:
            application/json:
              example:
                data:
                  enrolled: true
                  completed_lesson_ids: [1, 3]
                  done: 2
                  total: 4
                  percent: 50
                  completed: false
                  resume_lesson: { slug: les-fractions, title: Les fractions, lang: fr }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/lessons/{id}/completion:
    put:
      tags: [progress]
      operationId: setLessonCompletion
      summary: Mark a lesson completed, or to do again
      description: |
        Laravel's toggle (`POST cours/{course}/lecon/{slug}/termine`) with
        the wanted state in the body, so that a retried request does not undo
        itself. `completed: true`: the progress row (idempotent), the
        enrollment, its last lesson, its completion at 100 %, and 5 brains the
        first time the lesson is ever completed (`lecon:{id}`), in one
        transaction. `rewards.xp` is 10 when the lesson was not completed.
        `completed: false`: the row goes and the course is no longer
        completed; brains stay. Verified members (`auth`, `verified`,
        `onboarding`).
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              additionalProperties: false
              properties:
                completed: { type: boolean }
      responses:
        '200':
          description: Done
          content:
            application/json:
              example:
                data: { completed: true, progress: { done: 1, total: 4, percent: 25 }, course_completed: false }
                rewards: { xp: 10, brains: 5 }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { description: Address not verified or welcome steps not done. }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/exercises/{id}:
    get:
      tags: [practice]
      operationId: getMyExercise
      summary: The member's attempts at an exercise, and its solution once tried
      description: |
        The statement is `GET /v1/exercises/{id}`. `solution_md` is `null`
        until the member made an attempt (Laravel's rule: it would otherwise
        be read before answering); in `lang` when translated. The expected
        answers (`correctes`, `acceptees`) are never sent. Any session.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: id, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The member's state
          content:
            application/json:
              example:
                data:
                  attempt_count: 1
                  solved: false
                  last_attempt: { answer: { options: [a] }, correct: false, at: '2026-11-02T10:00:00Z' }
                  solution_md: La réponse est **7**.
                  lang: fr
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/exercises/{id}/attempts:
    post:
      tags: [practice]
      operationId: postAttempt
      summary: Answer an exercise
      description: |
        Graded here, as `CorrecteurExercice`: a QCM is right with exactly the
        right option ids (any order, duplicates ignored); a short answer when,
        normalized (case, accents, Cyrillic, spaces, final punctuation; `,` is
        `.`), it is one of the accepted answers of the exercise or of any of
        its translations; a free answer is never graded (`correct: null`).
        Every attempt is kept and enrolls on the course. `rewards.xp` is 8 on
        the first success only. The solution comes with the result. Verified
        members.

        Body: `{"options": [...]}` (QCM: at least one, each at most 50
        characters) or `{"text": "..."}` (short answer: at most 500; free
        answer: at most 5000), trimmed.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: id, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/Lang'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                options: { type: array, minItems: 1, items: { type: string, maxLength: 50 } }
                text: { type: string, maxLength: 5000 }
      responses:
        '201':
          description: Graded
          content:
            application/json:
              example:
                data: { correct: true, attempt_count: 1, solution_md: La réponse est `3/4`., lang: fr }
                rewards: { xp: 8, brains: null }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { description: Address not verified or welcome steps not done. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/exercises/catalog:
    get:
      tags: [practice]
      operationId: getExerciseCatalog
      summary: The catalogue of exercises, with the member's state
      description: |
        Laravel's `/exercices`: published exercises by course, chapter and
        position, 24 a page (`page`, `total`). `q` searches the title and the
        statement; `subject` is a slug of `/v1/exercises/facets`; `state`
        (`todo`: never solved, `new`: never tried, `solved`) only applies to a
        member and is ignored for a visitor. `solved` is `null` when never
        tried. Not cached (`no-store`): it changes with the reader; the
        public, cached list is `GET /v1/exercises`.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/Lang'
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: subject, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [qcm, reponse_courte, reponse_libre] } }
        - { name: difficulty, in: query, schema: { type: string, enum: [debutant, intermediaire, avance] } }
        - { name: state, in: query, schema: { type: string, enum: [todo, new, solved] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: One page
          content:
            application/json:
              example:
                data:
                  - id: 1
                    title: Appliquer les priorités
                    lang: fr
                    type: qcm
                    auto_corrected: true
                    course: { slug: les-bases-du-calcul, title: Les bases du calcul, lang: fr }
                    theme: Mathématiques
                    difficulty: debutant
                    xp: 8
                    solved: true
                    web_url: https://pulsars.science/cours/les-bases-du-calcul/exercice/1
                next_cursor: null
                total: 5
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/exercises/random:
    get:
      tags: [practice]
      operationId: getRandomExercise
      summary: One exercise drawn among the catalogue's filters
      description: |
        Same filters as the catalogue (`/exercices/aleatoire`). The exercise
        as `GET /v1/exercises/{id}`; 404 when none matches.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200': { description: 'The exercise: `{"data": Exercise}`' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/exercises/facets:
    get:
      tags: [practice]
      operationId: getExerciseFacets
      summary: The subjects of the catalogue
      description: The start of the published courses' themes, with exercises only.
      responses:
        '200':
          description: The subjects
          content:
            application/json:
              example:
                data: { subjects: [{ slug: mathematiques, name: Mathématiques, exercise_count: 5 }] }

  /v1/me/dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: The member's dashboard
      description: |
        `TableauDeBordController`: enrollments in progress and completed
        (latest first, the course's own title as Laravel showed it, the last
        lesson completed to resume at), distinct exercises tried and solved,
        the brains balance and its last 20 movements (lesson titles in
        `lang`), and the 4 latest published courses not started. Verified
        members.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The dashboard
          content:
            application/json:
              example:
                data:
                  in_progress:
                    - title: Les bases du calcul
                      slug: les-bases-du-calcul
                      difficulty: debutant
                      progress: { done: 1, total: 4, percent: 25 }
                      resume_lesson: { slug: les-fractions, title: Les fractions }
                  completed: []
                  stats: { courses_started: 1, courses_completed: 0, exercises_attempted: 2, exercises_solved: 1 }
                  brains:
                    balance: 5
                    movements:
                      - { id: 12, date: '2026-11-02T10:00:00Z', reason: lecon, amount: 5, lesson_title: Les fractions, season: null, subject: null, rank: null }
                  suggestions: [{ title: Le tableau périodique des éléments, slug: chimie-le-tableau-periodique, description: '…', difficulty: intermediaire }]
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { description: Address not verified or welcome steps not done. }

  /v1/me/brains:
    get:
      tags: [dashboard]
      operationId: getMyBrains
      summary: The member's brain movements, newest first
      description: The movements of the dashboard, paginated by cursor. Any session.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: '`{"data": [BrainMovement], "next_cursor"}`' }
        '401': { $ref: '#/components/responses/SessionInvalid' }

  /v1/leaderboard/xp:
    get:
      tags: [dashboard]
      operationId: getXpLeaderboard
      summary: Every member by XP
      description: |
        `ClassementController`: every account, XP 0 included, most XP first
        then pseudo; followers, whether the reader follows, roles. Laravel
        sent the whole list; here pages of `limit` (default 50) by cursor,
        and `me`, the reader's own line wherever it is. Verified members.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page
          content:
            application/json:
              example:
                data:
                  - { rank: 1, pseudo: ada, avatar_url: null, xp: 102, level: 2, followers: 0, followed: false, me: false, roles: [] }
                next_cursor: null
                me: { rank: 4, pseudo: jikuji, avatar_url: null, xp: 0, level: 1, followers: 1, followed: false, me: true, roles: [] }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { description: Address not verified or welcome steps not done. }

  /v1/leaderboard/top:
    get:
      tags: [dashboard]
      operationId: getXpTop
      summary: The home page's best members
      description: '`Experience::meilleurs`: members with some XP only. Public.'
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 5 } }
      responses:
        '200':
          description: The best
          content:
            application/json:
              example:
                data: [{ rank: 1, pseudo: ada, avatar_url: null, xp: 102, level: 2 }]

  /v1/rewards:
    get:
      tags: [dashboard]
      operationId: getRewards
      summary: What actions earn, in XP and brains
      responses:
        '200':
          description: The scale
          content:
            application/json:
              example:
                data:
                  xp: { lesson: 10, exercise: 8, course: 40, question: 4, answer: 4, accepted_answer: 12, game: 3, game_win: 5, game_daily_cap: 30 }
                  brains: { lesson: 5, game: 2, victory: 3, game_daily_cap: 20 }

  /v1/me/profile:
    get:
      tags: [profile]
      operationId: getProfile
      summary: The member's profile form
      description: Verified members. The goals and school levels are Laravel's `Support\Onboarding` keys.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: The profile
          content:
            application/json:
              example:
                data:
                  pseudo: ada
                  email: ada@example.org
                  bio: Mathématiques et café.
                  avatar_url: null
                  goals: [curiosite]
                  school_level: lycee
                  class: Terminale
                  locale: fr
                  member_since: '2026-08-10T09:00:00Z'
                  roles: [{ slug: mathematiques, name: Mathematiques, category: matiere, color: '#4f7df0' }]
                  interests: [mathematiques]
                  has_password: true
                  brains_public: true
                  linked_accounts: [{ provider: google, email: ada@gmail.com }]
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { description: Address not verified or welcome steps not done. }
    patch:
      tags: [profile]
      operationId: updateProfile
      summary: Save the profile form
      description: |
        As Laravel's form, the body is the whole form: a field left out is
        cleared (`interests` too: the subject roles become exactly the list),
        except `brains_public`, kept when absent. `pseudo`: required, 3 to
        30 letters, digits, `_` or `-`, free (ignoring case); it is also the
        `name`. `bio` at most 280, `class` at most 60; `goals` and
        `school_level` known keys. `interests` touch subject roles only,
        unknown slugs are ignored. Answers the new profile.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pseudo: { type: string }
                bio: { type: [string, 'null'], maxLength: 280 }
                goals: { type: array, items: { type: string, enum: [reviser-examen, rattraper, approfondir, curiosite, enseigner] } }
                school_level: { type: [string, 'null'], enum: [college, lycee, superieur, adulte, null] }
                class: { type: [string, 'null'], maxLength: 60 }
                interests: { type: array, items: { type: string } }
                brains_public: { type: boolean }
      responses:
        '200': { description: The new profile, as `GET`. }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403': { description: Address not verified or welcome steps not done. }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/me/onboarding:
    post:
      tags: [profile]
      operationId: postOnboarding
      summary: Answer the welcome questions
      description: |
        `goals` (at least one) and `school_level` are required, `class` (at
        most 60) and `interests` optional; the subjects are added to the
        member's, never removed. Sets `onboarding_at`, which `Verified`
        routes need. Any session, before the address is verified too.
        Replayable, as Laravel's.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                goals: { type: array, minItems: 1, items: { type: string } }
                school_level: { type: string, enum: [college, lycee, superieur, adulte] }
                class: { type: [string, 'null'], maxLength: 60 }
                interests: { type: array, items: { type: string } }
      responses:
        '204': { description: Done. }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/me/locale:
    put:
      tags: [profile]
      operationId: putLocale
      summary: The account's language
      description: '`LangueController`: for a member, `users.locale`. A visitor''s choice stays in the site''s cookie. Any session.'
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              additionalProperties: false
              properties:
                locale: { type: string, enum: [fr, en, ru] }
      responses:
        '204': { description: Saved. }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/me/avatar:
    put:
      tags: [profile]
      operationId: putAvatar
      summary: Upload an avatar
      description: |
        `multipart/form-data`, field `avatar`: a JPEG, PNG, WebP or GIF
        recognised by its content, at most 4 MiB and 6000 px a side (the
        rules of a suggestion's image: Laravel had no avatar upload). Stored
        in `contenu.fichiers` (disk `public`, `avatars/<random>.<ext>`), the
        previous one deleted. Codes: `required`, `too_large`,
        `invalid_image`, `too_large_dimensions`. Verified members.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              example:
                data: { avatar_url: 'https://pulsars.science/storage/avatars/Xq3….png' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '413': { description: Body over 21 MiB. }
        '415': { description: Not `multipart/form-data`. }
        '422': { $ref: '#/components/responses/InvalidFields' }
    delete:
      tags: [profile]
      operationId: deleteAvatar
      summary: Remove the avatar
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/SessionInvalid' }

  /v1/storage/{path}:
    get:
      tags: [profile]
      operationId: getPublicFile
      summary: A file of the public disk (avatars, suggestion images)
      description: |
        The old site's `/storage/{chemin}` (`FichierPublicController`):
        `PUBLIC_STORAGE_URL` points here through the site's `/storage/`
        relay. Random names that
        never change content: `Cache-Control: public, max-age=31536000,
        immutable`; `Content-Security-Policy: default-src 'none'; sandbox`.
      parameters:
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The file. }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/roles:
    get:
      tags: [profile]
      operationId: getRoles
      summary: The roles, by category
      description: E.g. `?category=matiere`, the subjects the forms offer.
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [permission, matiere, distinction] } }
      responses:
        '200':
          description: The roles
          content:
            application/json:
              example:
                data: [{ slug: physique, name: Physique, category: matiere, color: '#6a5acd' }]
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/captcha:
    get:
      tags: [feedback]
      operationId: getCaptcha
      summary: A captcha question for a visitor's report
      description: |
        `CaptchaArithmetique`: the sum of two digits from 1 to 9; `a` and
        `b` for a question in another language. The answer stays on the
        server, under the token, 10 minutes. 30 a minute per address.
      responses:
        '200':
          description: The question
          content:
            application/json:
              example:
                data: { token: 3q2v…, question: Combien font 3 + 4 ?, a: 3, b: 4 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Redis is down. }

  /v1/reports:
    post:
      tags: [feedback]
      operationId: postReport
      summary: Report a mistake, or suggest an improvement, on a content
      description: |
        `SignalementController`, open to visitors. `target_type`: `course`,
        `lesson`, `exercise` or `exam`, `target_id` its id; `type` one of
        `faute`, `amelioration`, `spam`, `abus`, `hors_sujet`; `message` 10 to
        2000 characters, `location` at most 300. A visitor sends
        `captcha_token` and `captcha_answer`: wrong (`incorrect`, the token
        stays usable) or already used (`used`). A content that does not exist
        is a 422 on `message` (`target_missing`). The same message on the
        same content (by the same member) again is a success with no new
        report. At most 30 an hour per member, 5 per visitor (`too_many` on
        `message`), and 20 a minute (429).
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_type, target_id, type, message]
              properties:
                target_type: { type: string, enum: [course, lesson, exercise, exam] }
                target_id: { type: integer }
                type: { type: string, enum: [faute, amelioration, spam, abus, hors_sujet] }
                message: { type: string, minLength: 10, maxLength: 2000 }
                location: { type: [string, 'null'], maxLength: 300 }
                captcha_token: { type: string }
                captcha_answer: { type: string }
      responses:
        '204': { description: Received. }
        '422': { $ref: '#/components/responses/InvalidFields' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/suggestions:
    post:
      tags: [feedback]
      operationId: postSuggestion
      summary: Send an idea to the team
      description: |
        `multipart/form-data`: `title` (at most 150), `message` (10 to 4000),
        an optional `image` (JPEG, PNG, WebP or GIF by content, at most
        4 MiB and 6000 px a side), stored on the public disk
        (`suggestions/<random>.<ext>`). At most 10 an hour (`too_many` on
        `message`) and 20 a minute (429). Verified members.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [message]
              properties:
                title: { type: string, maxLength: 150 }
                message: { type: string, minLength: 10, maxLength: 4000 }
                image: { type: string, format: binary }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              example: { data: { id: 7 } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '413': { description: Body over 21 MiB. }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/resource-requests:
    post:
      tags: [feedback]
      operationId: postResourceRequest
      summary: Propose a resource to publish
      description: |
        `DemandeRessourceController`, `multipart/form-data`: `title` and
        `author_name` (at most 200), `license` (a key of `/v1/licenses`;
        `autre` needs `license_custom`, at most 200, ignored otherwise),
        `description` (4000), `category` (120), `lang` (`fr`, `en`, `ru`),
        and `file`: a PDF (by content) of at most 20 MiB, stored on the
        private disk (`demandes-ressources/<random>.pdf`) with its original
        name and size. Pending (`en_attente`) until an admin decides. At most
        8 an hour (`too_many` on `file`) and 20 a minute (429). Verified
        members.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, author_name, license, file]
              properties:
                title: { type: string }
                author_name: { type: string }
                license: { type: string }
                license_custom: { type: string }
                description: { type: string }
                category: { type: string }
                lang: { type: string, enum: [fr, en, ru] }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Proposed
          content:
            application/json:
              example: { data: { id: 3, status: en_attente } }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '413': { description: Body over 21 MiB. }
        '422': { $ref: '#/components/responses/InvalidFields' }

  /v1/licenses:
    get:
      tags: [feedback]
      operationId: getLicenses
      summary: The licences a resource may have
      responses:
        '200':
          description: The licences, `autre` last
          content:
            application/json:
              example:
                data: [{ key: cc-by-4.0, name: CC BY 4.0, url: 'https://creativecommons.org/licenses/by/4.0/', free: false }, { key: autre, name: Autre (à préciser), url: null, free: true }]

  /v1/settings/donation-goal:
    get:
      tags: [feedback]
      operationId: getDonationGoal
      summary: The donations goal of the site's header
      description: |
        `ObjectifDons`, read side: `null` until a goal above 0 is set
        (`site.reglages`, `objectif_dons`). `percent` is
        `floor(raised / goal × 100)`, at most 100; amounts are numbers, for
        the site to format.
      responses:
        '200':
          description: The goal
          content:
            application/json:
              example:
                data: { percent: 24, raised: 120.5, goal: 500.0, currency: EUR }

  /v1/exams/{slug}/corrections:
    get:
      tags: [exams]
      operationId: getExamCorrections
      summary: What the exam page adds to the statement
      description: |
        `ExamenController::show`: the model answer of each part (in `lang`
        when translated), whether a correction PDF is stored, and the
        counters. Laravel showed corrections to everyone for a published
        exam: so does this route, for published exams only. The page calls
        it on every display: it counts the view, not again for the same
        member or visitor fingerprint within 20 seconds (`CompteurVues`).
        `no-store`.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: slug, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The corrections
          content:
            application/json:
              example:
                data:
                  parts: [{ part_id: 46, position: 1, lang: fr, correction_md: '…' }]
                  has_correction_pdf: true
                  views: 120
                  downloads: 45
                  downloaders: 31
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/telemetry/page-view:
    post:
      tags: [feedback]
      operationId: postPageView
      summary: Record a page view, after consent
      description: |
        Sent by the site's pages only when the visitor accepted the
        "mesure" cookies (`docs/privacy.md`). Recorded for the member of
        the session and/or the visitor id of `Pulsars-Visitor`; with
        neither, nothing is written (still 204). `path` must be a path of
        the site (starting with one `/`, at most 512 characters once its
        query and fragment are dropped: 422 `invalid` or `too_long`);
        `referrer` keeps only the origin of an external address, null for
        the site itself. Robots are ignored. Kept 13 months. `no-store`.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/VisitorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path]
              properties:
                path: { type: string, example: '/cours/les-bases-du-calcul?onglet=2' }
                referrer: { type: [string, 'null'], example: 'https://www.qwant.com/?q=pulsars' }
      responses:
        '204': { description: Received (recorded or not). }
        '422': { $ref: '#/components/responses/InvalidFields' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/consent:
    post:
      tags: [feedback]
      operationId: postConsent
      summary: Keep the proof of a consent banner answer
      description: |
        `measure`: whether the visitor accepted the "mesure" cookies;
        `version`: the banner's version (1 to 1 000 000, else 422
        `invalid`). Kept 25 months with the member and/or the visitor id
        (both may be null, for a refusal) and the visitor fingerprint,
        never the address. Robots are ignored. `no-store`.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - $ref: '#/components/parameters/VisitorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [measure, version]
              properties:
                measure: { type: boolean }
                version: { type: integer, minimum: 1, maximum: 1000000 }
      responses:
        '204': { description: Recorded. }
        '422': { $ref: '#/components/responses/InvalidFields' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/courses/{slug}/view:
    post:
      tags: [courses]
      operationId: postCourseView
      summary: Count a view of a course page
      description: |
        Called once from the browser by the course page, through the site's
        relay (`GET /v1/courses/{slug}` counts nothing: lesson and exercise
        pages read it too). No body. Counted in `contenu.courses.vues` and
        in the dashboard's views by day (`top_content` of
        `GET /v1/admin/stats`), not again for the same member or visitor
        fingerprint within 20 seconds (as an exam's corrections), and never
        for a robot (`User-Agent`). Always 204 for a published course,
        counted or not; `no-store`.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Received. }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/exams/{slug}/correction-pdf:
    get:
      tags: [exams]
      operationId: getExamCorrectionPdf
      summary: The correction PDF of a published exam
      description: |
        As `/v1/exams/{slug}/pdf` (ranges, ETag), named `{slug}-corrige.pdf`.
        With `disposition=attachment` it is a download of the exam: counted
        (robots excepted, by `User-Agent`), `Cache-Control: private,
        no-store`.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Disposition'
      responses:
        '200': { $ref: '#/components/responses/File' }
        '206': { $ref: '#/components/responses/FilePart' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    gameToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        EdDSA (Ed25519) JWT signed by the API and issued by
        `POST /v1/auth/token` (`iss` `https://api.pulsars.science`, `aud`
        `api.pulsars.science`, 5 minutes). Verified with the API's own key
        only; its public half is at `/.well-known/jwks.json`. See
        `auth-jwt.md`.

  parameters:
    AdminPage:
      name: page
      in: query
      description: Page number, from 1. Past the last page, `data` is empty.
      schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
    AdminSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    AdminId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    OptionalSessionToken:
      name: Pulsars-Session
      in: header
      description: A session token, to read as that member (votes, moderation view).
      schema: { type: string, minLength: 43, maxLength: 43 }
    ForumQuestionKey:
      name: question
      in: path
      required: true
      description: The question's id or slug (a slug always holds a `-` and letters).
      schema: { type: string, example: comment-factoriser-un-trinome-x7k2qa }
    ForumMessageId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    SessionToken:
      name: Pulsars-Session
      in: header
      required: true
      description: A session token from `/v1/auth/login`, `/register` or `/sessions`.
      schema: { type: string, minLength: 43, maxLength: 43 }
    VisitorId:
      name: Pulsars-Visitor
      in: header
      required: false
      description: |
        The anonymous visitor id the site keeps in its `pulsars_vid`
        cookie once the visitor accepted the "mesure" cookies, relayed on
        every request (`docs/privacy.md`). A UUID v4; anything else is
        ignored. When a session opens with it, the visitor's page views
        become the member's.
      schema: { type: string, format: uuid }
    ServiceKey:
      name: Pulsars-Service-Key
      in: header
      required: true
      description: The server's `SERVICE_KEY`; only the site has it.
      schema: { type: string }
    Lang:
      name: lang
      in: query
      description: |
        Language of the content. Absent → original language (`fr`). Falls back
        to French per object and per field when a translation is missing; each
        object says what it got in its own `lang` field.
      schema: { $ref: '#/components/schemas/LangCode' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque value from a previous `next_cursor`. Only valid with the same filters.
      schema: { type: string, maxLength: 512 }
    Page:
      name: page
      in: query
      description: |
        Page number, from 1, for clients that show numbered pages: the
        answer has `total` and no `next_cursor`. Not with `cursor`. Past the
        last page, `data` is empty and `total` still counts the matches.
      schema: { type: integer, minimum: 1, maximum: 1000 }
    Search:
      name: q
      in: query
      description: |
        Case-insensitive substring search on title and description, in the
        original text and in the translation for `lang`. Minimum 2 characters.
      schema: { type: string, minLength: 2, maxLength: 100 }
    Disposition:
      name: disposition
      in: query
      description: '`inline` (default) to show the file in the browser, `attachment` to save it.'
      schema: { type: string, enum: [inline, attachment], default: inline }
    CourseSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, example: les-bases-du-calcul }
    OptionalSession:
      name: Pulsars-Session
      in: header
      required: false
      description: A session token, when the reader is signed in.
      schema: { type: string, minLength: 43, maxLength: 43 }
    Pseudo:
      name: pseudo
      in: path
      required: true
      description: A member's pseudo, exactly.
      schema: { type: string }
    RoomSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    InviteToken:
      name: token
      in: path
      required: true
      schema: { type: string, maxLength: 40 }
    ThreadAfter:
      name: after
      in: query
      description: Only messages after this id, oldest first (polling).
      schema: { type: integer, minimum: 0 }
    ThreadBefore:
      name: before
      in: query
      description: The latest messages before this id. Not with `after`.
      schema: { type: integer, minimum: 0 }
    ThreadLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }

  headers:
    ETag:
      description: Strong validator, hash of the response body.
      schema: { type: string, example: '"5f2b9c1e"' }
    CacheControlPublic:
      schema: { type: string, example: 'public, max-age=300, stale-while-revalidate=60' }
    RateLimitLimit:
      schema: { type: integer, example: 60 }
    RateLimitRemaining:
      schema: { type: integer, example: 57 }
    RateLimitReset:
      description: Seconds until the window resets.
      schema: { type: integer, example: 41 }
    RetryAfter:
      schema: { type: integer, example: 12 }

  requestBodies:
    MessageBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [body]
            properties:
              body: { type: string, minLength: 1, maxLength: 2000, description: 'Plain text, trimmed.' }
    ForumTranslate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              lang: { type: string, enum: [en, fr, ru] }
    ForumHide:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              reason: { type: [string, 'null'], maxLength: 300 }

  responses:
    AdminOnly:
      description: The member is not an admin, has not verified their address or finished the welcome steps, or (roles) is not a super admin
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ForumTranslation:
      description: The translation
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/ForumTranslation' }
    ForumHidden:
      description: The state afterwards
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [hidden]
                properties:
                  hidden: { type: boolean }
    TranslationUnavailable:
      description: '`not_configured` (no DeepL key) or `upstream_failed` (DeepL did not answer properly)'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.pulsars.science/problems/unavailable
            title: Service unavailable
            status: 503
            detail: The translation service is not configured.
            reason: not_configured
    Opened:
      description: A new session and its account
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [session, user]
                properties:
                  session: { $ref: '#/components/schemas/Session' }
                  user: { $ref: '#/components/schemas/AccountUser' }
    InvalidBody:
      description: The body is not JSON, or has an unknown or mistyped field
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidFields:
      description: Field errors, all at once, each with a `code`
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.pulsars.science/problems/invalid-body
            title: Invalid body
            status: 422
            detail: One or more fields are invalid.
            errors:
              - { parameter: pseudo, detail: is already used by another account, code: taken }
              - { parameter: password, detail: must be at least 8 characters, code: too_short }
    InvalidToken:
      description: A link that is unknown, used, expired, or was sent to another address
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.pulsars.science/problems/invalid-token
            title: Invalid link
            status: 422
            detail: This link is unknown, already used, expired, or was sent to another address.
            errors:
              - { parameter: token, detail: 'is unknown, used, expired or for another address', code: invalid }
    Conflict:
      description: Conflicts with the account's state; `reason` is `taken`, `email_unverified` or `last_login_method`
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.pulsars.science/problems/conflict
            title: Conflict
            status: 409
            detail: "This is the account's only way to log in: set a password first."
            reason: last_login_method
    Resolved:
      description: The account of the identity, and its new session (none when linking to `current_user_id`)
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [user, session, created, linked]
                properties:
                  user: { $ref: '#/components/schemas/AccountUser' }
                  session:
                    oneOf:
                      - { $ref: '#/components/schemas/Session' }
                      - { type: 'null' }
                  created: { type: boolean, description: A new account was created. }
                  linked: { type: boolean, description: The identity was linked to an account that existed before. }
    SessionInvalid:
      description: Missing, unknown, expired or revoked session
      headers:
        WWW-Authenticate: { schema: { type: string, example: 'Session realm="api.pulsars.science"' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.pulsars.science/problems/session-invalid
            title: Invalid session
            status: 401
            detail: The session is missing, unknown, expired or revoked.
    Problem:
      description: A problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    File:
      description: The whole file
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Accept-Ranges: { schema: { type: string, const: bytes } }
        Content-Disposition: { schema: { type: string, example: 'inline; filename="misselbooks-abstract-algebra.pdf"' } }
        Cache-Control: { schema: { type: string, example: 'public, max-age=3600' } }
      content:
        application/pdf:
          schema: { type: string, format: binary }
    FilePart:
      description: One byte range of the file
      headers:
        Content-Range: { schema: { type: string, example: bytes 0-1023/562229 } }
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/pdf:
          schema: { type: string, format: binary }
    RangeNotSatisfiable:
      description: The range starts past the end of the file
      headers:
        Content-Range: { schema: { type: string, example: 'bytes */562229' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotModified:
      description: The `If-None-Match` value matches; no body.
    BadRequest:
      description: Invalid parameter or cursor
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.pulsars.science/problems/invalid-parameter
            title: Invalid parameter
            status: 400
            detail: One or more query parameters are invalid.
            instance: /v1/courses?limit=500
            errors:
              - { parameter: limit, detail: must be between 1 and 100 }
    NotFound:
      description: Unknown or unpublished resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.pulsars.science/problems/not-found
            title: Resource not found
            status: 404
            detail: No published course has the slug 'les-bases-du-calcul-2'.
            instance: /v1/courses/les-bases-du-calcul-2
    Unauthorized:
      description: Missing, invalid or expired token
      headers:
        WWW-Authenticate:
          schema: { type: string, example: 'Bearer error="invalid_token", error_description="token expired"' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.pulsars.science/problems/unauthorized
            title: Invalid token
            status: 401
            detail: The token has expired.
            instance: /v1/me
            reason: expired
    InsufficientScope:
      description: Valid token, but its `roles` do not allow this action
      headers:
        WWW-Authenticate:
          schema: { type: string, example: 'Bearer realm="api.pulsars.science", error="insufficient_scope"' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.pulsars.science/problems/insufficient-scope
            title: Insufficient scope
            status: 403
            detail: The game statistics need the admin or super-admin role.
            instance: /v1/game/admin/stats
            reason: insufficient_scope
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.pulsars.science/problems/rate-limited
            title: Too many requests
            status: 429
            detail: Limit of 60 requests per minute reached.
    FollowResult:
      description: Where the member stands with the other one now
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [following, friendship]
                properties:
                  following: { type: boolean }
                  friendship: { $ref: '#/components/schemas/FriendshipState' }
    FriendshipStateResponse:
      description: The friendship
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/FriendshipState' }
    FriendQr:
      description: The token and the link the QR code encodes
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [token, url]
                properties:
                  token: { type: string, pattern: '^[a-z0-9]{24}$' }
                  url: { type: string, format: uri, example: 'https://pulsars.science/ami/3f9k2m0q7x1b8n4c6v5z2l0p' }
    RoomOpened:
      description: A room, as its page shows it
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/RoomDetail' }
    ConversationId:
      description: The conversation
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [id]
                properties:
                  id: { type: integer }

